# ═══════════════════════════════════════════════════
# Nginx config لـ Qeema على سيرفر سعودي
# ضع هذا الملف في: /etc/nginx/sites-available/qeema
# ثم: sudo ln -s /etc/nginx/sites-available/qeema /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════

# إعادة التوجيه من HTTP إلى HTTPS
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # شهادة SSL من Let's Encrypt (Certbot يضع المسارات تلقائياً)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # الواجهة الأمامية — VVIP.html وملفات الـ assets
    root /var/www/qeema/public;
    index VVIP.html;

    # API proxy → Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # ملفات الـ public (api-client.js, manifest.json, sw.js)
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Service Worker — يجب أن يُقدَّم من جذر الموقع
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Fallback → VVIP.html
    location / {
        try_files $uri $uri/ /VVIP.html;
    }

    # Logs
    access_log /var/log/nginx/qeema-access.log;
    error_log  /var/log/nginx/qeema-error.log;
}
