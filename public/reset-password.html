<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور — يقظ</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/public/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Tajawal', sans-serif; background:#0d0f14; color:#e2e8f0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem; }
    .card {
      background:#111827; border:1px solid rgba(255,255,255,.08); border-radius:16px;
      padding:2.5rem; width:100%; max-width:420px;
    }
    .logo { display:flex; align-items:center; gap:10px; margin-bottom:2rem; justify-content:center; }
    .logo svg { width:40px; height:40px; border-radius:9px; }
    .logo-text { font-size:1.3rem; font-weight:900; color:#fff; }
    h2 { font-size:1.35rem; font-weight:900; color:#fff; margin-bottom:.5rem; text-align:center; }
    .sub { color:#64748b; font-size:.9rem; text-align:center; margin-bottom:1.75rem; }
    label { display:block; font-size:.88rem; font-weight:700; color:#94a3b8; margin-bottom:.4rem; }
    input {
      width:100%; background:#1e293b; border:1.5px solid rgba(255,255,255,.1); border-radius:8px;
      padding:.75rem 1rem; color:#e2e8f0; font-family:inherit; font-size:.97rem; outline:none; margin-bottom:1rem;
      transition:border-color .2s;
    }
    input:focus { border-color:#3b82f6; }
    .field { margin-bottom:1rem; }
    .alert { border-radius:8px; padding:.85rem 1rem; font-size:.9rem; font-weight:600; display:none; margin-bottom:1rem; }
    .alert.error   { background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }
    .alert.success { background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.3); color:#6ee7b7; }
    .btn {
      width:100%; background:linear-gradient(135deg,#1d4ed8,#2563eb); color:#fff;
      border:none; border-radius:10px; padding:.9rem; font-family:inherit;
      font-size:1rem; font-weight:900; cursor:pointer; transition:all .2s;
    }
    .btn:hover    { background:linear-gradient(135deg,#1e40af,#1d4ed8); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .back { text-align:center; margin-top:1.25rem; }
    .back a { color:#64748b; font-size:.87rem; text-decoration:none; }
    .back a:hover { color:#94a3b8; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%"><stop offset="0%" stop-color="#072235"/><stop offset="45%" stop-color="#02131f"/><stop offset="85%" stop-color="#010a12"/><stop offset="100%" stop-color="#00060a"/></radialGradient>
        <radialGradient id="ambientGlow" cx="50%" cy="50%" r="45%"><stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/><stop offset="45%" stop-color="#0088b3" stop-opacity="0.08"/><stop offset="100%" stop-color="#000000" stop-opacity="0"/></radialGradient>
        <radialGradient id="starGlow" cx="50%" cy="63%" r="22%"><stop offset="0%" stop-color="#00ffff" stop-opacity="0.35"/><stop offset="50%" stop-color="#008cb3" stop-opacity="0.12"/><stop offset="100%" stop-color="#000000" stop-opacity="0"/></radialGradient>
        <linearGradient id="centerLeftFacet" x1="20%" y1="90%" x2="95%" y2="20%"><stop offset="0%" stop-color="#007e9e"/><stop offset="35%" stop-color="#009cb8"/><stop offset="70%" stop-color="#00c8db"/><stop offset="100%" stop-color="#3ef0f7"/></linearGradient>
        <linearGradient id="centerRightFacet" x1="10%" y1="15%" x2="80%" y2="85%"><stop offset="0%" stop-color="#d6ffff"/><stop offset="25%" stop-color="#5ff4f9"/><stop offset="65%" stop-color="#00cde2"/><stop offset="100%" stop-color="#007d9f"/></linearGradient>
        <linearGradient id="leftWingGrad" x1="0%" y1="60%" x2="100%" y2="30%"><stop offset="0%" stop-color="#0087b8"/><stop offset="45%" stop-color="#00b4d6"/><stop offset="85%" stop-color="#3af2f8"/><stop offset="100%" stop-color="#a4fcff"/></linearGradient>
        <linearGradient id="rightWingGrad" x1="100%" y1="65%" x2="0%" y2="30%"><stop offset="0%" stop-color="#0079b3"/><stop offset="40%" stop-color="#00a8d4"/><stop offset="80%" stop-color="#4cf3f8"/><stop offset="100%" stop-color="#aefcff"/></linearGradient>
        <linearGradient id="starTopLeft" x1="20%" y1="80%" x2="80%" y2="20%"><stop offset="0%" stop-color="#00a0b2"/><stop offset="60%" stop-color="#36ecf2"/><stop offset="100%" stop-color="#e2feff"/></linearGradient>
        <linearGradient id="starTopRight" x1="80%" y1="80%" x2="20%" y2="20%"><stop offset="0%" stop-color="#008fa3"/><stop offset="50%" stop-color="#24dbe3"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
        <linearGradient id="starBottomLeft" x1="20%" y1="20%" x2="80%" y2="80%"><stop offset="0%" stop-color="#008ea0"/><stop offset="65%" stop-color="#00bcd0"/><stop offset="100%" stop-color="#006575"/></linearGradient>
        <linearGradient id="starBottomRight" x1="80%" y1="20%" x2="20%" y2="80%"><stop offset="0%" stop-color="#007b8c"/><stop offset="60%" stop-color="#00afc3"/><stop offset="100%" stop-color="#005866"/></linearGradient>
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="60"/></filter>
      </defs>
      <rect width="1254" height="1254" fill="url(#bgGrad)"/>
      <circle cx="627" cy="627" r="420" fill="url(#ambientGlow)" filter="url(#softGlow)"/>
      <circle cx="627" cy="795" r="220" fill="url(#starGlow)" filter="url(#softGlow)"/>
      <g id="logo-marks">
        <path d="M 528 449 L 289 663 A 18 18 0 0 0 288 684 L 348 815 Z" fill="url(#leftWingGrad)"/>
        <path d="M 726 449 L 906 815 L 966 684 A 18 18 0 0 0 965 663 Z" fill="url(#rightWingGrad)"/>
        <path d="M 627 277 L 463 715 L 627 622 Z" fill="url(#centerLeftFacet)"/>
        <path d="M 627 277 L 627 622 L 791 715 Z" fill="url(#centerRightFacet)"/>
        <line x1="627" y1="277" x2="627" y2="622" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75"/>
        <path d="M 627 678 C 627 750 575 795 528 795 L 627 795 Z" fill="url(#starTopLeft)"/>
        <path d="M 627 678 C 627 750 679 795 726 795 L 627 795 Z" fill="url(#starTopRight)"/>
        <path d="M 528 795 C 575 795 627 840 627 912 L 627 795 Z" fill="url(#starBottomLeft)"/>
        <path d="M 726 795 C 679 795 627 840 627 912 L 627 795 Z" fill="url(#starBottomRight)"/>
        <circle cx="627" cy="795" r="7" fill="#ffffff" opacity="0.95"/>
      </g>
    </svg>
    <span class="logo-text">يقظ</span>
  </div>

  <!-- Forgot Password Form -->
  <div id="forgot-section">
    <h2>نسيت كلمة المرور؟</h2>
    <p class="sub">أدخل بريدك الإلكتروني وسنرسل لك رابط الاسترداد</p>
    <div id="alert-forgot" class="alert"></div>
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email-input" placeholder="example@email.com" onkeydown="if(event.key==='Enter')sendReset()">
    </div>
    <button class="btn" id="btn-forgot" onclick="sendReset()">إرسال رابط الاسترداد</button>
    <div class="back"><a href="/">← العودة للرئيسية</a></div>
  </div>

  <!-- Reset Password Form -->
  <div id="reset-section" style="display:none;">
    <h2>تعيين كلمة مرور جديدة</h2>
    <p class="sub">اختر كلمة مرور قوية لحسابك</p>
    <div id="alert-reset" class="alert"></div>
    <div class="field">
      <label>كلمة المرور الجديدة</label>
      <input type="password" id="new-pass" placeholder="8 أحرف على الأقل، كبير وصغير">
    </div>
    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="confirm-pass" placeholder="أعد كتابة كلمة المرور" onkeydown="if(event.key==='Enter')doReset()">
    </div>
    <button class="btn" id="btn-reset" onclick="doReset()">تعيين كلمة المرور</button>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token  = params.get('token');
const isAdmin = params.get('type') === 'admin';
const resetEndpoint = isAdmin ? '/api/admin/reset-password' : '/api/auth/reset-password';

if (token) {
  document.getElementById('forgot-section').style.display = 'none';
  document.getElementById('reset-section').style.display  = 'block';
}

function showAlert(id, msg, type='error') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = `alert ${type}`;
  el.style.display = 'block';
}

async function sendReset() {
  const email = document.getElementById('email-input').value.trim();
  if (!email) return showAlert('alert-forgot','أدخل البريد الإلكتروني');
  const btn = document.getElementById('btn-forgot');
  btn.disabled = true;
  btn.textContent = 'جارٍ الإرسال...';
  try {
    const res  = await fetch('/api/auth/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    showAlert('alert-forgot', data.message || 'تم الإرسال', data.success ? 'success' : 'error');
  } catch {
    showAlert('alert-forgot','تعذّر الاتصال، حاول لاحقاً');
  } finally {
    btn.disabled = false;
    btn.textContent = 'إرسال رابط الاسترداد';
  }
}

async function doReset() {
  const newPass = document.getElementById('new-pass').value;
  const confirm = document.getElementById('confirm-pass').value;
  if (!newPass || !confirm) return showAlert('alert-reset','يجب ملء الحقلين');
  if (newPass !== confirm)  return showAlert('alert-reset','كلمتا المرور غير متطابقتين');
  if (newPass.length < 8 || !/[a-z]/.test(newPass) || !/[A-Z]/.test(newPass)) {
    return showAlert('alert-reset','كلمة المرور يجب أن تكون 8 أحرف وتحتوي على كبير وصغير');
  }
  const btn = document.getElementById('btn-reset');
  btn.disabled = true;
  btn.textContent = 'جارٍ التحديث...';
  try {
    const res  = await fetch(resetEndpoint, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, new_password: newPass })
    });
    const data = await res.json();
    if (data.success) {
      showAlert('alert-reset', data.message, 'success');
      setTimeout(() => window.location.href = isAdmin ? '/admin' : '/', 2000);
    } else {
      showAlert('alert-reset', data.message || 'حدث خطأ');
    }
  } catch {
    showAlert('alert-reset','تعذّر الاتصال، حاول لاحقاً');
  } finally {
    btn.disabled = false;
    btn.textContent = 'تعيين كلمة المرور';
  }
}
</script>
</body>
</html>
