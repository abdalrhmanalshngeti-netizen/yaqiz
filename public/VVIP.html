// ── FIFO: يخصم من أقدم الدُفعات أولاً ويُعيد تكلفة المبيعات ──
function fifoDeduct(product, qtyToDeduct) {
  if (!product.lots || !product.lots.length) {
    // أنشئ دفعة ضمنية من الرصيد الحالي عند أول استخدام
    if ((product.qty || 0) > 0 && (product.buy_price || 0) > 0) {
      product.lots = [{ qty: product.qty, cost: product.buy_price, date: new Date(0).toISOString(), ref: 'initial' }];
    } else { return 0; }
  }
  product.lots.sort((a, b) => new Date(a.date) - new Date(b.date));
  let remaining = qtyToDeduct, cogs = 0;
  for (const lot of product.lots) {
    if (remaining <= 0) break;
    const take = Math.min(remaining, lot.qty);
    cogs += take * lot.cost;
    lot.qty -= take;
    remaining -= take;
  }
  product.lots = product.lots.filter(l => l.qty > 0);
  if (product.lots.length > 0) product.buy_price = product.lots[0].cost;
  return Math.round(cogs * 100) / 100;
}

function doInventoryUpdate() {
  const db = getDB();
  if(!db.stock_moves) db.stock_moves = [];
  if(!db.nextId.stock_move) db.nextId.stock_move = 1;
  const missing = [];
  _pendingInventoryItems.forEach(item => {
    const prod = db.products.find(x =>
      x.name.trim().toLowerCase() === item.name.trim().toLowerCase() ||
      x.id === item.product_id
    );
    if (prod) {
      const oldQty = prod.qty;
      prod.qty += item.qty;
      // إضافة دفعة FIFO
      if (!prod.lots) prod.lots = [];
      prod.lots.push({ qty: item.qty, cost: item.price || prod.buy_price || 0, date: new Date().toISOString(), ref: `PUR-${_pendingPurchaseId}` });
      // تحديث سعر الشراء بأحدث سعر شراء + تطبيق سياسة التسعير فوراً لتفادي تعارض _diffAndPush
      if (item.price) {
        prod.buy_price = item.price;
        if (prod.auto_price_update && prod.profit_policy_type === 'percentage_on_cost') {
          const margin = parseFloat(prod.profit_policy_value) || 0;
          if (margin > 0) {
            prod.sell_price = Math.round(item.price * (1 + margin / 100) * 100) / 100;
          }
        }
      }
      db.stock_moves.push({
        id: db.nextId.stock_move++,
        product_id: prod.id, product_name: prod.name, product_code: prod.code,
        type: 'in', qty: item.qty, balance_before: oldQty, balance_after: prod.qty,
        reason: `فاتورة شراء #${_pendingPurchaseId}`,
        reference: `PUR-${_pendingPurchaseId}`,
        date: new Date().toISOString()
      });
    } else {
      missing.push(item);
    }
  });
  saveDB(db);
  if (missing.length === 0) {
    showToast(lang==='ar'?'✅ تم تحديث المخزون':'✅ Inventory updated');
    closeModal(); renderPage();
  } else {
    showMissingProductsForm(missing);
  }
}

function saveMissingProducts() {
  const db = getDB();
  if(!db.nextId) db.nextId = {};
  if(!db.nextId.product) db.nextId.product = 1;
  if(!db.stock_moves) db.stock_moves = [];
  if(!db.nextId.stock_move) db.nextId.stock_move = 1;
  for (let i = 0; i < _pendingMissingProducts.length; i++) {
    const item = _pendingMissingProducts[i];
    const code = (el(`mp-code-${i}`)?.value || '').trim();
    const sellPrice = Number(el(`mp-sell-${i}`)?.value || 0);
    if (!code) { showToast(`${lang==='ar'?'أدخل الباركود لـ':'Enter barcode for'}: ${item.name}`, 'error'); return; }
    if (!sellPrice) { showToast(`${lang==='ar'?'أدخل سعر البيع لـ':'Enter sell price for'}: ${item.name}`, 'error'); return; }
    const newProd = {
      id: nextId(db, 'product'),
      code,
      name: item.name,
      category: lang==='ar'?'بضاعة':'Goods',
      buy_price: item.price || 0,
      sell_price: sellPrice,
      qty: item.qty,
      min_qty: 0,
      created_at: new Date().toISOString()
    };
    db.products.push(newProd);
    db.stock_moves.push({
      id: db.nextId.stock_move++,
      product_id: newProd.id, product_name: newProd.name, product_code: newProd.code,
      type: 'in', qty: item.qty, balance_before: 0, balance_after: item.qty,
      reason: `فاتورة شراء #${_pendingPurchaseId}`,
      reference: `PUR-${_pendingPurchaseId}`,
      date: new Date().toISOString()
    });
  }
  saveDB(db);
  showToast(lang==='ar'?'✅ تمت إضافة الأصناف للمخزون':'✅ Items added to inventory');
  closeModal(); renderPage();
}

function calcPurchVat() {
  const a = Number(el('p-amount')?.value||0);
  const vat = a*0.15;
  if(el('p-vat')) el('p-vat').value = fmtMoney(vat);
  if(el('opex-total')) el('opex-total').textContent = fmtMoney(a+vat);
}

function savePurchase(purchase_type) {
  const db = getDB();
  const amount = Number(el('p-amount').value||0);
  if(!el('p-vendor').value){showToast(lang==='ar'?'أدخل اسم الجهة':'Enter payee name','error');return;}
  if(!amount){showToast(lang==='ar'?'أدخل المبلغ':'Enter amount','error');return;}
  const vat = amount*0.15;
  const dateVal = el('p-opex-date')?.value||new Date().toISOString().slice(0,10);
  const p = {
    id: nextId(db,'purchase'),
    vendor: el('p-vendor').value,
    description: el('p-desc').value,
    category: el('p-cat').value,
    purchase_type: 'opex',
    amount, vat, total: amount+vat,
    payment_method:'نقدي', paid_amount:amount+vat, remaining_amount:0, status:'مسدد',
    created_at: new Date(dateVal).toISOString()
  };
  db.purchases.push(p);

  // Treasury
  db.treasury.balance -= p.total;
  db.treasury.moves.unshift({id:nextId(db,'treasury'),type:'out',amount:p.total,
    description:`مصروف إداري: ${p.vendor} — ${p.category}`,reference:'',date:new Date().toISOString()});

  // Journal entry: Dr. Expense + Dr. Input VAT / Cr. Cash
  if(!db.journal)db.journal=[];
  if(!db.nextId.journal)db.nextId.journal=1;
  db.journal.push({
    id:db.nextId.journal++, date:new Date(dateVal).toISOString(),
    description:`مصروف إداري: ${p.vendor} — ${p.category}`,
    entries:[
      {account:`${p.category}`, account_code:'5200', side:'debit', amount},
      {account:lang==='ar'?'ضريبة المدخلات':'Input VAT', account_code:'2210', side:'debit', amount:vat},
      {account:lang==='ar'?'النقدية':'Cash', account_code:'1100', side:'credit', amount:p.total},
    ],
    ref:`EXP-${p.id}`
  });

  saveDB(db);
  logActivity('مصاريف إدارية',`${p.category}: ${p.vendor} — ${fmtMoney(p.total)}`);
  showToast(`✅ ${lang==='ar'?'تم حفظ المصروف الإداري':'Admin expense saved'}`);
  closeModal(); renderPage();
}

function togglePrPolicyFields() {
  const on = el('pr-auto')?.checked;
  const f  = el('pr-policy-fields');
  if (f) f.style.display = on ? 'block' : 'none';
  if (on) updatePricingPreview();
}

function updatePricingPreview() {
  const on  = el('pr-auto')?.checked;
  const f   = el('pr-policy-fields');
  if (f) f.style.display = on ? 'block' : 'none';
  if (!on) return;
  const previewEl = el('pr-pricing-preview');
  if (!previewEl) return;
  const buy         = parseFloat(el('pr-buy')?.value)  || 0;
  const pct         = parseFloat(el('pr-policy-val')?.value) || 0;
  const currentSell = parseFloat(el('pr-sell')?.value) || 0;

  if (buy <= 0) {
    previewEl.innerHTML = `<span style="color:var(--text-muted);font-size:12px;">👆 أدخل سعر الشراء أعلاه لتظهر الحسبة</span>`;
    return;
  }

  if (pct <= 0) {
    // تحذير: نسبة الربح صفر تعني سعر البيع = سعر الشراء عند وصول مشتريات
    const curWithVat = Math.round(currentSell * 1.15 * 100) / 100;
    const curMargin  = currentSell > 0 && buy > 0
      ? Math.round((currentSell - buy) / buy * 100 * 100) / 100 : 0;
    previewEl.innerHTML = `
      <div style="padding:10px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);border-radius:8px;font-size:12px;">
        <div style="color:#fbbf24;font-weight:800;margin-bottom:8px;">⚠️ نسبة الربح = 0% — انتبه!</div>
        <div style="color:#cbd5e1;line-height:2;">
          <div style="display:flex;justify-content:space-between;">
            <span>💲 سعر الشراء (التكلفة)</span>
            <strong style="color:#f1f5f9;">${buy.toFixed(2)} ر.س</strong>
          </div>
          ${currentSell > 0 ? `
          <div style="display:flex;justify-content:space-between;">
            <span>🏷️ سعر البيع الحالي (قبل الضريبة)</span>
            <strong style="color:#60a5fa;">${currentSell.toFixed(2)} ر.س <span style="font-size:10px;color:#94a3b8;">(هامش ${curMargin}%)</span></strong>
          </div>
          <div style="display:flex;justify-content:space-between;">
            <span>💰 للزبون شامل الضريبة</span>
            <strong style="color:#34d399;">${curWithVat.toFixed(2)} ر.س</strong>
          </div>` : ''}
        </div>
        <div style="margin-top:8px;color:#fbbf24;font-size:11px;">لو وصل شراء جديد بهذا السعر → سيُعاد حساب سعر البيع = ${buy.toFixed(2)} ر.س (ربح صفر!) — أدخل نسبة ربح لحماية هامشك</div>
      </div>`;
    return;
  }

  const profitAmt   = Math.round(buy * (pct / 100) * 100) / 100;
  const sellPreTax  = Math.round((buy + profitAmt) * 100) / 100;
  const vatAmt      = Math.round(sellPreTax * 0.15 * 100) / 100;
  const sellWithTax = Math.round((sellPreTax + vatAmt) * 100) / 100;
  previewEl.innerHTML = `
    <div style="display:grid;gap:5px;font-size:12px;">
      <div style="display:flex;justify-content:space-between;color:#94a3b8;">
        <span>💲 سعر الشراء (التكلفة)</span>
        <strong style="color:#f1f5f9;">${buy.toFixed(2)} ر.س</strong>
      </div>
      <div style="display:flex;justify-content:space-between;color:#94a3b8;">
        <span>➕ الربح المضاف (${pct}%)</span>
        <strong style="color:#fbbf24;">+ ${profitAmt.toFixed(2)} ر.س</strong>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,.1);padding-top:5px;display:flex;justify-content:space-between;">
        <span style="color:#cbd5e1;">🏷️ سعر البيع (قبل الضريبة)</span>
        <strong style="color:#60a5fa;">${sellPreTax.toFixed(2)} ر.س</strong>
      </div>
      <div style="display:flex;justify-content:space-between;color:#94a3b8;">
        <span>🧾 ضريبة القيمة المضافة 15%</span>
        <strong>+ ${vatAmt.toFixed(2)} ر.س</strong>
      </div>
      <div style="border-top:1px solid rgba(255,255,255,.15);padding-top:5px;display:flex;justify-content:space-between;">
        <span style="color:#fff;font-weight:800;">💰 للزبون شامل الضريبة</span>
        <strong style="color:#34d399;font-size:14px;">${sellWithTax.toFixed(2)} ر.س</strong>
      </div>
    </div>`;
}

function startBarcodeScan() {
  const inp = el('pr-barcode');

  const btn = el('pr-scan-btn');

  inp.value = '';
  inp.focus();
  inp.style.borderColor = '#16a34a';
  inp.style.boxShadow = '0 0 0 3px #bbf7d0';
  if(hint) hint.style.display = 'block';
  if(btn) { btn.textContent = '⏳ ' + (lang==='ar'?'في الانتظار...':'Waiting...'); btn.style.color='#16a34a'; }
  // إعادة الحقل لوضعه الطبيعي بعد أن يُقرأ الباركود (Enter)
  inp.onkeydown = function(e) {
    if(e.key === 'Enter') {
      e.preventDefault();
      inp.style.borderColor = '';
      inp.style.boxShadow = '';
      if(hint) hint.style.display = 'none';
      if(btn) { btn.innerHTML = '📷 ' + (lang==='ar'?'مسح':'Scan'); btn.style.color=''; }
      inp.onkeydown = null;
      // انتقل لحقل الاسم إذا كان فارغاً
      if(!el('pr-name').value) el('pr-name').focus();
      else el('pr-buy').focus();
    }
  };
}

function saveProduct(id) {
  const db = getDB();

  const autoOn = el('pr-auto')?.checked || false;
  const polVal = parseFloat(el('pr-policy-val')?.value) || 0;
  const buyPrice = Number(el('pr-buy').value);

  // احسب سعر البيع فوراً إذا كان التسعير الديناميكي مفعّلاً
  let sellPrice = Number(el('pr-sell').value);
  if (has('pricing.manage') && autoOn && polVal > 0 && buyPrice > 0) {
    sellPrice = Math.round(buyPrice * (1 + polVal / 100) * 100) / 100;
  }

  const data = {
    name:el('pr-name').value, code:el('pr-code').value,
    barcode:el('pr-barcode')?.value?.trim()||'',
    category:el('pr-cat').value, unit:el('pr-unit').value,
    buy_price: buyPrice, sell_price: sellPrice,
    qty:Number(el('pr-qty').value), min_qty:Number(el('pr-min').value)
  };
  if(!data.name){showToast(lang==='ar'?'اسم المنتج مطلوب':'Product name required','error');return;}

  if (has('pricing.manage')) {
    data.auto_price_update   = autoOn;
    data.profit_policy_type  = autoOn ? 'percentage_on_cost' : 'none';
    data.profit_policy_value = polVal;
  }

  if(id) { const p=db.products.find(x=>x.id===id); if(p) Object.assign(p,data); }
  else { db.products.push({id:nextId(db,'product'), created_at:new Date().toISOString(), ...data}); }
  saveDB(db);
  showToast(autoOn && polVal > 0 ? `✅ تم الحفظ — سعر البيع الجديد: ${sellPrice} ر.س` : `✅ ${t('save')}`);
  closeModal(); renderPage();

  // إرسال سياسة التسعير للـ API (صلاحية مستقلة — للمنتجات الموجودة فقط)
  if (id && has('pricing.manage') && window._cloudApiFetch) {
    window._cloudApiFetch('PUT', `/api/products/${id}/pricing-policy`, {
      profit_policy_type:  autoOn ? 'percentage_on_cost' : 'none',
      profit_policy_value: polVal,
      auto_price_update:   autoOn
    }).catch(e => {
      console.error('pricing policy save failed:', e);
      showToast('⚠️ تعذّر حفظ سياسة التسعير على الخادم: ' + (e.message||'خطأ'), 'error');
    });
  }
}

function deleteProduct(id) {
  if(!confirm(t('confirm'))) return;
  const db=getDB(); db.products=db.products.filter(p=>p.id!==id); saveDB(db); renderPage();
}

function saveTreasuryMove(type) {
  const db = getDB();
  const amount = Number(el('tr-amount').value||0);
  if(!amount){showToast(lang==='ar'?'أدخل المبلغ':'Enter amount','error');return;}
  const m = {id:nextId(db,'treasury'),type,amount,description:el('tr-desc').value,reference:el('tr-ref').value,date:new Date().toISOString()};
  db.treasury.moves.unshift(m);
  db.treasury.balance += type==='in'?amount:-amount;

  // Journal entry
  if(!db.journal)db.journal=[];
  if(!db.nextId.journal)db.nextId.journal=1;
  db.journal.push({
    id:db.nextId.journal++, date:new Date().toISOString(),
    description:`${type==='in'?(lang==='ar'?'إيداع خزينة':'Treasury Deposit'):(lang==='ar'?'صرف خزينة':'Treasury Withdrawal')}: ${el('tr-desc').value}`,
    entries: type==='in' ? [
      {account:lang==='ar'?'النقدية':'Cash', account_code:'1100', side:'debit', amount},
      {account:lang==='ar'?'إيرادات أخرى':'Other Income', account_code:'4900', side:'credit', amount},
    ] : [
      {account:lang==='ar'?'مصاريف أخرى':'Other Expenses', account_code:'5900', side:'debit', amount},
      {account:lang==='ar'?'النقدية':'Cash', account_code:'1100', side:'credit', amount},
    ],
    ref: el('tr-ref').value||''
  });

  saveDB(db); showToast(`✅ ${t('save')}`); closeModal(); renderPage();
}

function selectAccMainType(key) {
  const cat  = _ACC_CATS[key];
  const subs = _ACC_SUBTYPES[cat?.type] || [];

  // تحديث أزرار النوع الرئيسي
  _ACC_CATS.forEach(ct => {
    const btn = el('mtype-' + ct.key);
    if (!btn) return;
    btn.style.background = ct.key === key ? 'var(--primary)' : 'var(--surface)';
    btn.style.color      = ct.key === key ? '#fff' : 'var(--text)';
  });

  el('ac-main-key').value = key;

  el('acc-sub-options').innerHTML = subs.map(s=>`
    <label style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;margin-bottom:7px;transition:.15s"
      onmouseover="this.style.borderColor='var(--primary-light)'"
      onmouseout="this.style.borderColor='var(--border)'">
      <input type="radio" name="ac-sub" value="${s.v}" style="margin-top:4px;accent-color:var(--primary)" />
      <div>
        <div style="font-weight:800;font-size:13px;margin-bottom:2px">${s.v}</div>
        <div style="font-size:12px;color:var(--text-muted)">${s.tip}${s.ex?` — <span style="color:var(--primary-dark)">${s.ex}</span>`:''}</div>
      </div>
    </label>`).join('');

  el('acc-sub-section').style.display  = 'block';

function saveAccount() {
  const db      = getDB();
  const code    = (el('ac-code')?.value||'').trim();
  const name    = (el('ac-name')?.value||'').trim();
  const nameEn  = (el('ac-name-en')?.value||'').trim();
  const mainKey = parseInt(el('ac-main-key')?.value ?? '-1');
  const cat     = _ACC_CATS[mainKey];
  const subEl   = document.querySelector('input[name="ac-sub"]:checked');

  if (!code || !name) { showToast(lang==='ar'?'❌ الرمز والاسم مطلوبان':'❌ Code and name required'); return; }
  if (!cat)           { showToast(lang==='ar'?'❌ اختر النوع الرئيسي':'❌ Choose main type'); return; }
  if (!subEl)         { showToast(lang==='ar'?'❌ اختر النوع الفرعي':'❌ Choose sub-type'); return; }

  const parent = db.accounts.find(a => a.is_group && a.parent == null && a.type === cat.type);

  db.accounts.push({
    id: nextId(db,'account'),
    code, name, name_en: nameEn,
    type: cat.type,
    sub_type: subEl.value,
    is_group: false,
    parent: parent?.id ?? null,
  });

  saveDB(db);
  showToast(`✅ ${t('save')}`);
  closeModal();
  renderPage();
}

function deleteAccount(id) {
  if (!confirm(t('confirm'))) return;
  const db = getDB();
  db.accounts = db.accounts.filter(a => a.id !== id);
  saveDB(db);
  renderPage();
}

let overdueTab = 'customers';
function renderOverdueReport(c) {
  const db  = getDB();
  const now = new Date();
  const buckets = [
    {label:lang==='ar'?'1 — 30 يوم':'1-30 days',  min:1,  max:30,       color:'#f59e0b'},
    {label:lang==='ar'?'31 — 60 يوم':'31-60 days', min:31, max:60,       color:'#ef4444'},
    {label:lang==='ar'?'61 — 90 يوم':'61-90 days', min:61, max:90,       color:'#dc2626'},
    {label:lang==='ar'?'أكثر من 90 يوم':'+90 days',min:91, max:Infinity, color:'#7f1d1d'},
  ];

  const isCust = overdueTab === 'customers';

  // --- بيانات العملاء: حساب ديناميكي من السندات مباشرة ---
  const custRows = [];
  db.customers.forEach(cu=>{
    const allInvs = db.invoices.filter(i=>i.customer_name===cu.name);
    if(!allInvs.length) return;
    const totalInv = allInvs.reduce((s,i)=>s+(i.grand_total||0),0);
    const totalRcv = (db.receipts||[]).filter(r=>r.party===cu.name&&r.type==='receipt').reduce((s,r)=>s+r.amount,0);
    const outstanding = Math.max(0, Math.round((totalInv-totalRcv)*100)/100);
    if(outstanding<=0) return;
    // أقدم فاتورة غير مغطاة بالسندات
    const sorted = [...allInvs].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    let leftover = totalRcv;
    let oldestInv = sorted[0];
    for(const inv of sorted){ if(leftover>=inv.grand_total){leftover-=inv.grand_total;}else{oldestInv=inv;break;} }
    const days = Math.max(0,Math.floor((now-new Date(oldestInv.created_at))/86400000));
    custRows.push({id:oldestInv.id, party:cu.name, invoice_no:`${allInvs.length} ${lang==='ar'?'فاتورة':'inv'}`, grand_total:totalInv, paid_amount:totalRcv, remaining:outstanding, days, created_at:oldestInv.created_at});
  });
  custRows.sort((a,b)=>b.days-a.days);

  // --- بيانات الموردين: حساب ديناميكي من سندات الصرف ---
  const suppRows = [];
  db.suppliers.forEach(su=>{
    const allPurs = (db.purchases||[]).filter(p=>p.vendor===su.name);
    if(!allPurs.length) return;
    const totalPur = allPurs.reduce((s,p)=>s+(p.total||0),0);
    const totalPaid = (db.receipts||[]).filter(r=>r.party===su.name&&r.type==='payment').reduce((s,r)=>s+r.amount,0);
    const outstanding = Math.max(0, Math.round((totalPur-totalPaid)*100)/100);
    if(outstanding<=0) return;
    const sorted = [...allPurs].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    let leftover = totalPaid;
    let oldestPur = sorted[0];
    for(const pur of sorted){ if(leftover>=pur.total){leftover-=pur.total;}else{oldestPur=pur;break;} }
    const days = Math.max(0,Math.floor((now-new Date(oldestPur.created_at))/86400000));
    suppRows.push({id:oldestPur.id, party:su.name, ref:`${allPurs.length} ${lang==='ar'?'فاتورة':'inv'}`, total:totalPur, paid_amount:totalPaid, remaining:outstanding, days, created_at:oldestPur.created_at});
  });
  suppRows.sort((a,b)=>b.days-a.days);

  const rows  = isCust ? custRows : suppRows;
  const total = rows.reduce((s,r)=>s+r.remaining,0);
  const partyLabel = isCust ? (lang==='ar'?'العميل':'Customer') : (lang==='ar'?'المورد':'Supplier');
  const actionBtn  = isCust
    ? (id=>`<button class="btn btn-sm btn-primary" onclick="quickReceipt(${id})">📥 ${lang==='ar'?'تحصيل':'Collect'}</button>`)
    : (id=>`<span></span>`);

  c.innerHTML = `<div style="margin-top:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div style="font-size:16px;font-weight:800;">⏰ ${lang==='ar'?'تقرير الذمم المتأخرة':'Overdue Report'}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn ${isCust?'btn-primary':'btn-outline'}" onclick="overdueTab='customers';renderOverdueReport(el('report-main-content'))">
          👤 ${lang==='ar'?'ذمم العملاء (لك)':'Receivables'}
          <span class="badge ${isCust?'badge-white':'badge-blue'}" style="margin-${lang==='ar'?'right':'left'}:4px;">${fmtMoney(custRows.reduce((s,r)=>s+r.remaining,0))}</span>
        </button>

function renderZakatReport(c) {
  const db = getDB();
  const cash = db.treasury?.balance||0;
  const receivables = db.customers.reduce((s,cu)=>{
    const inv = db.invoices.filter(i=>i.customer_name===cu.name).reduce((t,i)=>t+(i.grand_total||0),0);
    const rcv = (db.receipts||[]).filter(r=>r.party===cu.name&&r.type==='receipt').reduce((t,r)=>t+r.amount,0);
    return s+Math.max(0,inv-rcv);
  },0);
  const inventoryVal = db.products.reduce((s,p)=>s+(p.qty||0)*(p.cost_price||p.sell_price||0),0);
  const payables = db.suppliers.reduce((s,su)=>{
    const pur = db.purchases.filter(p=>p.vendor===su.name).reduce((t,p)=>t+(p.total||0),0);
    const pay = (db.receipts||[]).filter(r=>r.party===su.name&&r.type==='payment').reduce((t,r)=>t+r.amount,0);

  },0);

function calcReportData(db, filterFn) {
  // filterFn(item) returns true if item is in selected period
  const invs = filterFn ? db.invoices.filter(filterFn) : db.invoices;
  const purchs = filterFn ? db.purchases.filter(filterFn) : db.purchases;
  const rets = filterFn ? (db.returns||[]).filter(filterFn) : (db.returns||[]);

  const returnedSalesVat = rets.filter(r=>r.type==='sales').reduce((s,r)=>s+(r.vat_amount||0),0);
  const returnedPurchVat = rets.filter(r=>r.type==='purchases').reduce((s,r)=>s+(r.vat_amount||0),0);
  const vatOutput = invs.reduce((s,i)=>s+i.vat_total,0) - returnedSalesVat;
  const vatInput = purchs.reduce((s,p)=>s+(p.deductible!==false?p.vat:0),0) - returnedPurchVat;
  const vatNet = vatOutput - vatInput;
  const salesReturnsAmt = rets.filter(r=>r.type==='sales').reduce((s,r)=>s+(r.base_amount||r.amount/1.15),0);
  const revenue = invs.reduce((s,i)=>s+i.subtotal,0) - salesReturnsAmt;
  const cogs = purchs.filter(p=>p.purchase_type==='goods'||p.category==='بضاعة').reduce((s,p)=>s+p.amount,0)
    - rets.filter(r=>r.type==='purchases').reduce((s,r)=>s+(r.base_amount||r.amount/1.15),0);
  const grossProfit = revenue - cogs;
  const expenses = purchs.filter(p=>p.purchase_type==='opex'||(p.category!=='بضاعة'&&p.purchase_type!=='goods')).reduce((s,p)=>s+p.amount,0);
  const netProfit = grossProfit - expenses;
  return {vatOutput,vatInput,vatNet,revenue,cogs,grossProfit,expenses,netProfit,invs,purchs};
}

let reportPeriod = 'all'; // all, thisMonth, lastMonth, thisYear, custom
let reportFrom = ''; let reportTo = '';

function renderReportsInner(c) {
  const db = getDB();

  // Period filter
  const now = new Date();
  const thisMonth = now.toISOString().slice(0,7);
  const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonth = lastMonthDate.toISOString().slice(0,7);
  const thisYear = String(now.getFullYear());

  function periodFilter(item) {
    const d = (item.created_at||item.date||'').slice(0,10);
    if(reportPeriod==='thisMonth') return d.startsWith(thisMonth);
    if(reportPeriod==='lastMonth') return d.startsWith(lastMonth);
    if(reportPeriod==='thisYear') return d.startsWith(thisYear);
    if(reportPeriod==='custom' && reportFrom && reportTo) return d>=reportFrom && d<=reportTo;
    return true;
  }

  const d = calcReportData(db, reportPeriod==='all'?null:periodFilter);
  const {vatOutput,vatInput,vatNet,revenue,cogs,grossProfit,expenses,netProfit} = d;

  // Comparison: previous period
  function prevFilter(item) {
    const dt = (item.created_at||item.date||'').slice(0,10);
    if(reportPeriod==='thisMonth') return dt.startsWith(lastMonth);
    if(reportPeriod==='lastMonth') { const pm=new Date(lastMonthDate.getFullYear(),lastMonthDate.getMonth()-1,1); return dt.startsWith(pm.toISOString().slice(0,7)); }
    if(reportPeriod==='thisYear') return dt.startsWith(String(now.getFullYear()-1));
    return false;
  }
  const prev = hasPlanFeature('income_statement') && reportPeriod!=='all'&&reportPeriod!=='custom' ? calcReportData(db, prevFilter) : null;
  const diff = (cur,prv) => prv&&prv!==0 ? Math.round((cur-prv)/Math.abs(prv)*100) : null;
  const badge = (pct) => pct===null?'':`<span class="badge ${pct>=0?'badge-green':'badge-red'}" style="font-size:10px;">${pct>=0?'↑':'↓'}${Math.abs(pct)}%</span>`;

  // Build trial balance from journal entries

  (db.journal||[]).forEach(entry=>{
    (entry.entries||[]).forEach(row=>{
      if(!accountMap[row.account_code]) accountMap[row.account_code]={code:row.account_code,name:row.account,debit:0,credit:0};
      if(row.side==='debit') accountMap[row.account_code].debit+=row.amount;
      else accountMap[row.account_code].credit+=row.amount;
    });
  });
  const typeMap={'1100':lang==='ar'?'أصول':'Assets','1200':lang==='ar'?'أصول':'Assets','1300':lang==='ar'?'أصول':'Assets','2100':lang==='ar'?'التزامات':'Liabilities','2200':lang==='ar'?'التزامات':'Liabilities','2210':lang==='ar'?'التزامات':'Liabilities','4100':lang==='ar'?'إيرادات':'Revenue','4200':lang==='ar'?'إيرادات':'Revenue','5100':lang==='ar'?'مصروفات':'Expenses','5200':lang==='ar'?'مصروفات':'Expenses','5300':lang==='ar'?'مصروفات':'Expenses'};
  const trialRows = Object.values(accountMap).sort((a,b)=>a.code.localeCompare(b.code)).map(r=>({...r,type:typeMap[r.code]||(lang==='ar'?'أخرى':'Other')}));
  // Add cash balance if no journal entries yet
  if(!trialRows.length) {
    trialRows.push({code:'1100',name:lang==='ar'?'النقدية':'Cash',type:lang==='ar'?'أصول':'Assets',debit:db.treasury.balance,credit:0});
  }
  const totalDebit=trialRows.reduce((s,r)=>s+r.debit,0);
  const totalCredit=trialRows.reduce((s,r)=>s+r.credit,0);

  const periodLabels = {
    all:lang==='ar'?'كل الفترات':'All Time',
    thisMonth:lang==='ar'?'هذا الشهر':'This Month',

function setReportTab(tab) {
  const blocked = { income_statement:['income'], trial_balance:['trial'], aging_report:['aging'], bank_recon:['bank'], cashflow:['cashflow'] };
  for(const [feat,tabs] of Object.entries(blocked)) { if(tabs.includes(tab) && !hasPlanFeature(feat)) return; }
  reportTab=tab;
  renderReportsInner(el('report-main-content')||el('page-content'));
}

function renderCashFlow(db, d, periodFilter, period) {
  // التدفقات الواردة: المبالغ المحصّلة فعلاً (سندات قبض + نقد مباشر)
  const receipts = (db.receipts||[]).filter(r => r.type==='receipt' && (period==='all' || periodFilter(r)));
  const directCash = (db.invoices||[]).filter(i =>
    (i.payment_method==='نقدي'||i.payment_method==='شبكة'||i.payment_method==='تحويل') &&
    i.status==='مسددة' && (period==='all' || periodFilter(i))
  );

  const cashIn_receipts   = receipts.reduce((s,r)=>s+r.amount,0);
  const cashIn_direct     = directCash.reduce((s,i)=>s+(i.paid_amount||i.grand_total),0);
  const totalCashIn       = cashIn_receipts + cashIn_direct;

  // التدفقات الصادرة: المبالغ المدفوعة فعلاً للموردين + مصاريف نقدية
  const payments   = (db.receipts||[]).filter(r => r.type==='payment' && (period==='all' || periodFilter(r)));
  const cashPurch  = (db.purchases||[]).filter(p =>
    (p.payment_method==='نقدي'||p.status==='مسدد') && (period==='all' || periodFilter(p))
  );

  const cashOut_vouchers  = payments.reduce((s,r)=>s+r.amount,0);
  const cashOut_purchases = cashPurch.reduce((s,p)=>s+(p.paid_amount||p.total),0);
  const totalCashOut      = cashOut_vouchers + cashOut_purchases;

  const netCash     = totalCashIn - totalCashOut;
  const openBal     = db.treasury.moves.length
    ? db.treasury.balance - db.treasury.moves.reduce((s,m)=>s+(m.type==='in'?m.amount:-m.amount),0)
    : 0;
  const closeBal    = db.treasury.balance;
  const color = (v) => v >= 0 ? 'var(--success)' : 'var(--danger)';

  const row = (label, val, bold=false, indent=false) => `
    <div style="display:flex;justify-content:space-between;padding:${bold?'12px':'8px'} 0;
      border-bottom:1px solid var(--border);
      font-weight:${bold?900:500};font-size:${bold?15:13}px;
      padding-inline-start:${indent?'20px':'0'};">
      <span style="color:${bold?'var(--text-main)':'var(--text-muted)'};">${label}</span>
      <span style="color:${color(val)};font-weight:${bold?900:700};">${val>=0?'+':''}${fmtMoney(val)}</span>
    </div>`;

  return `<div class="card" style="margin-top:0"><div class="card-pad">
    <div style="font-weight:900;font-size:16px;margin-bottom:16px;">💧 ${lang==='ar'?'قائمة التدفق النقدي':'Cash Flow Statement'}</div>

    <div style="font-weight:800;font-size:13px;color:var(--primary);margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--primary-soft);">
      📥 ${lang==='ar'?'التدفقات الواردة (مصادر النقد)':'Cash Inflows'}
    </div>
    ${row(lang==='ar'?'سندات قبض من العملاء':'Customer receipts', cashIn_receipts, false, true)}
    ${row(lang==='ar'?'مبيعات نقدية مباشرة':'Direct cash sales', cashIn_direct, false, true)}
    ${row(lang==='ar'?'إجمالي الوارد':'Total Inflows', totalCashIn, true)}

    <div style="font-weight:800;font-size:13px;color:var(--danger);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid #fee2e2;">
      📤 ${lang==='ar'?'التدفقات الصادرة (استخدامات النقد)':'Cash Outflows'}
    </div>
    ${row(lang==='ar'?'سندات صرف للموردين':'Supplier payments', -cashOut_vouchers, false, true)}
    ${row(lang==='ar'?'مشتريات نقدية مباشرة':'Direct cash purchases', -cashOut_purchases, false, true)}
    ${row(lang==='ar'?'إجمالي الصادر':'Total Outflows', -totalCashOut, true)}

    <div style="margin-top:16px;padding:16px;background:${netCash>=0?'#dcfce7':'#fee2e2'};border-radius:12px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-size:12px;color:var(--text-muted);">${lang==='ar'?'صافي التدفق النقدي':'Net Cash Flow'}</div>
        <div style="font-size:24px;font-weight:900;color:${color(netCash)};">${netCash>=0?'+':''}${fmtMoney(netCash)}</div>
      </div>
      <div style="text-align:end;">
        <div style="font-size:12px;color:var(--text-muted);">${lang==='ar'?'رصيد الخزينة الحالي':'Current Treasury Balance'}</div>
        <div style="font-size:20px;font-weight:900;color:var(--primary);">${fmtMoney(closeBal)}</div>
      </div>
    </div>
  </div></div>`;
}

// ── Products Report ──
function renderProductsReport(d, db) {
  const productSales = {};
  db.invoices.forEach(inv=>{
    (inv.items||[]).forEach(item=>{
      if(!productSales[item.name]) productSales[item.name]={name:item.name,qty:0,revenue:0,cost:0};
      productSales[item.name].qty += item.qty||0;
      productSales[item.name].revenue += item.line_total||0;
    });
  });
  db.products.forEach(p=>{
    if(productSales[p.name]) productSales[p.name].cost = productSales[p.name].qty * p.buy_price;
  });
  const rows = Object.values(productSales)
    .map(r=>({...r, profit:r.revenue-r.cost, margin:r.revenue>0?((r.revenue-r.cost)/r.revenue*100):0}))
    .sort((a,b)=>b.revenue-a.revenue);
  const maxRev = rows[0]?.revenue||1;
  const topMargin = [...rows].sort((a,b)=>b.margin-a.margin)[0];
  return `<div>
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
      <div class="stat-card"><div class="stat-icon">${icon('package',22)}</div><div class="stat-label">${lang==='ar'?'إجمالي المنتجات':'Total Products'}</div><div class="stat-value">${db.products.length}</div></div>
      <div class="stat-card"><div class="stat-icon green">${icon('trending-up',22)}</div><div class="stat-label">${lang==='ar'?'أكثر مبيعاً':'Best Seller'}</div><div class="stat-value" style="font-size:14px;">${rows[0]?.name||'-'}</div></div>
      <div class="stat-card"><div class="stat-icon amber">${icon('percent',22)}</div><div class="stat-label">${lang==='ar'?'أعلى هامش ربح':'Highest Margin'}</div><div class="stat-value" style="font-size:14px;">${topMargin?.name||'-'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📊 ${lang==='ar'?'تقرير المبيعات والربحية':'Sales & Profitability'}</h3></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th>#</th><th>${lang==='ar'?'المنتج':'Product'}</th>
          <th>${lang==='ar'?'الكمية':'Qty'}</th>
          <th>${lang==='ar'?'الإيرادات':'Revenue'}</th>
          <th>${lang==='ar'?'التكلفة':'Cost'}</th>
          <th>${lang==='ar'?'الربح':'Profit'}</th>
          <th>${lang==='ar'?'الهامش %':'Margin %'}</th>
          <th>${lang==='ar'?'الحصة':'Share'}</th>
        </tr></thead>
        <tbody>${rows.length===0
          ?`<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--text-muted);">${lang==='ar'?'لا توجد مبيعات':'No sales data'}</td></tr>`
          :rows.map((r,i)=>`<tr>
          <td style="font-weight:800;color:${i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#b45309':'inherit'};">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</td>
          <td><b>${r.name}</b></td>
          <td style="text-align:center;font-weight:700;">${r.qty}</td>
          <td style="color:var(--success);font-weight:700;">${fmtMoney(r.revenue)}</td>
          <td style="color:var(--text-muted);">${fmtMoney(r.cost)}</td>
          <td style="color:${r.profit>=0?'var(--success)':'var(--danger)'};font-weight:800;">${fmtMoney(r.profit)}</td>
          <td>
            <div style="display:flex;align-items:center;gap:6px;">
              <div style="flex:1;background:var(--border);border-radius:999px;height:8px;overflow:hidden;min-width:50px;">
                <div style="background:${r.margin>=50?'var(--success)':r.margin>=25?'var(--warning)':'var(--danger)'};height:100%;width:${Math.max(2,r.margin)}%;border-radius:999px;"></div>
              </div>
              <span style="font-weight:700;font-size:12px;">${r.margin.toFixed(1)}%</span>
            </div>
          </td>
          <td>
            <div style="background:var(--primary-soft);height:8px;border-radius:999px;overflow:hidden;">
              <div style="background:var(--primary);height:100%;width:${(r.revenue/maxRev*100).toFixed(1)}%;border-radius:999px;"></div>
            </div>
          </td>
        </tr>`).join('')}
        </tbody>
      </table></div>
    </div>
    ${db.products.filter(p=>p.qty<=p.min_qty).length>0?`
    <div class="card" style="margin-top:16px;border-color:var(--danger);">
      <div class="card-head"><h3 style="color:var(--danger);">⚠️ ${lang==='ar'?'منتجات تحتاج إعادة طلب':'Needs Reorder'}</h3></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>${lang==='ar'?'المنتج':'Product'}</th><th>${lang==='ar'?'المخزون':'Stock'}</th><th>${lang==='ar'?'حد الأمان':'Min'}</th><th>${lang==='ar'?'الكمية المقترحة':'Suggested'}</th></tr></thead>
        <tbody>${db.products.filter(p=>p.qty<=p.min_qty).map(p=>`<tr>
          <td><b>${p.name}</b></td>
          <td><span class="badge badge-red">${p.qty}</span></td>
          <td>${p.min_qty}</td>
          <td style="font-weight:800;color:var(--primary);">${Math.max(0,p.min_qty*3-p.qty)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`:''}
  </div>`;
}

// ── Suppliers Report ──
function renderSuppliersReport(db) {
  const sd = {};
  db.purchases.forEach(p=>{
    if(!sd[p.vendor]) sd[p.vendor]={name:p.vendor,total:0,count:0,vat:0,goods:0,opex:0};
    sd[p.vendor].total+=p.total; sd[p.vendor].count++;
    sd[p.vendor].vat+=p.vat;
    if(p.purchase_type==='goods') sd[p.vendor].goods+=p.total;
    else sd[p.vendor].opex+=p.total;
  });
  const rows=Object.values(sd).sort((a,b)=>b.total-a.total);
  const grandTotal=rows.reduce((s,r)=>s+r.total,0);
  return `<div>
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
      <div class="stat-card"><div class="stat-icon">${icon('truck',22)}</div><div class="stat-label">${lang==='ar'?'الموردون':'Suppliers'}</div><div class="stat-value">${rows.length}</div></div>
      <div class="stat-card"><div class="stat-icon amber">${icon('package',22)}</div><div class="stat-label">${lang==='ar'?'أكبر مورد':'Top Supplier'}</div><div class="stat-value" style="font-size:14px;">${rows[0]?.name||'-'}</div></div>
      <div class="stat-card"><div class="stat-icon red">${icon('dollar-sign',22)}</div><div class="stat-label">${lang==='ar'?'إجمالي المشتريات':'Total Purchases'}</div><div class="stat-value">${fmtMoney(grandTotal)}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>🏭 ${lang==='ar'?'تقرير الموردين':'Suppliers Report'}</h3></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th>#</th><th>${lang==='ar'?'المورد':'Supplier'}</th>
          <th>${lang==='ar'?'الفواتير':'Invoices'}</th>
          <th>${lang==='ar'?'بضاعة':'Goods'}</th>
          <th>${lang==='ar'?'إداري':'Admin'}</th>
          <th>${lang==='ar'?'ضريبة':'VAT'}</th>
          <th>${lang==='ar'?'الإجمالي':'Total'}</th>
          <th>${lang==='ar'?'النسبة':'Share'}</th>

// ── Bank Reconciliation ──
function renderBankRecon(db) {
  const saved=JSON.parse(localStorage.getItem('yaqiz_bank')||'{"balance":0,"adjustments":[]}');
  const bankBal=saved.balance||0;
  const treasuryBal=db.treasury.balance;
  const diff=treasuryBal-bankBal;
  const adjs=saved.adjustments||[];
  const adjTotal=adjs.filter(a=>a.type==='add').reduce((s,a)=>s+a.amount,0)-adjs.filter(a=>a.type==='sub').reduce((s,a)=>s+a.amount,0);
  const adjustedBankBal=bankBal+adjTotal;
  const finalDiff=treasuryBal-adjustedBankBal;
  return `<div>
    <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px;">
      <div class="stat-card"><div class="stat-icon green">${icon('wallet',22)}</div><div class="stat-label">${lang==='ar'?'رصيد الخزينة (النظام)':'System Treasury'}</div><div class="stat-value">${fmtMoney(treasuryBal)}</div></div>
      <div class="stat-card"><div class="stat-icon">${icon('landmark',22)}</div><div class="stat-label">${lang==='ar'?'رصيد البنك المعدّل':'Adjusted Bank Balance'}</div><div class="stat-value">${fmtMoney(adjustedBankBal)}</div></div>
      <div class="stat-card" style="border-color:${Math.abs(finalDiff)<0.01?'var(--success)':'var(--danger)'};">
        <div class="stat-icon ${Math.abs(finalDiff)<0.01?'green':'red'}">${icon(Math.abs(finalDiff)<0.01?'check-circle':'alert-triangle',22)}</div>
        <div class="stat-label">${lang==='ar'?'الفرق النهائي':'Final Difference'}</div>
        <div class="stat-value" style="color:${Math.abs(finalDiff)<0.01?'var(--success)':'var(--danger)'};">${fmtMoney(Math.abs(finalDiff))}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px;"><div class="card-pad">
      <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
        <div style="flex:1;min-width:200px;">
          <label class="form-label">🏦 ${lang==='ar'?'رصيد كشف الحساب البنكي:':'Bank Statement Balance:'}</label>
          <input class="input" type="number" id="bank-bal-input" value="${bankBal}" />
        </div>
        <button class="btn btn-primary" onclick="saveBankBalance()">${lang==='ar'?'تحديث':'Update'}</button>
      </div>
      <div style="margin-top:12px;background:${Math.abs(finalDiff)<0.01?'#dcfce7':'#fee2e2'};padding:12px;border-radius:10px;font-weight:700;">
        ${Math.abs(finalDiff)<0.01
          ?`✅ ${lang==='ar'?'الخزينة متوازنة مع البنك':'Balanced!'}`
          :`⚠️ ${lang==='ar'?`فرق ${fmtMoney(Math.abs(finalDiff))}`:`Difference: ${fmtMoney(Math.abs(finalDiff))}`} — ${lang==='ar'?'الأسباب: شيكات معلقة، تحويلات في الطريق، رسوم بنكية':'Possible: pending checks, in-transit transfers, bank fees'}`}
      </div>
    </div></div>
    <div class="card">
      <div class="card-head">
        <h3>📋 ${lang==='ar'?'بنود التسوية':'Reconciliation Items'}</h3>
        <button class="btn btn-sm btn-primary" onclick="addBankAdjustment()">${icon('plus',14)} ${lang==='ar'?'إضافة بند':'Add'}</button>
      </div>
      ${adjs.length===0?`<div class="empty"><div class="empty-icon">📋</div>${lang==='ar'?'لا توجد بنود':'No items'}</div>`:
      `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>${lang==='ar'?'البيان':'Description'}</th><th>${lang==='ar'?'النوع':'Type'}</th><th>${lang==='ar'?'المبلغ':'Amount'}</th><th>${lang==='ar'?'التاريخ':'Date'}</th><th></th></tr></thead>
        <tbody>${adjs.map((a,i)=>`<tr>
          <td>${a.desc}</td>
          <td><span class="badge ${a.type==='add'?'badge-green':'badge-red'}">${a.type==='add'?(lang==='ar'?'إضافة':'Add'):(lang==='ar'?'خصم':'Deduct')}</span></td>
          <td style="font-weight:700;color:${a.type==='add'?'var(--success)':'var(--danger)'};">${a.type==='add'?'+':'-'}${fmtMoney(a.amount)}</td>
          <td style="font-size:12px;">${fmtDate(a.date)}</td>
          <td><button class="icon-btn" style="width:26px;height:26px;" onclick="removeBankAdj(${i})">${icon('x',12)}</button></td>
        </tr>`).join('')}</tbody>
      </table></div>`}
    </div>
  </div>`;
}

function saveBankBalance() {
  const val=Number(el('bank-bal-input')?.value||0);
  const saved=JSON.parse(localStorage.getItem('yaqiz_bank')||'{"balance":0,"adjustments":[]}');
  saved.balance=val; localStorage.setItem('yaqiz_bank',JSON.stringify(saved));
  showToast(`✅ ${lang==='ar'?'تم تحديث رصيد البنك':'Updated'}`); renderPage();
}

function addBankAdjustment() {
  const mc=el('modal-container');
  mc.innerHTML=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()" style="max-width:420px;">
    <div class="modal-head"><h3>${lang==='ar'?'إضافة بند تسوية':'Add Item'}</h3><button class="icon-btn" onclick="closeModal()">${icon('x',18)}</button></div>
    <div style="margin-bottom:12px;"><label class="form-label">${lang==='ar'?'البيان':'Description'} *</label><input class="input" id="ba-desc" /></div>
    <div class="form-row">
      <div><label class="form-label">${lang==='ar'?'المبلغ':'Amount'} *</label><input class="input" type="number" id="ba-amount" value="0" /></div>
      <div><label class="form-label">${lang==='ar'?'النوع':'Type'}</label>
        <select class="select" id="ba-type">
          <option value="add">${lang==='ar'?'إضافة للبنك':'Add to Bank'}</option>
          <option value="sub">${lang==='ar'?'خصم من البنك':'Deduct from Bank'}</option>
        </select>
      </div>
    </div>
    <div style="margin-bottom:16px;"><label class="form-label">${lang==='ar'?'التاريخ':'Date'}</label><input class="input" type="date" id="ba-date" value="${new Date().toISOString().slice(0,10)}" /></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary btn-full" onclick="saveBankAdj()">${lang==='ar'?'حفظ':'Save'}</button>
      <button class="btn btn-outline" onclick="closeModal()">${lang==='ar'?'إلغاء':'Cancel'}</button>
    </div>
  </div></div>`;
  refreshIcons();
}

function saveBankAdj() {
  const saved=JSON.parse(localStorage.getItem('yaqiz_bank')||'{"balance":0,"adjustments":[]}');
  const desc=el('ba-desc')?.value; const amount=Number(el('ba-amount')?.value||0);
  if(!desc||!amount){showToast(lang==='ar'?'البيانات مطلوبة':'Required','error');return;}
  if(!saved.adjustments)saved.adjustments=[];
  saved.adjustments.push({desc,amount,type:el('ba-type').value,date:new Date().toISOString()});
  localStorage.setItem('yaqiz_bank',JSON.stringify(saved));
  showToast(`✅ ${lang==='ar'?'تم':'Done'}`); closeModal(); renderPage();
}

function removeBankAdj(idx) {
  const saved=JSON.parse(localStorage.getItem('yaqiz_bank')||'{"balance":0,"adjustments":[]}');
  saved.adjustments.splice(idx,1);
  localStorage.setItem('yaqiz_bank',JSON.stringify(saved)); renderPage();
}

function applyJobTitle() {
  const title = el('u-jobtitle')?.value;
  const jt = (window._jobTitles||{})[title];
  if (!jt) return;
  const allPerms = Object.keys(window._permLabels||{});
  const isOwner = title === 'مالك / مدير عام';
  allPerms.forEach(p => {
    const cb  = el('perm-'+p.replace(/\./g,'-'));
    const lbl = el('perm-lbl-'+p.replace(/\./g,'-'));
    const on  = isOwner || jt.perms.includes(p);
    if (cb)  cb.checked = on;
    if (lbl) lbl.classList.toggle('checked', on);
  });
  const posEl = el('u-pos');
  if (posEl) posEl.checked = !!jt.pos;
  updatePermCount();
}

function selectAllPerms(checked) {
  Object.keys(window._permLabels||{}).forEach(p => {
    const cb  = el('perm-'+p.replace(/\./g,'-'));
    const lbl = el('perm-lbl-'+p.replace(/\./g,'-'));
    if (cb)  cb.checked = checked;
    if (lbl) lbl.classList.toggle('checked', checked);
  });
  updatePermCount();
}

function updatePermCount() {
  const count = Object.keys(window._permLabels||{}).filter(p=>el('perm-'+p.replace(/\./g,'-'))?.checked).length;
  const badge = el('perm-count-badge');
  if (badge) badge.textContent = `(${count} ${lang==='ar'?'محددة':'selected'})`;
}

function saveUser(id) {
  const db = getDB();
  const username = (el('u-username')?.value||'').trim();
  const password = el('u-password')?.value||'';
  const fullname = (el('u-fullname')?.value||'').trim();
  const title    = el('u-jobtitle')?.value||'مخصص';
  const role     = (window._jobTitles||{})[title]?.role || 'cashier';
  const perms    = Object.keys(window._permLabels||{}).filter(p=>el('perm-'+p.replace(/\./g,'-'))?.checked);
  const posAccess    = el('u-pos')?.checked||false;

  let valid = true;

  // ── Validate username (new users only) ───────────
  if (!id) {
    const errEl = el('u-username-err');
    if (!username || username.length < 6) {
      errEl.textContent = lang==='ar' ? 'اسم المستخدم 6 أحرف على الأقل' : 'Username min 6 characters';
      errEl.style.display = 'block'; valid = false;
    } else if (!/\d/.test(username)) {
      errEl.textContent = lang==='ar' ? 'يجب أن يحتوي على رقم واحد على الأقل' : 'Must contain at least one digit';
      errEl.style.display = 'block'; valid = false;
    } else {
      errEl.style.display = 'none';
    }
  }

  // ── Validate password ────────────────────────────
  const pwErrEl = el('u-password-err');
  if (!id || password) {
    if (password.length < 8) {
      pwErrEl.textContent = lang==='ar' ? 'كلمة المرور 8 أحرف على الأقل' : 'Password min 8 characters';
      pwErrEl.style.display = 'block'; valid = false;
    } else if (!/[a-z]/.test(password)) {
      pwErrEl.textContent = lang==='ar' ? 'يجب أن تحتوي على حرف إنجليزي صغير (a-z)' : 'Must contain a lowercase letter';
      pwErrEl.style.display = 'block'; valid = false;
    } else if (!/[A-Z]/.test(password)) {
      pwErrEl.textContent = lang==='ar' ? 'يجب أن تحتوي على حرف إنجليزي كبير (A-Z)' : 'Must contain an uppercase letter';
      pwErrEl.style.display = 'block'; valid = false;
    } else {
      pwErrEl.style.display = 'none';
    }
  }

  // ── Validate at least one permission ────────────
  const permErrEl = el('perm-err');
  if (role !== 'owner' && perms.length === 0) {
    if (permErrEl) permErrEl.style.display = 'block';
    valid = false;
  } else {
    if (permErrEl) permErrEl.style.display = 'none';
  }

  if (!valid) return;

  if (id) {
    const u = db.users.find(x=>x.id===id);
    if (u) {
      u.full_name     = fullname;
      u.role          = role;
      u.permissions   = perms;
      u.pos_access    = posAccess;
      if (password) u.password = password;
    }
  } else {
    db.users.push({
      id: nextId(db,'user'),
      username,
      password,
      full_name:      fullname,
      role,
      permissions:    perms,
      pos_access:     posAccess,
      active:         true
    });
  }

  saveDB(db);
  showToast(`✅ ${t('save')}`);
  closeModal();
  renderPage();

  // مزامنة مع API إذا كان متصلاً
  if (window._apiReachable && window._cloudApiFetch) {
    (async () => {
      try {
        if (id) {
          // تعديل مستخدم موجود
          await window._cloudApiFetch('PUT', `/api/users/${id}`, {
            full_name: fullname, role, permissions: perms,
            pos_access: posAccess, active: true
          });
          if (password) {
            await window._cloudApiFetch('PUT', `/api/users/${id}/password`, { new_password: password });
          }
        } else {
          // إنشاء مستخدم جديد
          const res = await window._cloudApiFetch('POST', '/api/users', {
            username, password, full_name: fullname, role,
            permissions: perms, pos_access: posAccess, shift_enabled: shiftEnabled
          });
          if (res?.data?.id) {
            // تحديث الـ ID المحلي بـ ID من قاعدة البيانات
            const db2 = getDB();
            const lu = db2.users.find(x => x.username === username);
            if (lu) lu.id = res.data.id;
            saveDB(db2);
          }
        }
      } catch(e) {
        console.warn('User API sync:', e.message);
        showToast('⚠️ ' + (e.message||'خطأ في مزامنة المستخدم'), 'warning');
      }
    })();
  }
}

function deleteUser(id) {
  if(!confirm(t('confirm')))return;
  const db=getDB();db.users=db.users.filter(u=>u.id!==id);saveDB(db);renderPage();
  if (window._apiReachable && window._cloudApiFetch) {
    window._cloudApiFetch('DELETE', `/api/users/${id}`).catch(e=>console.warn('User delete API:', e.message));
  }
}

function confirmObligationPayment(id, type, amount) {
  amount = Math.round(parseFloat(amount)*100)/100;
  if(!amount||amount<=0){showToast(lang==='ar'?'أدخل مبلغاً صحيحاً':'Enter valid amount','error');return;}
  const db=getDB(); const o=db.obligations.find(x=>x.id===id); if(!o)return;

  // ── الخزينة ──────────────────────────────────────────────
  if(!db.treasury)db.treasury={balance:0,moves:[]};
  if(!db.treasury.moves)db.treasury.moves=[];
  db.treasury.balance-=amount;
  db.treasury.moves.unshift({
    id:nextId(db,'treasury'),type:'out',amount,
    description:`${lang==='ar'?'سداد التزام':'Obligation payment'} ${type==='full'?(lang==='ar'?'كامل':'full'):(lang==='ar'?'جزئي':'partial')}: ${o.name}`,
    reference:`OBL-${id}`,date:new Date().toISOString()
  });

  // ── تسجيل مصروف OPEX ─────────────────────────────────────
  if(!db.purchases)db.purchases=[];
  if(!db.nextId)db.nextId={};
  db.purchases.push({
    id:nextId(db,'purchase'),
    vendor:o.vendor||o.name, description:`${type==='full'?(lang==='ar'?'سداد كامل':'Full payment'):(lang==='ar'?'سداد جزئي':'Partial payment')}: ${o.name}`,
    category:o.category, purchase_type:'opex',
    amount:Math.round(amount/1.15*100)/100,
    vat:Math.round((amount-amount/1.15)*100)/100,
    total:amount, payment_method:'نقدي', paid_amount:amount,
    supplier_ref:`OBL-${id}`, notes:'',
    created_at:new Date().toISOString(), items:[]
  });

  // ── قيد محاسبي مزدوج ─────────────────────────────────────
  if(!db.journal)db.journal=[];
  if(!db.nextId.journal)db.nextId.journal=1;
  const _accCode={'إيجار':'5300','رواتب وتعويضات':'5100'}[o.category]||'5200';
  db.journal.push({
    id:db.nextId.journal++,date:new Date().toISOString(),
    description:`${lang==='ar'?'سداد التزام':'Obligation'}: ${o.name} — ${type==='full'?(lang==='ar'?'كامل':'full'):(lang==='ar'?'جزئي':'partial')}`,
    entries:[
      {account:o.category,         account_code:_accCode, side:'debit',  amount:Math.round(amount/1.15*100)/100},
      {account:'ضريبة المدخلات',   account_code:'2210',   side:'debit',  amount:Math.round((amount-amount/1.15)*100)/100},
      {account:'النقدية والخزينة', account_code:'1100',   side:'credit', amount},
    ],
    ref:`OBL-${id}`
  });

  // ── تسجيل السداد في سجل الالتزام ──────────────────────────
  if(!o.payments)o.payments=[];
  o.payments.push({date:new Date().toISOString(),amount,type});

  // ── إعادة حساب تاريخ الاستحقاق (السداد الكامل فقط) ────────
  if(type==='full') {
    const _next=new Date();
    const _freqMap={'شهري':[0,1],'أسبوعي':[7,0],'ربع سنوي':[0,3],'نصف سنوي':[0,6],'سنوي':[0,12]};
    const [days,months]=_freqMap[o.frequency]||[0,1];
    if(days)  _next.setDate(_next.getDate()+days);
    if(months)_next.setMonth(_next.getMonth()+months);
    o.next_due=_next.toISOString();
  }

  saveDB(db);
  closeModal();
  showToast(`✅ ${fmtMoney(amount)} — ${lang==='ar'?'تم تسجيل السداد':'Payment recorded'}`);
  printObligationReceipt(o,amount,type);
  renderPage();
}

function onPurchaseLinkChange() {
  const sel = el('v-purchase-link'); if(!sel) return;
  const opt = sel.options[sel.selectedIndex];
  if(opt.value) {
    el('v-amount').value = opt.dataset.amount;
    el('v-party').value = opt.dataset.party;
    const partySelect = el('v-party-select');
    if(partySelect) { for(let o of partySelect.options) { if(o.value===opt.dataset.party) { partySelect.value=opt.dataset.party; break; } } }
    el('v-desc').value = lang==='ar'?`سداد للمورد ${opt.dataset.party}`:`Supplier payment - ${opt.dataset.party}`;
  }
}

function onInvoiceLinkChange() {
  const sel = el('v-invoice-link');
  if(!sel) return;
  const opt = sel.options[sel.selectedIndex];
  const info = el('v-invoice-info');
  if(opt.value) {
    el('v-amount').value = opt.dataset.amount;
    el('v-party').value = opt.dataset.party;
    el('v-ref').value = opt.dataset.no;
    el('v-desc').value = lang==='ar'?`سداد فاتورة ${opt.dataset.no}`:`Payment for invoice ${opt.dataset.no}`;
    if(info){ info.style.display='block'; info.innerHTML=`✅ ${lang==='ar'?'سيتم تحديث حالة الفاتورة':'Invoice status will be updated'} <b>${opt.dataset.no}</b> ${lang==='ar'?'إلى مسددة':'to Paid'}`; }
  } else {
    if(info) info.style.display='none';
  }
}


function saveVoucher(type, printAfter=true) {
  const db = getDB();
  const amount = Number(el('v-amount').value||0);
  if(!el('v-party').value||!amount){showToast(lang==='ar'?'الاسم والمبلغ مطلوبان':'Party and amount required','error');return;}
  const isReceipt = type==='receipt';
  const num = (db.nextId.receipt||1);
  db.nextId.receipt = num+1;

  // check if linked to invoice or purchase
  const linkSel = el('v-invoice-link');
  const linkedInvoiceId = linkSel ? Number(linkSel.value)||null : null;
  const purLinkSel = el('v-purchase-link');
  const linkedPurchaseId = purLinkSel ? Number(purLinkSel.value)||null : null;
  // party: prefer select if filled, else text input
  const partyVal = (el('v-party-select')?.value||'') || el('v-party').value;

  const voucher = {
    id: num, type,
    voucher_no: `${isReceipt?'RCV':'PAY'}-${String(num).padStart(4,'0')}`,
    party: partyVal || el('v-party').value,
    party_type: isReceipt ? 'customer' : 'supplier',
    amount, description: el('v-desc').value,
    method: el('v-method').value, ref: el('v-ref').value,
    linked_invoice_id: linkedInvoiceId,
    linked_purchase_id: linkedPurchaseId,
    date: el('v-date').value, created_at: new Date().toISOString()
  };

  if(!db.receipts) db.receipts=[];
  db.receipts.push(voucher);

  // 1. Update treasury
  db.treasury.balance += isReceipt ? amount : -amount;
  db.treasury.moves.unshift({
    id: nextId(db,'treasury'),
    type: isReceipt?'in':'out',
    amount,
    description: `${voucher.voucher_no}: ${voucher.party}`,
    reference: voucher.ref||voucher.voucher_no,
    date: new Date().toISOString()
  });

  // 2. تطبيق سند القبض على فواتير العميل
  if(isReceipt) {
    const party = voucher.party;
    // إذا مربوط بفاتورة محددة → طبّق عليها فقط
    const targetInvs = linkedInvoiceId
      ? db.invoices.filter(i=>i.id===linkedInvoiceId)
      : db.invoices
          .filter(i=>i.customer_name===party && (i.status==='آجل'||i.status==='جزئي'))
          .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)); // الأقدم أولاً

    let left = amount;
    for(const inv of targetInvs) {
      if(left<=0) break;
      const prevStatus = inv.status;
      const invRemaining = Math.max(0, inv.grand_total-(inv.paid_amount||0));
      const applying = Math.min(left, invRemaining);
      inv.paid_amount = Math.round(((inv.paid_amount||0)+applying)*100)/100;
      if(inv.paid_amount >= inv.grand_total) {
        inv.status = 'مسددة';
        inv.paid_amount = inv.grand_total;
      } else {
        inv.status = 'جزئي';
      }
      inv.last_payment_date = new Date().toISOString();
      inv.last_voucher_no = voucher.voucher_no;
      left = Math.round((left-applying)*100)/100;
      logActivity('مبيعات', `تحديث فاتورة ${inv.invoice_no} من "${prevStatus}" إلى "${inv.status}" — سند ${voucher.voucher_no}`);
    }
    // تحديث رصيد العميل
    const _vCust = db.customers.find(c=>c.name===party);
    if(_vCust) {
      const _applied = amount - left;
      _vCust.balance = Math.max(0, Math.round((((_vCust.balance)||0) - _applied)*100)/100);
    }
  }

  // 2b. تطبيق سند الصرف على مشتريات المورد
  if(!isReceipt) {
    const party = voucher.party;
    const targetPurs = linkedPurchaseId
      ? db.purchases.filter(p=>p.id===linkedPurchaseId)
      : db.purchases
          .filter(p=>p.vendor===party && (p.status==='آجل'||p.status==='جزئي'||(p.remaining_amount||0)>0))
          .sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

    let left = amount;
    for(const pur of targetPurs) {
      if(left<=0) break;
      const purRemaining = Math.max(0, pur.remaining_amount!=null ? pur.remaining_amount : pur.total-(pur.paid_amount||0));
      const applying = Math.min(left, purRemaining);
      pur.paid_amount = Math.round(((pur.paid_amount||0)+applying)*100)/100;
      pur.remaining_amount = Math.round((purRemaining-applying)*100)/100;
      pur.status = pur.remaining_amount<=0 ? 'مسدد' : 'جزئي';
      pur.last_payment_date = new Date().toISOString();
      left = Math.round((left-applying)*100)/100;
      logActivity('مشتريات', `تحديث مشتريات ${pur.vendor} — المتبقي: ${fmtMoney(pur.remaining_amount)}`);
    }
    // تحديث رصيد المورد
    const _vSup = db.suppliers.find(s=>s.name===party);
    if(_vSup) {
      const _applied = amount - left;
      _vSup.balance = Math.max(0, Math.round((((_vSup.balance)||0) - _applied)*100)/100);
    }
  }

  // 3. Record accounting entry
  if(!db.journal) db.journal=[];
  if(isReceipt) {
    // Dr. Cash / Cr. Accounts Receivable
    db.journal.push({
      id: (db.nextId.journal||1), date: new Date().toISOString(),
      description: `سند قبض ${voucher.voucher_no} — ${voucher.party}`,
      entries: [
        { account: lang==='ar'?'النقدية':'Cash', account_code:'1100', side:'debit',  amount },
        { account: lang==='ar'?'الذمم المدينة':'Accounts Receivable', account_code:'1200', side:'credit', amount }
      ],
      ref: voucher.voucher_no
    });
  } else {
    // Dr. Accounts Payable / Cr. Cash
    db.journal.push({
      id: (db.nextId.journal||1), date: new Date().toISOString(),
      description: `سند صرف ${voucher.voucher_no} — ${voucher.party}`,
      entries: [
        { account: lang==='ar'?'الذمم الدائنة':'Accounts Payable', account_code:'2100', side:'debit',  amount },
        { account: lang==='ar'?'النقدية':'Cash', account_code:'1100', side:'credit', amount }
      ],
      ref: voucher.voucher_no
    });
  }
  db.nextId.journal = (db.nextId.journal||1)+1;

  // تحديث رصيد الطرف (عميل أو مورد)
  if(isReceipt) {
    // سند قبض: خصم من رصيد العميل
    const cust = db.customers.find(c => c.name === voucher.party);
    if(cust) cust.balance = Math.round((Math.max(0, (cust.balance||0) - amount)) * 100) / 100;
  } else {
    // سند صرف: خصم من رصيد المورد
    const sup = db.suppliers.find(s => s.name === voucher.party);
    if(sup) sup.balance = Math.round((Math.max(0, (sup.balance||0) - amount)) * 100) / 100;
  }

  saveDB(db);
  logActivity('سندات', `${isReceipt?'سند قبض':'سند صرف'} ${voucher.voucher_no} — ${voucher.party} — ${fmtMoney(amount)}`);

  const msg = isReceipt
    ? (linkedInvoiceId
        ? (lang==='ar'?`✅ سند القبض وتحديث الفاتورة تم بنجاح`:`✅ Receipt saved & invoice updated`)
        : (lang==='ar'?'✅ تم إنشاء سند القبض':'✅ Receipt created'))
    : (lang==='ar'?'✅ تم إنشاء سند الصرف':'✅ Payment created');
  showToast(msg);
  closeModal();
  if(printAfter) printVoucher(voucher.id);
  renderPage();
}

function deleteReceipt(id) {
  if(!confirm(lang==='ar'?'حذف السند؟ سيتم عكس جميع التأثيرات المحاسبية.':'Delete voucher? All accounting effects will be reversed.'))return;
  const db=getDB();
  const v=(db.receipts||[]).find(r=>r.id===id);
  if(!v){db.receipts=(db.receipts||[]).filter(r=>r.id!==id);saveDB(db);renderPage();return;}

  const amount = parseFloat(v.amount||0);
  const isReceipt = v.type==='receipt';

  // 1. عكس الخزينة
  db.treasury.balance = Math.round((db.treasury.balance + (isReceipt?-amount:amount))*100)/100;
  db.treasury.moves = db.treasury.moves.filter(m=>m.reference!==v.voucher_no);

  // 2. حذف القيد اليومي
  if(db.journal) db.journal = db.journal.filter(j=>j.ref!==v.voucher_no);

  // 3. عكس الفاتورة (إذا سند قبض)
  if(isReceipt) {
    const inv = v.linked_invoice_id
      ? db.invoices.find(i=>i.id===v.linked_invoice_id)
      : db.invoices.find(i=>i.invoice_no===v.ref);
    if(inv){
      inv.paid_amount = Math.round((Math.max(0,(inv.paid_amount||0)-amount))*100)/100;
      if(inv.paid_amount<=0){ inv.status='آجل'; inv.paid_amount=0; }
      else { inv.status='جزئي'; }
    }
    // عكس رصيد العميل
    const cust = db.customers.find(c=>c.name===v.party);
    if(cust) cust.balance = Math.round(((cust.balance||0)+amount)*100)/100;
  }

  // 4. عكس المشتريات (إذا سند صرف)
  if(!isReceipt) {
    const pur = v.linked_purchase_id
      ? db.purchases.find(p=>p.id===v.linked_purchase_id)
      : null;
    if(pur){
      pur.paid_amount = Math.round((Math.max(0,(pur.paid_amount||0)-amount))*100)/100;
      pur.remaining_amount = Math.round(((pur.remaining_amount||0)+amount)*100)/100;
      pur.status = pur.remaining_amount<=0?'مسدد':'جزئي';
    }
    // عكس رصيد المورد
    const sup = db.suppliers.find(s=>s.name===v.party);
    if(sup) sup.balance = Math.round(((sup.balance||0)+amount)*100)/100;
  }

  db.receipts=(db.receipts||[]).filter(r=>r.id!==id);
  saveDB(db);
  showToast(`✅ ${lang==='ar'?'تم حذف السند وعكس جميع التأثيرات':'Voucher deleted & all effects reversed'}`);
  renderPage();
}

function onReturnLinkChange(type) {
  const sel=el('rt-link'); if(!sel) return;
  const opt=sel.options[sel.selectedIndex];
  if(opt.value) {
    el('rt-party').value = opt.dataset.party||'';
    el('rt-amount').value = opt.dataset.amount||0;
    calcReturnVat();
  }
}

function calcReturnVat() {
  const total=Number(el('rt-amount')?.value||0);
  const base=total/1.15; const vat=total-base;
  if(el('rt-vat')) el('rt-vat').value=fmtMoney(vat);
  if(el('rt-base')) el('rt-base').value=fmtMoney(base);
}


function saveReturn(type) {
  const db=getDB();
  const amount=Number(el('rt-amount').value||0);
  if(!el('rt-party').value||!amount){showToast(lang==='ar'?'البيانات مطلوبة':'Required fields missing','error');return;}
  const isSales=type==='sales';
  const num=db.nextId.return_||1; db.nextId.return_=num+1;

  // linked invoice/purchase
  const linkSel=el('rt-link');
  const linkedId = linkSel?Number(linkSel.value)||null:null;

  // product link
  const prodSel=el('rt-product');
  const prodId = prodSel?Number(prodSel.value)||null:null;
  const qty=Number(el('rt-qty')?.value||0);
  const prodOpt = prodSel?.options[prodSel.selectedIndex];

  // VAT calc
  const base=amount/1.15; const vat=amount-base;

  const ret={
    id:num, type, return_no:`RET-${String(num).padStart(4,'0')}`,
    party:el('rt-party').value, amount, vat_amount:vat, base_amount:base,
    item:el('rt-item').value, reason:el('rt-reason').value,
    date:el('rt-date').value, created_at:new Date().toISOString(),
    linked_id:linkedId, product_id:prodId,
    product_name:prodOpt?.dataset?.name||'', qty
  };

  if(!db.returns) db.returns=[];
  db.returns.push(ret);

  // 1. Treasury effect
  const tType=isSales?'out':'in';
  db.treasury.balance+=isSales?-amount:amount;
  db.treasury.moves.unshift({
    id:nextId(db,'treasury'), type:tType, amount,
    description:`مرتجع ${isSales?'مبيعات':'مشتريات'} ${ret.return_no}: ${ret.party}`,
    reference:ret.return_no, date:new Date().toISOString()
  });

  // 2. Stock effect: sales return → stock IN, purchase return → stock OUT
  if(prodId && qty>0) {
    const prod=db.products.find(p=>p.id===prodId);
    if(prod) {
      if(!db.stock_moves) db.stock_moves=[];
      if(!db.nextId.stock_move) db.nextId.stock_move=1;
      const stockType=isSales?'in':'out';
      const oldQty=prod.qty;
      prod.qty=stockType==='in'?oldQty+qty:Math.max(0,oldQty-qty);
      db.stock_moves.push({
        id:db.nextId.stock_move++,
        product_id:prodId, product_name:prod.name, product_code:prod.code,
        type:stockType, qty,
        balance_before:oldQty, balance_after:prod.qty,
        reason:`مرتجع ${isSales?'مبيعات':'مشتريات'}: ${ret.party}`,
        reference:ret.return_no, date:new Date().toISOString()
      });
    }
  }

  // 3. Journal entry for VAT and AR/AP
  if(!db.journal) db.journal=[];
  if(!db.nextId.journal) db.nextId.journal=1;
  if(isSales) {
    // Dr. Sales Returns & Dr. VAT Payable / Cr. Cash
    db.journal.push({
      id:db.nextId.journal++, date:new Date().toISOString(),
      description:`مرتجع مبيعات ${ret.return_no} — ${ret.party}`,
      entries:[
        {account:lang==='ar'?'مرتجعات المبيعات':'Sales Returns', account_code:'4200', side:'debit', amount:base},
        {account:lang==='ar'?'ضريبة القيمة المضافة':'VAT Payable', account_code:'2200', side:'debit', amount:vat},
        {account:lang==='ar'?'النقدية':'Cash', account_code:'1100', side:'credit', amount}
      ],
      ref:ret.return_no
    });
    // 4. Update linked invoice if exists
    if(linkedId) {
      const inv=db.invoices.find(i=>i.id===linkedId);
      if(inv) {
        inv.has_return=true;
        inv.returned_amount=(inv.returned_amount||0)+amount;
        logActivity('مرتجعات',`ربط مرتجع ${ret.return_no} بالفاتورة ${inv.invoice_no}`);
      }
    }
  } else {
    // Purchase return: Dr. Cash / Cr. Purchase Returns & Cr. Input VAT
    db.journal.push({
      id:db.nextId.journal++, date:new Date().toISOString(),
      description:`مرتجع مشتريات ${ret.return_no} — ${ret.party}`,
      entries:[
        {account:lang==='ar'?'النقدية':'Cash', account_code:'1100', side:'debit', amount},
        {account:lang==='ar'?'مرتجعات المشتريات':'Purchase Returns', account_code:'5300', side:'credit', amount:base},
        {account:lang==='ar'?'ضريبة القيمة المضافة':'Input VAT', account_code:'2200', side:'credit', amount:vat}
      ],
      ref:ret.return_no
    });
    // Update linked purchase if exists
    if(linkedId) {
      const pur=db.purchases.find(p=>p.id===linkedId);
      if(pur) {
        pur.has_return=true;
        pur.returned_amount=(pur.returned_amount||0)+amount;
      }
    }
  }

  saveDB(db);
  logActivity('مرتجعات',`${isSales?'مرتجع مبيعات':'مرتجع مشتريات'} ${ret.return_no} — ${ret.party} — ${fmtMoney(amount)}`);
  showToast(`✅ ${lang==='ar'?`تم: ${ret.return_no} — الخزينة والمخزون والضريبة تحدثت`:`Done: ${ret.return_no} — Treasury, inventory & VAT updated`}`);
  closeModal(); renderPage();
}


function deleteReturn(id){
  if(!confirm(lang==='ar'?'حذف المرتجع سيعكس كل تأثيراته. تأكيد؟':'Delete will reverse all effects. Confirm?'))return;
  const db=getDB();
  const r=(db.returns||[]).find(x=>x.id===id); if(!r)return;
  const isSales=r.type==='sales';

  // 1. Reverse treasury
  db.treasury.balance+=isSales?r.amount:-r.amount;
  db.treasury.moves.unshift({id:nextId(db,'treasury'),type:isSales?'in':'out',amount:r.amount,
    description:`عكس مرتجع ${r.return_no}`,reference:r.return_no,date:new Date().toISOString()});

  // 2. Reverse stock
  if(r.product_id && r.qty>0){
    const prod=db.products.find(p=>p.id===r.product_id);
    if(prod){
      const stockType=isSales?'out':'in';
      const oldQty=prod.qty;
      prod.qty=stockType==='in'?oldQty+r.qty:Math.max(0,oldQty-r.qty);
      if(!db.stock_moves)db.stock_moves=[];
      db.stock_moves.push({id:db.nextId.stock_move||1,product_id:r.product_id,product_name:r.product_name,type:stockType,qty:r.qty,
        balance_before:oldQty,balance_after:prod.qty,reason:`عكس مرتجع ${r.return_no}`,reference:r.return_no,date:new Date().toISOString()});
      db.nextId.stock_move=(db.nextId.stock_move||1)+1;
    }
  }

  // 3. Reverse invoice flag
  if(r.linked_id && isSales){
    const inv=db.invoices.find(i=>i.id===r.linked_id);
    if(inv){ inv.returned_amount=Math.max(0,(inv.returned_amount||0)-r.amount); if(inv.returned_amount<=0)inv.has_return=false; }
  }
  if(r.linked_id && !isSales){
    const pur=db.purchases.find(p=>p.id===r.linked_id);
    if(pur){ pur.returned_amount=Math.max(0,(pur.returned_amount||0)-r.amount); if(pur.returned_amount<=0)pur.has_return=false; }
  }

  db.returns=(db.returns||[]).filter(x=>x.id!==id);
  saveDB(db);
  logActivity('مرتجعات',`حذف وعكس مرتجع ${r.return_no}`);
  showToast(`✅ ${lang==='ar'?'تم الحذف وعكس التأثيرات':'Deleted and effects reversed'}`);
  renderPage();
}

// ============ AGING REPORT (added to reports) ============
function renderAgingReport() {
  const db = getDB();
  const now = new Date();
  const aging = db.invoices.filter(i=>i.status==='آجل').map(i=>{
    const days = Math.floor((now-new Date(i.created_at))/(1000*60*60*24));
    const bucket = days<=30?'0-30':days<=60?'31-60':days<=90?'61-90':'90+';
    return {...i, days, bucket};
  });
  const buckets = {'0-30':[],'31-60':[],'61-90':[],'90+':[]};
  aging.forEach(i=>buckets[i.bucket].push(i));

  return `
  <div class="card" style="margin-top:20px;">
    <div class="card-head"><h3>⏱️ ${lang==='ar'?'تقرير عمر الديون (Aging Report)':'Aging Report'}</h3></div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px;">
      ${Object.entries(buckets).map(([b,items])=>`
        <div style="background:${b==='0-30'?'#dcfce7':b==='31-60'?'#fef3c7':b==='61-90'?'#fed7aa':'#fee2e2'};padding:14px;border-radius:10px;">
          <div style="font-weight:800;font-size:13px;margin-bottom:6px;">${b} ${lang==='ar'?'يوم':'days'}</div>
          <div style="font-size:20px;font-weight:900;">${fmtMoney(items.reduce((s,i)=>s+i.grand_total,0))}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${items.length} ${lang==='ar'?'فاتورة':'invoices'}</div>
        </div>`).join('')}
    </div>
    ${aging.length>0?`<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>${t('invoiceNo')}</th><th>${t('customer')}</th><th>${lang==='ar'?'تاريخ الفاتورة':'Invoice Date'}</th><th>${lang==='ar'?'عدد الأيام':'Days'}</th><th>${t('total')}</th></tr></thead>
      <tbody>${aging.sort((a,b)=>b.days-a.days).map(i=>`<tr>
        <td><b>${i.invoice_no}</b></td><td>${i.customer_name}</td><td>${fmtDate(i.created_at)}</td>
        <td><span class="badge ${i.days<=30?'badge-green':i.days<=60?'badge-amber':i.days<=90?'badge-red':'badge-red'}">${i.days} ${lang==='ar'?'يوم':'d'}</span></td>
        <td style="font-weight:800;color:var(--danger);">${fmtMoney(i.grand_total)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`:`<div class="empty"><div class="empty-icon">✅</div>${lang==='ar'?'لا توجد ديون متأخرة':'No outstanding debts'}</div>`}
  </div>`;
}

// ============ EXPORT DATA ============
function exportData(format) {
  if(format==='json' && currentUser?.role !== 'owner' && !has('settings.manage')) {
    showToast(lang==='ar'?'غير مصرح لك بتصدير النسخة الاحتياطية':'Not authorized','error'); return;
  }
  const db = getDB();
  const s = db.settings||{};

  if(format==='json') {
    const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`mahsoob-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
    showToast(`✅ ${lang==='ar'?'تم تصدير البيانات':'Data exported'}`);
    return;
  }

  if(format==='invoices-csv') {
    const headers = ['رقم الفاتورة','التاريخ','العميل','المجموع','الضريبة','الإجمالي','الحالة'];
    const rows = db.invoices.map(i=>[i.invoice_no,fmtDate(i.created_at),i.customer_name,i.subtotal,i.vat_total,i.grand_total,i.status]);
    const csv = [headers,...rows].map(r=>r.join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`invoices-${new Date().toISOString().slice(0,10)}.csv`; a.click();
    showToast(`✅ ${lang==='ar'?'تم تصدير الفواتير':'Invoices exported'}`);
    return;
  }

  if(format==='purchases-csv') {
    const headers=['التاريخ','المورد','البيان','التصنيف','النوع','المبلغ','الضريبة','الإجمالي'];
    const rows=db.purchases.map(p=>[fmtDate(p.created_at),p.vendor,p.description,p.category,p.purchase_type==='goods'?'بضاعة':'تشغيلية',p.amount,p.vat,p.total]);
    const csv=[headers,...rows].map(r=>r.join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`purchases-${new Date().toISOString().slice(0,10)}.csv`; a.click();
    showToast(`✅ ${lang==='ar'?'تم تصدير المشتريات':'Purchases exported'}`);
    return;
  }
}

let c_quoteItems = [];
function autoFillPrice() {
  const name = el('qi-name')?.value||'';
  const db = getDB();
  const p = db.products.find(x=>x.name===name);
  if(p && el('qi-price') && !el('qi-price').value) el('qi-price').value = p.sell_price;
}
function addQuoteItem() {
  const name=el('qi-name')?.value; const qty=Number(el('qi-qty')?.value||1); const price=Number(el('qi-price')?.value||0);
  if(!name||!price){showToast(lang==='ar'?'أدخل الاسم والسعر':'Enter name and price','error');return;}
  c_quoteItems.push({name,qty,price,line_total:qty*price});
  el('qi-name').value=''; el('qi-qty').value=1; el('qi-price').value='';
  renderQuoteItems();
}
function removeQuoteItem(i){c_quoteItems.splice(i,1);renderQuoteItems();}
function renderQuoteItems(){
  const list=el('q-items-list'); const totals=el('q-totals'); if(!list) return;
  if(c_quoteItems.length===0){list.innerHTML=`<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:16px;">${lang==='ar'?'أضف منتجات أو خدمات':'Add items'}</div>`;if(totals)totals.innerHTML='';return;}
  list.innerHTML=c_quoteItems.map((i,idx)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px;background:white;border-radius:8px;margin-bottom:6px;border:1px solid var(--border);">

    <button class="icon-btn" style="width:26px;height:26px;" onclick="removeQuoteItem(${idx})">${icon('x',12)}</button>

  </div>`;

function saveQuote(printAfter=true) {
  const db=getDB();
  if(!el('q-customer').value){showToast(lang==='ar'?'اسم العميل مطلوب':'Customer required','error');return;}
  if(c_quoteItems.length===0){showToast(lang==='ar'?'أضف منتجاً واحداً على الأقل':'Add at least one item','error');return;}
  const sub=c_quoteItems.reduce((s,i)=>s+i.line_total,0); const vat=sub*0.15;
  const num=db.nextId.quote||1; db.nextId.quote=num+1;
  const q={id:num,quote_no:`QUO-${String(num).padStart(4,'0')}`,customer_name:el('q-customer').value,
    items:[...c_quoteItems],subtotal:sub,vat_total:vat,grand_total:sub+vat,
    notes:el('q-notes').value,valid_until:el('q-valid').value,
    status:'معلق',created_at:new Date().toISOString()};
  if(!db.quotes)db.quotes=[];
  db.quotes.push(q);saveDB(db);
  logActivity('عروض أسعار',`إنشاء عرض سعر ${q.quote_no} — ${q.customer_name}`);
  showToast(`✅ ${lang==='ar'?'تم إنشاء عرض السعر':'Quote created'}: ${q.quote_no}`);
  closeModal(); if(printAfter)printQuote(q.id); renderPage();
}

function convertQuoteToInvoice(id) {
  const db=getDB(); const q=(db.quotes||[]).find(x=>x.id===id); if(!q)return;
  if(!confirm(lang==='ar'?`تحويل عرض السعر ${q.quote_no} إلى فاتورة؟`:`Convert quote ${q.quote_no} to invoice?`))return;
  const inv={
    id:nextId(db,'invoice'),
    invoice_no:`INV-${new Date().getFullYear()}-${String(db.nextId.invoice-1).padStart(3,'0')}`,
    customer_name:q.customer_name,customer_vat:'',
    items:q.items,subtotal:q.subtotal,discount:0,
    vat_total:q.vat_total,grand_total:q.grand_total,
    payment_method:'آجل',status:'آجل',
    invoice_type:'simplified',zatca_status:false,
    paid_amount:0,quote_ref:q.quote_no,
    created_at:new Date().toISOString()
  };
  db.invoices.push(inv);
  q.status='مقبول'; q.converted_to=inv.invoice_no;
  saveDB(db);
  logActivity('عروض أسعار',`تحويل ${q.quote_no} إلى فاتورة ${inv.invoice_no}`);
  showToast(`✅ ${lang==='ar'?`تم التحويل إلى فاتورة ${inv.invoice_no}`:`Converted to invoice ${inv.invoice_no}`}`);
  renderPage();
}

function filterStockMoves(){

  let moves=(db.stock_moves||[]).slice().reverse();
  if(_smTypeFilter==='in')  moves=moves.filter(m=>m.type==='in');
  if(_smTypeFilter==='out') moves=moves.filter(m=>m.type==='out');
  if(q) moves=moves.filter(m=>m.product_name?.toLowerCase().includes(q)||m.reference?.toLowerCase().includes(q));
  const tbody=el('sm-tbody'); if(!tbody)return;
  tbody.innerHTML=moves.length===0
    ?`<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted);">${lang==='ar'?'لا نتائج':'No results'}</td></tr>`

function saveStockMove(){
  const db=getDB();
  const sel=el('sm-product'); if(!sel?.value){showToast(lang==='ar'?'اختر منتجاً':'Select product','error');return;}
  const opt=sel.options[sel.selectedIndex];
  const pid=Number(sel.value); const qty=Number(el('sm-qty').value||0);
  if(!qty){showToast(lang==='ar'?'أدخل الكمية':'Enter quantity','error');return;}
  const type=el('sm-type').value;
  const prod=db.products.find(p=>p.id===pid); if(!prod)return;
  const oldQty=prod.qty;
  prod.qty=type==='in'?oldQty+qty:Math.max(0,oldQty-qty);
  if(!db.stock_moves)db.stock_moves=[];
  const move={
    id:db.nextId.stock_move||1,
    product_id:pid, product_name:opt.dataset.name, product_code:opt.dataset.code,
    type, qty, balance_before:oldQty, balance_after:prod.qty,
    reason:el('sm-reason').value, note:el('sm-note').value,
    source:el('sm-source')?.value||'',
    reference:el('sm-ref')?.value||'MANUAL',
    date:new Date().toISOString()
  };
  db.stock_moves.push(move); db.nextId.stock_move=(db.nextId.stock_move||1)+1;
  saveDB(db);
  logActivity('مخزون',`حركة ${type==='in'?'وارد':'صادر'} — ${opt.dataset.name} — ${type==='in'?'+':'-'}${qty}`);
  showToast(`✅ ${lang==='ar'?`تم: ${opt.dataset.name} ${type==='in'?'+':'-'}${qty}`:`Done: ${opt.dataset.name} ${type==='in'?'+':'-'}${qty}`}`);
  closeModal(); renderPage();
}

// record stock move automatically from sales
function recordStockMoveAuto(productId, productName, productCode, qty, type, reference){
  const db=getDB();
  const prod=db.products.find(p=>p.id===productId); if(!prod)return;
  if(!db.stock_moves)db.stock_moves=[];
  db.stock_moves.push({
    id:db.nextId.stock_move||1,
    product_id:productId, product_name:productName, product_code:productCode,
    type, qty, balance_before:prod.qty+(type==='out'?qty:0),
    balance_after:prod.qty, reason:type==='out'?(lang==='ar'?'مبيعات':'Sales'):(lang==='ar'?'مشتريات':'Purchases'),
    reference, date:new Date().toISOString()
  });
  db.nextId.stock_move=(db.nextId.stock_move||1)+1;
}
