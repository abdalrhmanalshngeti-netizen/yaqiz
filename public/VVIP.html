// ============ NOTIFICATIONS ============
function getAlerts() {
  const db=getDB(); const alerts=[];
  const now=new Date();
  const isOwner=currentUser?.role==='owner';
  // مخزون منخفض → المخزون
  if(isOwner||has('inventory.view')) {
    db.products.filter(p=>p.qty<=p.min_qty).forEach(p=>{
      alerts.push({type:'warning',icon:'box',title:lang==='ar'?'مخزون منخفض':'Low Stock',msg:`${p.name}: ${p.qty} ${lang==='ar'?'وحدة':'units'}`,page:'inventory'});
    });
  }
  // فاتورة متأخرة (30+ يوم) → المبيعات
  if(isOwner||has('sales.view')) {
    db.invoices.filter(i=>(i.status==='آجل'||i.status==='جزئي')&&Math.floor((now-new Date(i.created_at))/(86400000))>30).forEach(i=>{
      alerts.push({type:'danger',icon:'file-text',title:lang==='ar'?'فاتورة متأخرة':'Overdue Invoice',msg:`${i.invoice_no} — ${i.customer_name}`,page:'sales'});
    });
  }
  // عميل متأخر عن السداد (14+ يوم) → العملاء
  if(isOwner||has('customers.view')) {
    const seen=new Set();
    db.invoices.filter(i=>(i.status==='آجل'||i.status==='جزئي')&&Math.floor((now-new Date(i.created_at))/(86400000))>14&&!seen.has(i.customer_name)&&seen.add(i.customer_name)).forEach(i=>{
      alerts.push({type:'warning',icon:'user',title:lang==='ar'?'عميل متأخر عن السداد':'Overdue Customer',msg:i.customer_name,page:'customers'});
    });
  }
  // التزامات مستحقة (خلال 7 أيام) → الالتزامات
  if(isOwner||has('obligations.view')) {
    (db.obligations||[]).filter(o=>o.status==='active'&&o.next_due&&Math.ceil((new Date(o.next_due)-now)/86400000)<=7).forEach(o=>{
      alerts.push({type:'warning',icon:'repeat',title:lang==='ar'?'التزام مستحق':'Due Obligation',msg:`${o.name} — ${fmtMoney(o.amount)}`,page:'obligations'});
    });
  }
  // سندات معلقة → السندات
  if(isOwner||has('receipts.view')) {
    (db.receipts||[]).filter(r=>r.status==='pending'||r.status==='معلق').forEach(r=>{
      alerts.push({type:'warning',icon:'receipt',title:lang==='ar'?'سند معلق':'Pending Receipt',msg:`${r.receipt_no||''} — ${fmtMoney(r.amount||0)}`,page:'receipts'});
    });
  }
  // مشتريات غير مسددة (30+ يوم) → المشتريات
  if(isOwner||has('purchases.view')) {
    (db.purchases||[]).filter(p=>(p.status==='آجل'||p.status==='unpaid'||(p.remaining_amount||0)>0)&&Math.floor((now-new Date(p.created_at))/(86400000))>30).forEach(p=>{
      alerts.push({type:'danger',icon:'shopping-bag',title:lang==='ar'?'مشتريات غير مسددة':'Unpaid Purchase',msg:`${p.vendor||''} — ${fmtMoney(p.total||p.amount||0)}`,page:'purchases'});
    });
  }
  return alerts;
}

async function _updateNotifBadge() {
  const badge = el('notif-badge');
  if (!badge) return;
  const localCount = getAlerts().length;
  let apiCount = 0;
  if (window._cloudApiFetch) {
    try {
      const r = await window._cloudApiFetch('GET', '/api/notifications/unread-count');
      apiCount = r?.count || 0;
    } catch(e) {}
  }
  const total = localCount + apiCount;
  badge.style.display = total > 0 ? 'flex' : 'none';
  badge.textContent   = total > 9 ? '9+' : (total > 0 ? total : '');
}


// ============ SHIFT SYSTEM ============

function startShift(user) {
  const db = getDB();
  // close any open shift for this user first
  const open = (db.shifts||[]).find(s=>s.username===user.username&&!s.end_time);
  if(open) { open.end_time=new Date().toISOString(); }
  const shift = {
    id: db.nextId.shift||1,
    username: user.username,
    full_name: user.full_name,
    start_time: new Date().toISOString(),
    end_time: null,
    date: new Date().toISOString().slice(0,10),
    sales_cash: 0, sales_card: 0, sales_transfer: 0, sales_credit: 0,
    invoices_count: 0, invoice_ids: []
  };
  if(!db.shifts) db.shifts=[];
  db.shifts.push(shift);
  db.nextId.shift = (db.nextId.shift||1)+1;
  saveDB(db);
  localStorage.setItem('yaqiz_shift_id', shift.id);
}

function endShift(user) {
  const db = getDB();
  const shiftId = Number(localStorage.getItem('yaqiz_shift_id'));
  const shift = (db.shifts||[]).find(s=>s.id===shiftId||(!s.end_time&&s.username===user.username));
  if(shift) {
    shift.end_time = new Date().toISOString();
    saveDB(db);
  }
  localStorage.removeItem('yaqiz_shift_id');
}

function getCurrentShift() {
  const db = getDB();
  const shiftId = Number(localStorage.getItem('yaqiz_shift_id'));
  return (db.shifts||[]).find(s=>s.id===shiftId) || null;
}

function updateShiftOnSale(inv) {
  const db = getDB();
  const shiftId = Number(localStorage.getItem('yaqiz_shift_id'));
  const shift = (db.shifts||[]).find(s=>s.id===shiftId);
  if(!shift) return;
  shift.invoices_count = (shift.invoices_count||0)+1;
  shift.invoice_ids = [...(shift.invoice_ids||[]), inv.id];
  if(inv.payment_method==='نقدي') shift.sales_cash=(shift.sales_cash||0)+inv.grand_total;
  else if(inv.payment_method==='شبكة') shift.sales_card=(shift.sales_card||0)+inv.grand_total;
  else if(inv.payment_method==='تحويل') shift.sales_transfer=(shift.sales_transfer||0)+inv.grand_total;
  else if(inv.payment_method==='آجل') shift.sales_credit=(shift.sales_credit||0)+inv.grand_total;
  saveDB(db);
}

function checkLongShifts() {
  const db = getDB();

  const longShifts = (db.shifts||[]).filter(s=>{

  });
  return longShifts;
}

function savePO() {
  const db=getDB();
  if(!el('po-supplier')?.value){showToast(lang==='ar'?'المورد مطلوب':'Supplier required','error');return;}
  if(!window._poItems?.length){showToast(lang==='ar'?'أضف صنفاً':'Add items','error');return;}
  const total=window._poItems.reduce((s,i)=>s+i.total,0);
  const num=db.nextId.po||1; db.nextId.po=num+1;
  const po={id:num,po_no:`PO-${new Date().getFullYear()}-${String(num).padStart(4,'0')}`,
    supplier:el('po-supplier').value,items:[...window._poItems],total,
    notes:el('po-notes').value,expected_delivery:el('po-delivery').value,
    status:'معلق',created_at:new Date().toISOString()};
  if(!db.purchase_orders)db.purchase_orders=[];
  db.purchase_orders.push(po);saveDB(db);
  logActivity('أوامر شراء',`إنشاء ${po.po_no} — ${po.supplier}`);
  showToast(`✅ ${po.po_no}`);closeModal();renderPage();
}

function convertPOtoPurchase(id) {
  const db=getDB();
  const po=(db.purchase_orders||[]).find(p=>p.id===id); if(!po)return;
  if(!confirm(lang==='ar'?`تأكيد استلام ${po.po_no} وتحويله لمشتريات؟`:`Confirm receiving ${po.po_no}?`))return;
  // Create purchase entry
  const vat=po.total*0.15;
  const p={id:nextId(db,'purchase'),vendor:po.supplier,description:`${lang==='ar'?'استلام':'Received'} ${po.po_no}`,
    category:'بضاعة',purchase_type:'goods',amount:po.total,vat,total:po.total+vat,
    po_ref:po.po_no,created_at:new Date().toISOString()};
  db.purchases.push(p);
  // Update stock for each item
  po.items.forEach(item=>{
    const prod=db.products.find(x=>x.name===item.name);
    if(prod){
      if(!db.stock_moves)db.stock_moves=[];
      const old=prod.qty; prod.qty+=item.qty;
      db.stock_moves.push({id:db.nextId.stock_move||1,product_id:prod.id,product_name:prod.name,product_code:prod.code,
        type:'in',qty:item.qty,balance_before:old,balance_after:prod.qty,
        reason:`استلام ${po.po_no}`,reference:po.po_no,date:new Date().toISOString()});
      db.nextId.stock_move=(db.nextId.stock_move||1)+1;
    }
  });
  // Treasury
  db.treasury.balance-=(po.total+vat);
  db.treasury.moves.unshift({id:nextId(db,'treasury'),type:'out',amount:po.total+vat,
    description:`مشتريات: ${po.supplier} — ${po.po_no}`,reference:po.po_no,date:new Date().toISOString()});
  po.status='مكتمل'; po.received_at=new Date().toISOString();
  saveDB(db);
  logActivity('أوامر شراء',`استلام ${po.po_no} — ${po.supplier}`);
  showToast(`✅ ${lang==='ar'?'تم الاستلام وتحديث المخزون':'Received & stock updated'}`);
  renderPage();
}

function updatePOStatus(id,status) {
  const db=getDB(); const po=(db.purchase_orders||[]).find(p=>p.id===id);
  if(po){po.status=status;saveDB(db);renderPage();}
}

// ============ BALANCE SHEET ============
function renderBalanceSheet(c) {
  const db = getDB();

  // ── الأصول ──────────────────────────────────────────────────
  const cash = parseFloat(db.treasury?.balance||0);

  // الذمم المدينة: من الفواتير غير المسددة بالكامل
  const receivables = db.invoices
    .filter(i=>['آجل','جزئي'].includes(i.status))
    .reduce((s,i)=>s+Math.max(0,parseFloat(i.grand_total||0)-parseFloat(i.paid_amount||0)),0);

  // قيمة المخزون بسعر الشراء
  const inventoryVal = db.products.reduce((s,p)=>s+(parseFloat(p.qty||0)*parseFloat(p.buy_price||0)),0);

  const totalAssets = cash + receivables + inventoryVal;

  // ── الخصوم ──────────────────────────────────────────────────
  // الذمم الدائنة: من المشتريات غير المسددة — نفس منطق الذمم المدينة
  const accountsPayable = db.purchases
    .filter(p=>(p.status==='آجل'||p.status==='جزئي'||(parseFloat(p.remaining_amount||0)>0)))
    .reduce((s,p)=>{
      const rem = p.remaining_amount!=null
        ? parseFloat(p.remaining_amount||0)
        : Math.max(0,parseFloat(p.total||0)-parseFloat(p.paid_amount||0));
      return s+Math.max(0,rem);
    },0);

  // ضريبة القيمة المضافة الصافية المستحقة
  const outputVAT = db.invoices.reduce((s,i)=>s+parseFloat(i.vat_total||0),0);
  const inputVAT  = db.purchases.reduce((s,p)=>s+parseFloat(p.vat||0),0);
  const vatPayable = Math.max(0, outputVAT - inputVAT);

  const totalLiab = accountsPayable + vatPayable;

  // ── نتيجة الأعمال (لحساب حقوق الملكية) ──────────────────
  const salesReturns = (db.returns||[]).filter(r=>r.type==='sales').reduce((s,r)=>s+parseFloat(r.base_amount||0),0);
  const purchReturns = (db.returns||[]).filter(r=>r.type==='purchases').reduce((s,r)=>s+parseFloat(r.base_amount||0),0);
  const netRevenue = db.invoices.reduce((s,i)=>s+parseFloat(i.subtotal||0),0) - salesReturns;
  const netCOGS    = db.purchases.filter(p=>p.purchase_type==='goods'||p.category==='بضاعة')
                       .reduce((s,p)=>s+parseFloat(p.amount||0),0) - purchReturns;
  const netOPEX    = db.purchases.filter(p=>p.purchase_type==='opex'||(p.category&&p.category!=='بضاعة'&&p.purchase_type!=='goods'))
                       .reduce((s,p)=>s+parseFloat(p.amount||0),0);
  const grossProfit = netRevenue - netCOGS;
  const netProfit   = grossProfit - netOPEX;
  const isProfit    = netProfit >= 0;

  // حقوق الملكية = أصول − خصوم
  const equity = totalAssets - totalLiab;

  // ── مساعد بناء البطاقات ──────────────────────────────────
  const section = (title, color, items, total, footerHtml='') => `
    <div class="card" style="border-top:3px solid ${color};margin-bottom:0;">
      <div class="card-head"><h3 style="color:${color};margin:0;">${title}</h3><b style="color:${color};font-size:15px;">${fmtMoney(total)}</b></div>
      <div class="card-pad" style="padding-top:6px;">
        ${items.map(row=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <span style="color:var(--text-muted);">${row.label}</span>
          <span style="font-weight:700;color:${row.color||'inherit'};">${row.prefix||''}${fmtMoney(Math.abs(row.val))}${row.suffix||''}</span>
        </div>`).join('')}
        <div style="display:flex;justify-content:space-between;padding:10px 0 2px;font-weight:900;font-size:15px;color:${color};">
          <span>${lang==='ar'?'الإجمالي':'Total'}</span><span>${fmtMoney(total)}</span>
        </div>
        ${footerHtml}
      </div>
    </div>`;

  c.innerHTML = `
  <div>
    <div class="page-header">
      <div>
        <div class="page-title-lg">${lang==='ar'?'الميزانية العمومية':'Balance Sheet'}</div>
        <div class="page-sub">${lang==='ar'?'حتى تاريخ:':'As of:'} ${new Date().toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})}</div>
      </div>
    </div>

    <!-- بطاقات الملخص -->
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px;">
      <div class="stat-card">
        <div class="stat-icon green">${icon('trending-up',22)}</div>
        <div class="stat-label">${lang==='ar'?'إجمالي الأصول':'Total Assets'}</div>
        <div class="stat-value">${fmtMoney(totalAssets)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red">${icon('trending-down',22)}</div>
        <div class="stat-label">${lang==='ar'?'إجمالي الخصوم':'Total Liabilities'}</div>
        <div class="stat-value">${fmtMoney(totalLiab)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon blue">${icon('scale',22)}</div>
        <div class="stat-label">${lang==='ar'?'صافي حقوق الملكية':'Net Equity'}</div>
        <div class="stat-value">${fmtMoney(equity)}</div>
      </div>
      <div class="stat-card" style="border:2px solid ${isProfit?'#16a34a':'#dc2626'};">
        <div class="stat-icon ${isProfit?'green':'red'}">${icon(isProfit?'trending-up':'trending-down',22)}</div>
        <div class="stat-label" style="font-weight:800;color:${isProfit?'#16a34a':'#dc2626'};">
          ${isProfit?(lang==='ar'?'✅ الشركة رابحة':'✅ Profitable'):(lang==='ar'?'❌ الشركة خاسرة':'❌ Loss')}
        </div>
        <div class="stat-value" style="color:${isProfit?'var(--success)':'var(--danger)'};">${fmtMoney(Math.abs(netProfit))}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">

      <!-- عمود الأصول -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        ${section(lang==='ar'?'📦 الأصول':'📦 Assets','#16a34a',[
          {label:lang==='ar'?'النقدية والخزينة':'Cash & Treasury', val:cash, color:'#16a34a'},
          {label:lang==='ar'?'الذمم المدينة (مبالغ لك على العملاء)':'Accounts Receivable', val:receivables, color:receivables>0?'#b45309':'inherit'},
          {label:lang==='ar'?'قيمة المخزون (بسعر التكلفة)':'Inventory at Cost', val:inventoryVal, color:'#1e40af'},
        ],totalAssets)}
      </div>

      <!-- عمود الخصوم وحقوق الملكية -->
      <div style="display:flex;flex-direction:column;gap:16px;">

        ${section(lang==='ar'?'💳 الخصوم (ما عليك)':'💳 Liabilities','#dc2626',[
          {label:lang==='ar'?'الذمم الدائنة (مستحق للموردين)':'Accounts Payable to Suppliers', val:accountsPayable, color:accountsPayable>0?'#dc2626':'inherit'},
          {label:lang==='ar'?'ضريبة القيمة المضافة المستحقة':'VAT Payable (Net)', val:vatPayable, color:vatPayable>0?'#dc2626':'inherit'},
        ],totalLiab)}

        <!-- حقوق الملكية + نتيجة الأعمال -->
        <div class="card" style="border-top:3px solid #1e40af;">
          <div class="card-head">
            <h3 style="color:#1e40af;margin:0;">${lang==='ar'?'🏛️ حقوق الملكية':'🏛️ Equity'}</h3>
            <b style="color:#1e40af;font-size:15px;">${fmtMoney(equity)}</b>
          </div>
          <div class="card-pad" style="padding-top:6px;">
            <!-- نتيجة الأعمال -->
            <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;">${lang==='ar'?'نتيجة الأعمال:':'Business Result:'}</div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
              <span style="color:var(--text-muted);">${lang==='ar'?'إجمالي الإيرادات (بدون ضريبة)':'Total Revenue (ex-VAT)'}</span>
              <span style="font-weight:700;color:#16a34a;">+ ${fmtMoney(netRevenue)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
              <span style="color:var(--text-muted);">${lang==='ar'?'تكلفة البضاعة المباعة (COGS)':'Cost of Goods Sold'}</span>
              <span style="font-weight:700;color:#dc2626;">− ${fmtMoney(netCOGS)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
              <span style="color:var(--text-muted);">${lang==='ar'?'هامش الربح الإجمالي':'Gross Profit'}</span>
              <span style="font-weight:800;color:${grossProfit>=0?'#16a34a':'#dc2626'};">${fmtMoney(grossProfit)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
              <span style="color:var(--text-muted);">${lang==='ar'?'المصاريف التشغيلية (OPEX)':'Operating Expenses'}</span>
              <span style="font-weight:700;color:#dc2626;">− ${fmtMoney(netOPEX)}</span>
            </div>
            <!-- صافي الربح/الخسارة — بارز -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px 14px;border-radius:10px;background:${isProfit?'#dcfce7':'#fee2e2'};">
              <span style="font-weight:900;font-size:14px;color:${isProfit?'#16a34a':'#dc2626'};">
                ${isProfit?(lang==='ar'?'✅ صافي الربح':'✅ Net Profit'):(lang==='ar'?'❌ صافي الخسارة':'❌ Net Loss')}
              </span>
              <span style="font-weight:900;font-size:18px;color:${isProfit?'#16a34a':'#dc2626'};">${fmtMoney(Math.abs(netProfit))}</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0 2px;font-weight:900;font-size:15px;color:#1e40af;">
              <span>${lang==='ar'?'إجمالي حقوق الملكية':'Total Equity'}</span><span>${fmtMoney(equity)}</span>
            </div>
          </div>
        </div>

        <!-- فحص التوازن -->
        <div style="background:${Math.abs(totalAssets-(totalLiab+equity))<1?'#dcfce7':'#fef3c7'};padding:12px 16px;border-radius:10px;text-align:center;font-weight:800;font-size:13px;">
          ${Math.abs(totalAssets-(totalLiab+equity))<1
            ?`✅ ${lang==='ar'?'أصول = خصوم + حقوق ملكية':'Assets = Liabilities + Equity'} (${fmtMoney(totalAssets)})`
            :`⚠️ ${lang==='ar'?'فرق بسيط':'Minor gap'}: ${fmtMoney(Math.abs(totalAssets-(totalLiab+equity)))}`}
        </div>
      </div>
    </div>
  </div>`;
  refreshIcons();
}

function addJELine() { window._jEntries.push({account:'',account_code:'',side:'credit',amount:0}); renderJELines(); }

function renderJEBalance() {
  const bal=el('je-balance'); if(!bal)return;
  const debits=window._jEntries.filter(e=>e.side==='debit').reduce((s,e)=>s+e.amount,0);
  const credits=window._jEntries.filter(e=>e.side==='credit').reduce((s,e)=>s+e.amount,0);
  const diff=Math.abs(debits-credits);
  bal.style.background=diff<0.01?'#dcfce7':'#fee2e2';
  bal.style.color=diff<0.01?'#15803d':'#b91c1c';
  bal.innerHTML=diff<0.01
    ?`✅ ${lang==='ar'?'القيد متوازن':'Entry Balanced'} — ${fmtMoney(debits)}`
    :`⚠️ ${lang==='ar'?'فرق:':'Difference:'} ${fmtMoney(diff)} | ${lang==='ar'?'مدين:':'Dr:'} ${fmtMoney(debits)} | ${lang==='ar'?'دائن:':'Cr:'} ${fmtMoney(credits)}`;
}

function saveJournalEntry() {
  const db=getDB();
  if(!el('je-desc')?.value){showToast(lang==='ar'?'البيان مطلوب':'Description required','error');return;}
  const debits=window._jEntries.filter(e=>e.side==='debit').reduce((s,e)=>s+e.amount,0);
  const credits=window._jEntries.filter(e=>e.side==='credit').reduce((s,e)=>s+e.amount,0);
  if(Math.abs(debits-credits)>0.01){showToast(lang==='ar'?'القيد غير متوازن':'Entry not balanced','error');return;}
  if(!db.journal)db.journal=[];
  if(!db.nextId.journal)db.nextId.journal=1;
  const entry={id:db.nextId.journal++,date:new Date(el('je-date').value).toISOString(),
    description:el('je-desc').value,entries:[...window._jEntries],ref:'MANUAL',
    created_by:currentUser?.username,created_at:new Date().toISOString()};
  db.journal.push(entry);saveDB(db);
  logActivity('قيود يومية',`قيد يدوي #${entry.id} — ${entry.description}`);
  showToast(`✅ ${lang==='ar'?'تم حفظ القيد':'Entry saved'}`);
  closeModal();renderPage();
}

function saveLoyaltySettings() {
  const db=getDB();
  db.loyalty_settings={enabled:el('ly-enabled')?.checked||false,points_per_sar:Number(el('ly-pps')?.value||1),sar_per_point:Number(el('ly-spp')?.value||0.1)};
  saveDB(db);showToast(`✅ ${lang==='ar'?'تم الحفظ':'Saved'}`);renderPage();
}

function addLoyaltyPoints(customerName, amount) {
  const db=getDB();
  const ls=db.loyalty_settings||{};
  if(!ls.enabled)return;
  if(!db.loyalty_points)db.loyalty_points={};
  const pts=Math.floor(amount*(ls.points_per_sar||1));
  db.loyalty_points[customerName]=(db.loyalty_points[customerName]||0)+pts;
  saveDB(db);
  if(pts>0) showToast(`⭐ ${lang==='ar'?`${customerName} كسب ${pts} نقطة`:`${customerName} earned ${pts} points`}`);
}

function showAddPointsModal() {
  const db=getDB();
  const mc=el('modal-container');
  mc.innerHTML=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head"><h3>${lang==='ar'?'إضافة نقاط يدوي':'Add Points Manually'}</h3><button class="icon-btn" onclick="closeModal()">${icon('x',18)}</button></div>

function saveManualPoints() {
  const db=getDB(); const cust=el('ap-cust')?.value; const pts=Number(el('ap-pts')?.value||0);
  if(!cust||!pts){showToast(lang==='ar'?'أدخل العميل والنقاط':'Enter customer and points','error');return;}
  if(!db.loyalty_points)db.loyalty_points={};
  db.loyalty_points[cust]=(db.loyalty_points[cust]||0)+pts;
  saveDB(db);showToast(`✅ ${pts} ${lang==='ar'?'نقطة أضيفت لـ':'points added to'} ${cust}`);closeModal();renderPage();
}

function redeemPoints(customerName) {
  const db=getDB(); const pts=db.loyalty_points?.[customerName]||0;
  const ls=db.loyalty_settings||{sar_per_point:0.1};
  const val=pts*ls.sar_per_point;
  if(!confirm(lang==='ar'?`استرداد ${pts} نقطة بقيمة ${fmtMoney(val)} لـ ${customerName}؟`:`Redeem ${pts} points worth ${fmtMoney(val)} for ${customerName}?`))return;
  db.loyalty_points[customerName]=0;
  saveDB(db);showToast(`✅ ${lang==='ar'?'تم الاسترداد':'Redeemed'}: ${fmtMoney(val)}`);renderPage();
}

function handleImportFile(input, type, format) {
  const file = input.files[0]; if(!file) return;
  const status = el('import-status');
  const preview = el('import-preview');
  if(preview) preview.style.display='none';
  if(status) status.innerHTML = `<div style="text-align:center;padding:16px;color:var(--text-muted);">⏳ ${lang==='ar'?'جاري القراءة...':'Reading...'}</div>`;

  const ext = file.name.split('.').pop().toLowerCase();
  const isExcel = ext==='xlsx' || ext==='xls';

  function parseRows(rows) {
    let parsed;
    if(type==='purchases') {
      parsed = rows.filter(r=>r[0]).map(r=>({
        vendor:String(r[0]||'').trim(), category:String(r[1]||'بضاعة').trim(),
        description:String(r[2]||'').trim(), amount:Number(r[3])||0,
        purchase_type:(String(r[4]||'')).includes('إداري')||(String(r[4]||'')).toLowerCase().includes('admin')?'opex':'goods'
      }));
      if(!parsed.length) { if(status) status.innerHTML=`<div style="background:#fee2e2;padding:12px;border-radius:8px;color:var(--danger);">⚠️ ${lang==='ar'?'لا يوجد بيانات في الملف — تأكد من صحة الأعمدة':'No data found — check column format'}</div>`; return; }
      // pre-fill the add form instead of showing import preview
      closeModal();
      const aiData = {
        vendor: parsed[0].vendor,
        date: new Date().toISOString().slice(0,10),
        invoice_no: '',
        items: parsed.map(r=>({ description: r.description || r.vendor || 'بند', qty: 1, unit_price: r.amount||0, total: r.amount||0 })),
        subtotal: parsed.reduce((s,r)=>s+(r.amount||0),0),
        vat_amount: 0,
        grand_total: parsed.reduce((s,r)=>s+(r.amount||0),0)
      };
      openPurchaseFormWithAIData(aiData, null);
      return;
    } else {
      parsed = rows.filter(r=>r[1]).map(r=>({
        code:String(r[0]||'').trim(), name:String(r[1]||'').trim(),
        category:String(r[2]||'عام').trim(), unit:String(r[3]||'قطعة').trim(),
        buy_price:Number(r[4])||0, sell_price:Number(r[5])||0,
        qty:Number(r[6])||0, min_qty:Number(r[7])||5
      }));
    }
    if(status) status.innerHTML='';
    showImportPreview(parsed, type, isExcel?'excel':'csv');
  }

  if(isExcel) {
    if(typeof XLSX === 'undefined') {
      if(status) status.innerHTML = `<div style="background:#fee2e2;padding:12px;border-radius:8px;color:var(--danger);">⚠️ ${lang==='ar'?'مكتبة Excel غير محملة. تأكد من الاتصال بالإنترنت':'Excel library not loaded. Check internet connection'}</div>`;
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        const rows = data.slice(1).filter(r=>r.some(c=>String(c).trim()));
        parseRows(rows);
      } catch(err) {
        if(status) status.innerHTML = `<div style="background:#fee2e2;padding:12px;border-radius:8px;color:var(--danger);">⚠️ ${lang==='ar'?'خطأ في قراءة ملف Excel':'Error reading Excel file'}: ${err.message}</div>`;
      }
    };
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const text = e.target.result.replace(/\r/g,'');
        const lines = text.split('\n').filter(l=>l.trim());
        const sample = lines[0]||'';
        const sep = sample.includes('\t') ? '\t' : sample.includes(';') ? ';' : ',';
        const rows = lines.slice(1).map(l=>{
          const cols=[]; let cur=''; let inQ=false;
          for(let i=0;i<l.length;i++){
            const ch=l[i];
            if(ch==='"'){inQ=!inQ;}
            else if(ch===sep&&!inQ){cols.push(cur.trim());cur='';}
            else{cur+=ch;}
          }
          cols.push(cur.trim());
          return cols.map(c=>c.replace(/^"|"$/g,'').trim());
        });
        parseRows(rows);
      } catch(err) {
        if(status) status.innerHTML = `<div style="background:#fee2e2;padding:12px;border-radius:8px;color:var(--danger);">⚠️ ${lang==='ar'?'خطأ في قراءة الملف. تأكد من صحة الصيغة':'File read error. Check format'}</div>`;
      }
    };
    reader.readAsText(file, 'UTF-8');
  }
}


async function handlePDFImport(input, type) {
  const file = input.files[0]; if(!file) return;
  const status = el('import-status');
  const preview = el('import-preview');
  if(preview) preview.style.display='none';
  if(status) status.innerHTML = `<div style="text-align:center;padding:16px;color:var(--text-muted);">⏳ ${lang==='ar'?'جاري قراءة PDF...':'Reading PDF...'}</div>`;

  try {
    if(typeof pdfjsLib === 'undefined') throw new Error(lang==='ar'?'مكتبة PDF غير محملة — تأكد من الاتصال بالإنترنت':'PDF library not loaded — check internet connection');
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/public/pdf.worker.min.js';

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
    let fullText = '';
    for(let i=1; i<=pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const tc = await page.getTextContent();
      fullText += tc.items.map(x=>x.str).join(' ') + '\n';
    }
    parsePDFText(fullText, type, file.name);
  } catch(err) {
    if(status) status.innerHTML = `<div style="background:#fee2e2;padding:12px;border-radius:8px;color:var(--danger);">⚠️ ${err.message}</div>`;
  }
}

function parsePDFText(text, type, filename) {
  const status = el('import-status');
  // أرقام عربية → لاتينية
  const normalizeNum = s => s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,'');
  const findNum = (patterns) => {
    for(const p of patterns) {
      const m = text.match(p);
      if(m) return parseFloat(normalizeNum(m[1]||m[2]||'0'))||0;
    }
    return 0;
  };
  const findText = (patterns) => {
    for(const p of patterns) {
      const m = text.match(p);
      if(m) return (m[1]||'').trim();
    }
    return '';
  };

  if(type === 'purchases') {
    const vendor = findText([
      /(?:اسم\s*المورد|المورد|الجهة|Vendor|Supplier)\s*[:\-]\s*([^\n\r،,]+)/i,
      /(?:من|From)\s*[:\-]\s*([^\n\r،,]+)/i,
    ]) || filename.replace('.pdf','');

    const subtotal = findNum([
      /(?:المبلغ\s*(?:قبل|خالي|بدون)\s*الضريبة|Subtotal|Sub.Total)\s*[:\-]?\s*([\d,٠-٩.]+)/i,
      /(?:الإجمالي\s*(?:قبل|الخاضع)|Amount\s*before)\s*[:\-]?\s*([\d,٠-٩.]+)/i,
    ]);
    const vat = findNum([
      /(?:ضريبة\s*القيمة|الضريبة|VAT|Tax)\s*[:\-]?\s*([\d,٠-٩.]+)/i,
    ]);
    const total = findNum([
      /(?:الإجمالي\s*(?:الكلي|الشامل|مع الضريبة)|المبلغ\s*الإجمالي|Grand\s*Total|Total\s*Amount)\s*[:\-]?\s*([\d,٠-٩.]+)/i,
      /(?:الإجمالي|Total)\s*[:\-]?\s*([\d,٠-٩.]+)/i,
    ]) || (subtotal + vat);

    // محاولة استخراج الأصناف
    const itemRows = [];
    const itemRegex = /([^\d\n]{3,40})\s+([\d,٠-٩.]+)\s+([\d,٠-٩.]+)\s+([\d,٠-٩.]+)/g;
    let m;
    while((m=itemRegex.exec(text))!==null && itemRows.length<20) {
      const qty=parseFloat(normalizeNum(m[2]))||1;
      const price=parseFloat(normalizeNum(m[3]))||0;
      const lineTotal=parseFloat(normalizeNum(m[4]))||0;
      if(price>0&&lineTotal>0) itemRows.push({name:m[1].trim(), qty, price, total:lineTotal});
    }

    const data = {vendor, description:`فاتورة مستوردة من PDF — ${filename}`, subtotal:subtotal||total/1.15, vat:vat||total*0.15/1.15, total:total||subtotal*1.15, items:itemRows, _raw:text.slice(0,500)};
    if(!data.total) { if(status) status.innerHTML=`<div style="background:#fef3c7;padding:12px;border-radius:8px;">⚠️ ${lang==='ar'?'تعذّر استخراج الإجمالي. راجع البيانات يدوياً':'Could not extract total. Review manually'}</div>`; }
    showImportPreview(data, type, 'pdf');

  } else {
    // inventory: نبحث عن جدول منتجات
    const rows = [];
    const lines = text.split(/\n/);
    lines.forEach(line=>{
      const parts = line.trim().split(/\s{2,}|\t/);
      if(parts.length>=3) {
        const price = parseFloat(normalizeNum(parts[parts.length-1]))||0;
        const qty   = parseFloat(normalizeNum(parts[parts.length-2]))||0;
        const name  = parts.slice(0,-2).join(' ').trim();
        if(name.length>1 && price>0) rows.push({code:'', name, category:'عام', unit:'قطعة', buy_price:price*0.8, sell_price:price, qty, min_qty:5});
      }
    });
    if(!rows.length) {
      if(status) status.innerHTML=`<div style="background:#fef3c7;padding:12px;border-radius:8px;">⚠️ ${lang==='ar'?'لم يُعثر على جدول منتجات واضح في الـ PDF':'No clear product table found in PDF'}</div>`;
      return;
    }
    showImportPreview(rows, type, 'pdf');
  }
}

function showImportPreview(data, type, format) {
  const preview = el('import-preview');
  if(!preview) return;
  preview.style.display = 'block';

  const _esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // store data safely — no inline JSON in onclick
  window._importPending = { data, type, format };

  let html = `<div style="background:var(--bg);border-radius:10px;padding:12px;margin-bottom:12px;">
    <div style="font-weight:800;margin-bottom:8px;">👁️ ${lang==='ar'?'معاينة البيانات المستخرجة:':'Preview extracted data:'}</div>`;

  if(type==='purchases' && !Array.isArray(data)) {
    html += `<div style="font-size:13px;">
      <div><b>${lang==='ar'?'المورد:':'Vendor:'}</b> ${_esc(data.vendor)||'-'}</div>
      <div><b>${lang==='ar'?'البيان:':'Description:'}</b> ${_esc(data.description)||'-'}</div>
      ${(data.items||[]).map(i=>`<div style="margin-inline-start:12px;font-size:12px;color:var(--text-muted);">• ${_esc(i.name)} × ${_esc(i.qty)} = ${fmtMoney(i.total||i.qty*i.price)}</div>`).join('')}
      <div style="margin-top:8px;"><b>${lang==='ar'?'الإجمالي:':'Total:'}</b> ${fmtMoney(data.total)}</div>
    </div>`;
  } else {
    const items = Array.isArray(data) ? data : [];
    html += `<div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${items.length} ${lang==='ar'?'سجل':'records'}</div>`;
    html += `<div style="max-height:150px;overflow-y:auto;">
      ${items.slice(0,5).map(i=>`<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;">
        ${type==='purchases'?`${_esc(i.vendor)} — ${_esc(i.description)} — ${fmtMoney(i.amount)}`:
        `${_esc(i.code)} | ${_esc(i.name)} | ${fmtMoney(i.sell_price)} | ${lang==='ar'?'مخزون:':'Stock:'} ${_esc(i.qty)}`}
      </div>`).join('')}
      ${items.length>5?`<div style="text-align:center;font-size:11px;color:var(--text-muted);padding:4px;">+${items.length-5} ${lang==='ar'?'أخرى':'more'}</div>`:''}
    </div>`;
  }
  html += `</div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-primary btn-full" onclick="if(window._importPending){confirmImport(window._importPending.data,window._importPending.type,window._importPending.format)}">${icon('check',16)} ${lang==='ar'?'تأكيد الاستيراد':'Confirm Import'}</button>
    <button class="btn btn-outline" onclick="el('import-preview').style.display='none';window._importPending=null;">${lang==='ar'?'إلغاء':'Cancel'}</button>
  </div>`;

  preview.innerHTML = html;
}

function confirmImport(data, type, format) {
  const db = getDB();
  let added = 0; let updated = 0;

  if (type === 'purchases') {
    // للمشتريات: افتح النموذج بدل الحفظ المباشر
    const aiData = Array.isArray(data) ? {
      vendor: data[0]?.vendor || '',
      date: new Date().toISOString().slice(0,10),
      invoice_no: '',
      items: data.map(r => ({ description: r.description || r.vendor || 'بند', qty: 1, unit_price: r.amount||0, total: r.amount||0 })),
      subtotal: data.reduce((s,r)=>s+(r.amount||0),0),
      vat_amount: 0,
      grand_total: data.reduce((s,r)=>s+(r.amount||0),0)
    } : {
      vendor: data.vendor || '',
      date: new Date().toISOString().slice(0,10),
      invoice_no: '',
      items: (data.items||[]).map(i=>({ description:i.name||i.description||'بند', qty:i.qty||1, unit_price:i.price||i.unit_price||0, total:i.total||0 })),
      subtotal: data.subtotal || data.total/1.15 || 0,
      vat_amount: data.vat || data.total*0.15/1.15 || 0,
      grand_total: data.total || 0
    };
    openPurchaseFormWithAIData(aiData, null);
    return;
  }

  // Inventory — حفظ بعد تأكيد يدوي
  const items = Array.isArray(data) ? data : [];
  items.forEach(item=>{
    if(!item.name) return;
    const ex = db.products.find(p=>p.code===item.code||p.name===item.name);
    if(ex) {
      Object.assign(ex, {buy_price:item.buy_price||ex.buy_price, sell_price:item.sell_price||ex.sell_price, qty:item.qty||ex.qty});
      updated++;
    } else {
      db.products.push({id:nextId(db,'product'),...item,min_qty:item.min_qty||5});
      added++;
    }
  });

  saveDB(db);
  logActivity('استيراد', `استيراد منتجات: ${added} جديد، ${updated} محدّث`);
  showToast(`✅ ${lang==='ar'?`تم: ${added} جديد، ${updated} محدّث`:`Done: ${added} added, ${updated} updated`}`);
  closeModal();
  renderPage();
}

  <div class="footer">يقظ — نظام محاسبي ذكي • تم إنشاء هذا التقرير بتاريخ ${new Date().toLocaleString('en-US')}</div>

// Export account statement (party)
function exportPartyStatementPDF(partyName) {
  const db=getDB();
  const now=new Date();
  const rows=[];
  db.invoices.filter(i=>i.customer_name===partyName).forEach(i=>{
    rows.push({date:i.created_at,type:'فاتورة مبيعات',ref:i.invoice_no,debit:i.grand_total,credit:0,status:i.status});
  });
  (db.receipts||[]).filter(r=>r.party===partyName).forEach(r=>{
    rows.push({date:r.created_at,type:r.type==='receipt'?'سند قبض':'سند صرف',ref:r.voucher_no,debit:r.type==='payment'?r.amount:0,credit:r.type==='receipt'?r.amount:0,status:'—'});
  });
  db.purchases.filter(p=>p.vendor===partyName).forEach(p=>{
    rows.push({date:p.created_at,type:'فاتورة مشتريات',ref:`PUR-${p.id}`,debit:0,credit:p.total,status:'—'});
  });
  rows.sort((a,b)=>new Date(a.date)-new Date(b.date));
  let running=0;
  const html=`
    <table>
      <thead><tr><th>التاريخ</th><th>البيان</th><th>المرجع</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
      <tbody>
        ${rows.map(r=>{running+=r.debit-r.credit;return`<tr>
          <td>${fmtDate(r.date)}</td><td>${r.type}</td><td>${r.ref}</td>
          <td>${r.debit>0?fmtMoney(r.debit):'-'}</td>
          <td>${r.credit>0?fmtMoney(r.credit):'-'}</td>
          <td>${fmtMoney(Math.abs(running))} ${running>0?'مدين':'دائن'}</td>
        </tr>`;}).join('')}
      </tbody>
      <tfoot><tr class="total-row">
        <td colspan="3">صافي الرصيد</td>
        <td>${fmtMoney(rows.reduce((s,r)=>s+r.debit,0))}</td>
        <td>${fmtMoney(rows.reduce((s,r)=>s+r.credit,0))}</td>
        <td style="color:${running>0?'#dc2626':'#16a34a'};">${fmtMoney(Math.abs(running))} ${running>0?'مستحق لك':'مستحق عليك'}</td>
      </tr></tfoot>
    </table>`;
  exportReportPDF(`كشف حساب: ${partyName}`, html);
}

async function renderAdminSessionsTab(mc) {
  mc.innerHTML = `<div style="max-width:640px;margin-top:16px;">

          🚫 إلغاء جميع الجلسات
        </button>
      </div>
      <div id="admin-sessions-list"><div style="text-align:center;padding:20px;color:var(--text-muted);">⟳ جاري التحميل...</div></div>
    </div></div>
  </div>`;
  try {
    const res = await apiFetch('GET', '/api/auth/admin-accesses');
    const list = el('admin-sessions-list');
    if (!list) return;
    if (!res?.data?.length) {
      list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">✅ لا توجد جلسات إدارية مسجّلة</div>`;
      return;
    }
    list.innerHTML = res.data.map(r => {
      const isRevoke = r.description?.includes('إلغاء');
      return `<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:${isRevoke?'#22c55e':'#f97316'};"></div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;">${r.description||'—'}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${fmtDate(r.created_at)}</div>
        </div>
      </div>`;
    }).join('');
  } catch {
    const list = el('admin-sessions-list');
    if (list) list.innerHTML = `<div style="color:var(--danger);font-size:13px;padding:10px;">خطأ في التحميل</div>`;
  }
}

async function revokeAdminSessions() {
  if (!confirm('هل تريد إلغاء جميع جلسات الدخول الإداري الحالية؟\nسيُطرد الأدمن فوراً إذا كان متصلاً.')) return;
  try {
    await apiFetch('POST', '/api/auth/revoke-admin-sessions');
    showToast('✅ تم إلغاء جميع جلسات الأدمن', 'success');
    renderAdminSessionsTab(el('settings-main-content'));
  } catch { showToast('خطأ في الإلغاء', 'error'); }
}
function renderPricingPolicies(c) {
  const prods = (getDB().products || []).filter(p => !p.deleted);
  const withPolicy  = prods.filter(p => p.auto_price_update);
  const noPolicy    = prods.filter(p => !p.auto_price_update);

  const row = (p) => {
    const pct   = parseFloat(p.profit_policy_value) || 0;
    const buy   = parseFloat(p.buy_price)  || 0;
    const sell  = parseFloat(p.sell_price) || 0;
    const computed = buy > 0 ? Math.round(buy * (1 + pct/100) * 100)/100 : null;
    const diff  = computed !== null ? Math.round((computed - sell)*100)/100 : null;
    const badge = diff === null ? '' : Math.abs(diff) < 0.01
      ? `<span style="font-size:10px;padding:2px 7px;background:rgba(34,197,94,.15);color:#22c55e;border-radius:5px;">✓ متزامن</span>`
      : `<span style="font-size:10px;padding:2px 7px;background:rgba(251,191,36,.15);color:#fbbf24;border-radius:5px;cursor:pointer;" onclick="showProductModal(${p.id})">تحديث سعر البيع → ${computed} ر.س</span>`;
    return `<div style="display:grid;grid-template-columns:1fr 90px 90px 90px auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-size:13px;font-weight:700;">${p.name}</div>
        <div style="font-size:11px;color:var(--text-muted);">${p.category||''}</div>
      </div>

function saveSettings() {
  const db = getDB();
  const company_name = el('s-name')?.value||'';
  const vat_number   = el('s-vat')?.value||'';
  const cr_number    = el('s-cr')?.value||'';
  const phone        = el('s-phone')?.value||'';
  const address      = el('s-addr')?.value||'';
  db.settings = { ...db.settings, company_name, vat_number, cr_number, phone, address, zatca_env:el('s-zatca-env')?.value };
  saveDB(db);
  showToast(`✅ ${t('save')}`);
  // مزامنة مع API (للمالك فقط)
  if (window._apiReachable && window._cloudApiFetch && currentUser?.role === 'owner') {
    window._cloudApiFetch('PUT', '/api/auth/company', {
      company_name, vat_number, cr_number, address, contact_phone: phone
    }).catch(e => console.warn('Company sync:', e.message));
  }
  renderShell();
}

function toggleVAT(enabled) {
  const db = getDB();
  db.settings = { ...db.settings, vat_enabled: enabled };
  saveDB(db);
  showToast(enabled ? `✅ ${lang==='ar'?'تم تفعيل ضريبة القيمة المضافة 15%':'VAT 15% enabled'}` : `⭕ ${lang==='ar'?'تم إيقاف ضريبة القيمة المضافة':'VAT disabled'}`);
  renderSettingsContent();
}

function doGlobalSearch(q) {
  const dd = el('search-dropdown');
  if (!dd) return;
  if (!q || q.trim().length < 1) { dd.style.display = 'none'; return; }
  dd.style.display = 'block';
  const db = getDB();
  const ql = q.toLowerCase();
  let html = '';

  const invs = db.invoices.filter(i => i.invoice_no.toLowerCase().includes(ql) || i.customer_name.toLowerCase().includes(ql));
  if (invs.length) {
    html += `<div class="search-section-title">${lang==='ar'?'الفواتير':'Invoices'}</div>`;
    html += invs.slice(0,4).map(i => `
      <div class="search-item" onclick="closeSearch();goTo('sales')">
        <div class="search-item-icon">${icon('file-text',16)}</div>
        <div><div class="search-item-name">${i.invoice_no}</div><div class="search-item-sub">${i.customer_name} • ${fmtMoney(i.grand_total)}</div></div>
      </div>`).join('');
  }
  const custs = db.customers.filter(c => c.name.toLowerCase().includes(ql)||(c.phone||'').includes(ql));
  if (custs.length) {
    html += `<div class="search-section-title">${lang==='ar'?'العملاء':'Customers'}</div>`;
    html += custs.slice(0,3).map(c => `
      <div class="search-item" onclick="closeSearch();goTo('customers')">
        <div class="search-item-icon">${icon('user',16)}</div>
        <div><div class="search-item-name">${c.name}</div><div class="search-item-sub">${c.phone||''}</div></div>
      </div>`).join('');
  }
  const sups = db.suppliers.filter(s => s.name.toLowerCase().includes(ql)||(s.phone||'').includes(ql));
  if (sups.length) {
    html += `<div class="search-section-title">${lang==='ar'?'الموردون':'Suppliers'}</div>`;
    html += sups.slice(0,3).map(s => `
      <div class="search-item" onclick="closeSearch();goTo('customers')">
        <div class="search-item-icon">${icon('truck',16)}</div>
        <div><div class="search-item-name">${s.name}</div><div class="search-item-sub">${s.phone||''}</div></div>
      </div>`).join('');
  }
  const prods = db.products.filter(p => p.name.toLowerCase().includes(ql)||p.code?.toLowerCase().includes(ql));
  if (prods.length) {
    html += `<div class="search-section-title">${lang==='ar'?'المنتجات':'Products'}</div>`;
    html += prods.slice(0,4).map(p => `
      <div class="search-item" onclick="closeSearch();goTo('inventory')">
        <div class="search-item-icon">${icon('box',16)}</div>
        <div><div class="search-item-name">${p.name}</div><div class="search-item-sub">${p.code} • ${fmtMoney(p.sell_price)} • ${lang==='ar'?'مخزون:':'Stock:'} ${p.qty}</div></div>
      </div>`).join('');
  }
  const purs = db.purchases.filter(p => p.vendor.toLowerCase().includes(ql)||p.description.toLowerCase().includes(ql));
  if (purs.length) {
    html += `<div class="search-section-title">${lang==='ar'?'المشتريات':'Purchases'}</div>`;
    html += purs.slice(0,3).map(p => `
      <div class="search-item" onclick="closeSearch();goTo('purchases')">
        <div class="search-item-icon">${icon('package',16)}</div>
        <div><div class="search-item-name">${p.vendor}</div><div class="search-item-sub">${p.description} • ${fmtMoney(p.total)}</div></div>
      </div>`).join('');
  }
  if (!html) html = `<div class="search-empty">🔍 ${lang==='ar'?'لا توجد نتائج':'No results found'}</div>`;

  // زر AI — لكل المستخدمين المسجلين
  const token = localStorage.getItem('yaqiz_access_token');
  if (token && q.trim().length >= 2) {
    window._lastAIQuery = q;
    html += `
    <div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;">
      <div class="search-item" onclick="runAISearchQuery(window._lastAIQuery)" style="background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-radius:8px;">
        <div class="search-item-icon" style="color:#6366f1;">✨</div>
        <div>
          <div class="search-item-name" style="color:#4f46e5;">${lang==='ar'?'اسأل يقظ الذكي:':'Ask Yaqiz AI:'} "${q}"</div>
          <div class="search-item-sub">${lang==='ar'?'اضغط للحصول على إجابة ذكية':'Click for an AI answer'}</div>
        </div>
      </div>
    </div>`;
  }

  dd.innerHTML = html;
  refreshIcons();
}

function closeSearch() {
  const dd = el('search-dropdown');
  if (dd) dd.style.display = 'none';
  const si = el('global-search');
  if (si) si.value = '';
}

function saveQuickReceipt(invoiceId, printAfter=true) {
  const db = getDB();
  const inv = db.invoices.find(i=>i.id===invoiceId);
  if(!inv) return;
  const amount = Number(el('qr-amount').value||0);
  if(!amount){showToast(lang==='ar'?'أدخل المبلغ':'Enter amount','error');return;}

  const num = (db.nextId.receipt||1);
  db.nextId.receipt = num+1;
  const voucher = {
    id: num, type:'receipt',
    voucher_no: `RCV-${String(num).padStart(4,'0')}`,
    party: inv.customer_name,
    amount,
    description: lang==='ar'?`سداد فاتورة ${inv.invoice_no}`:`Payment for invoice ${inv.invoice_no}`,
    method: el('qr-method').value,
    ref: inv.invoice_no,
    linked_invoice_id: invoiceId,
    date: new Date().toISOString().slice(0,10),
    created_at: new Date().toISOString()
  };

  if(!db.receipts) db.receipts=[];
  db.receipts.push(voucher);

  // Update treasury
  db.treasury.balance += amount;
  db.treasury.moves.unshift({id:nextId(db,'treasury'),type:'in',amount,description:`${voucher.voucher_no}: ${voucher.party}`,reference:inv.invoice_no,date:new Date().toISOString()});

  // Update invoice status
  const prevStatus = inv.status;
  inv.paid_amount = (inv.paid_amount||0) + amount;
  if(inv.paid_amount >= inv.grand_total) {
    inv.status = 'مسددة';
    inv.paid_amount = inv.grand_total;
  } else {
    inv.status = 'جزئي';
  }
  inv.last_payment_date = new Date().toISOString();
  inv.last_voucher_no = voucher.voucher_no;

  // Journal entry
  if(!db.journal) db.journal=[];
  db.journal.push({
    id: (db.nextId.journal||1), date: new Date().toISOString(),
    description: `سند قبض ${voucher.voucher_no} — ${voucher.party}`,
    entries:[
      {account:lang==='ar'?'النقدية':'Cash',account_code:'1100',side:'debit',amount},
      {account:lang==='ar'?'الذمم المدينة':'Accounts Receivable',account_code:'1200',side:'credit',amount}
    ],
    ref: voucher.voucher_no
  });
  db.nextId.journal = (db.nextId.journal||1)+1;

  // تحديث رصيد العميل
  const qrCust = db.customers.find(c => c.name === inv.customer_name);
  if(qrCust) qrCust.balance = Math.round((Math.max(0, (qrCust.balance||0) - amount)) * 100) / 100;

  saveDB(db);
  logActivity('سندات',`تحصيل فاتورة ${inv.invoice_no} — ${fmtMoney(amount)} — الحالة: ${inv.status}`);
  showToast(`✅ ${lang==='ar'?`تم التحصيل، الفاتورة أصبحت "${inv.status}"`:`Collected! Invoice is now "${inv.status}"`}`);
  closeModal();
  if(printAfter) printVoucher(voucher.id);
  renderPage();
}

function saveQuickPayPurchase(purchaseId) {
  const db = getDB();
  const p = db.purchases.find(x=>x.id===purchaseId);
  if(!p) return;
  const amount = Math.round(Number(el('qpp-amount').value||0)*100)/100;
  const remaining = Math.max(0, Math.round((p.total-(p.paid_amount||0))*100)/100);
  if(!amount||amount<=0){showToast(lang==='ar'?'أدخل مبلغاً صحيحاً':'Enter valid amount','error');return;}
  if(amount>remaining){showToast(lang==='ar'?'المبلغ أكبر من المتبقي':'Amount exceeds remaining','error');return;}

  // سند صرف
  const num = (db.nextId.receipt||1);
  db.nextId.receipt = num+1;
  const voucher = {
    id: num, type:'payment',
    voucher_no: `PAY-${String(num).padStart(4,'0')}`,
    party: p.vendor,
    amount,
    description: lang==='ar'?`سداد مشتريات ${p.invoice_no||'#'+p.id}`:`Purchase payment ${p.invoice_no||'#'+p.id}`,
    method: el('qpp-method').value,
    ref: p.invoice_no||'',
    date: new Date().toISOString().slice(0,10),
    created_at: new Date().toISOString()
  };
  if(!db.receipts) db.receipts=[];
  db.receipts.push(voucher);

  // تحديث الخزينة
  db.treasury.balance -= amount;
  db.treasury.moves.unshift({id:nextId(db,'treasury'),type:'out',amount,description:`${voucher.voucher_no}: ${p.vendor}`,reference:p.invoice_no||'',date:new Date().toISOString()});

  // تحديث الفاتورة
  p.paid_amount = Math.round(((p.paid_amount||0)+amount)*100)/100;
  if(p.paid_amount >= p.total) {
    p.status = 'مسددة';
    p.paid_amount = p.total;
    p.remaining_amount = 0;
  } else {
    p.status = 'جزئي';
    p.remaining_amount = Math.round((p.total - p.paid_amount)*100)/100;
  }
  p.last_payment_date = new Date().toISOString();

  // تحديث رصيد المورد
  const sup = db.suppliers.find(s=>s.name===p.vendor);
  if(sup) sup.balance = Math.round((Math.max(0,(sup.balance||0)-amount))*100)/100;

  // قيد محاسبي
  if(!db.journal) db.journal=[];
  db.journal.push({
    id:(db.nextId.journal||1), date:new Date().toISOString(),
    description:`سند صرف ${voucher.voucher_no} — ${p.vendor}`,
    entries:[
      {account:lang==='ar'?'الذمم الدائنة':'Accounts Payable',account_code:'2100',side:'debit',amount},
      {account:lang==='ar'?'النقدية':'Cash',account_code:'1100',side:'credit',amount}
    ],
    ref:voucher.voucher_no
  });
  db.nextId.journal=(db.nextId.journal||1)+1;

  saveDB(db);
  logActivity('مشتريات',`سداد ${p.vendor} — ${fmtMoney(amount)} — الحالة: ${p.status}`);
  showToast(`✅ ${lang==='ar'?`تم السداد، الفاتورة: "${p.status}"`:`Paid! Invoice: "${p.status}"`}`);
  closeModal();
  renderPage();
}

// ============ IMPORT PRODUCTS CSV ============
function importProductsCSV(input) {
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split('\n').filter(l=>l.trim());
    const db=getDB(); let added=0; let skipped=0;
    lines.slice(1).forEach(line=>{
      const sample2 = lines[0]||'';
      const sep2 = sample2.includes('\t') ? '\t' : sample2.includes(';') ? ';' : ',';
      const cols=line.split(sep2).map(c=>c.trim().replace(/^"|"$/g,''));
      if(cols.length<6)return;
      const [code,name,category,buy_price,sell_price,qty]=cols;
      if(!name){skipped++;return;}
      const ex=db.products.find(p=>p.code===code||p.name===name);
      if(ex){ ex.buy_price=Number(buy_price)||ex.buy_price; ex.sell_price=Number(sell_price)||ex.sell_price; ex.qty=Number(qty)||ex.qty; }
      else { db.products.push({id:nextId(db,'product'),code:code||`P${db.nextId.product}`,name,category:category||'عام',unit:'قطعة',buy_price:Number(buy_price)||0,sell_price:Number(sell_price)||0,qty:Number(qty)||0,min_qty:5}); added++; }
    });
    saveDB(db);
    showToast(`✅ ${lang==='ar'?`تم: ${added} منتج جديد، ${lines.length-1-added-skipped} محدّث`:`Done: ${added} new, ${lines.length-1-added-skipped} updated`}`);
    renderPage();
  };
  reader.readAsText(file);
}

// Sanitize user input to prevent XSS
function sanitize(str) {
  if(!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#x27;')
    .replace(/\//g,'&#x2F;');
}

// Login attempt rate limiting
let loginAttempts = JSON.parse(sessionStorage.getItem('login_attempts')||'{"count":0,"lockUntil":0}');
function checkLoginRateLimit() {
  const now = Date.now();
  if(loginAttempts.lockUntil > now) {
    const secs = Math.ceil((loginAttempts.lockUntil-now)/1000);
    return `${lang==='ar'?`محاولات كثيرة. انتظر ${secs} ثانية`:`Too many attempts. Wait ${secs} seconds`}`;
  }
  return null;
}
function recordLoginAttempt(success) {
  if(success) {
    loginAttempts = {count:0, lockUntil:0};
  } else {
    loginAttempts.count++;
    if(loginAttempts.count >= 5) {
      loginAttempts.lockUntil = Date.now() + 60000; // 1 min lock
      loginAttempts.count = 0;
    }
  }
  sessionStorage.setItem('login_attempts', JSON.stringify(loginAttempts));
}

  if (!db.nextId.employee) { db.nextId.employee = 4; changed = true; }
  if (!db.nextId.obligation) { db.nextId.obligation = 5; changed = true; }
  if (!db.receipts) { db.receipts = []; changed = true; }
  if (!db.returns) { db.returns = []; changed = true; }
  if (!db.nextId.receipt) { db.nextId.receipt = 1; changed = true; }
  if (!db.nextId.return_) { db.nextId.return_ = 1; changed = true; }
  if (!db.shifts) { db.shifts = []; changed = true; }
  if (!db.purchase_orders) { db.purchase_orders = []; changed = true; }
  if (!db.sales_targets) { db.sales_targets = []; changed = true; }
  if (!db.loyalty_points) { db.loyalty_points = {}; changed = true; }
  if (!db.loyalty_settings) { db.loyalty_settings = {enabled:false,points_per_sar:1,sar_per_point:0.1}; changed = true; }
  if (!db.nextId.journal) { db.nextId.journal = db.nextId.journal||1; changed = true; }
  if (!db.nextId.po) { db.nextId.po = 1; changed = true; }
  if (!db.nextId.shift) { db.nextId.shift = 1; changed = true; }
  if (!db.quotes) { db.quotes = []; changed = true; }
  if (!db.stock_moves) { db.stock_moves = []; changed = true; }
  if (!db.nextId.quote) { db.nextId.quote = 1; changed = true; }
  if (!db.nextId.stock_move) { db.nextId.stock_move = 1; changed = true; }
  // migrate purchases purchase_type
  db.purchases.forEach(p => { if(!p.purchase_type) { p.purchase_type = p.category==='بضاعة'?'goods':'opex'; changed = true; }});
  // fix old platform name from previous versions
  if (db.settings && ['شركة قيمة','مؤسسة قيمة','قيمة','شركة أوج'].includes(db.settings.company_name)) {
    db.settings.company_name = 'شركة يقظ'; changed = true;
  }
  if (!db.journal) { db.journal = []; changed = true; }
  if (!db.nextId.journal) { db.nextId.journal = 1; changed = true; }
  // ensure all invoices have paid_amount
  db.invoices.forEach(inv => {
    if(inv.paid_amount===undefined) {
      inv.paid_amount = inv.status==='مسددة' ? inv.grand_total : 0;
      changed = true;
    }
  });
  if (changed) saveDB(db);
}

// ============ OPENING BALANCES WIZARD ============
let _obStep = 1;
const _OB_STEPS = 9;
let _obData = { cash_box:0, cash_bank:0, products:[], customers:[], suppliers:[], fixed_assets:[], obligations:[], employees:[], capital:0 };

function checkOpeningBalances() {
  if (!currentUser || currentUser.role !== 'owner') return;
  const db = getDB();
  if (!db.settings?.opening_balances_done) {
    setTimeout(() => showOpeningBalancesWizard(false), 700);
  }
}

function showOpeningBalancesWizard(editMode) {
  _obStep = 1;
  const db = getDB();
  if (editMode && db.settings?.opening_balances_data) {
    _obData = JSON.parse(JSON.stringify(db.settings.opening_balances_data));
  } else {
    _obData = { cash_box:0, cash_bank:0, products:[], customers:[], suppliers:[], fixed_assets:[], obligations:[], employees:[], capital:0 };
  }
  renderOBWizard();
}

function obReadStep() {
  if (_obStep===1) {
    _obData.cash_box  = parseFloat(el('ob-cash-box')?.value||0)||0;
    _obData.cash_bank = parseFloat(el('ob-cash-bank')?.value||0)||0;
  } else if (_obStep===8) {
    _obData.capital = parseFloat(el('ob-capital')?.value||0)||0;
  }
}

function obNextStep() { obReadStep(); if (_obStep < _OB_STEPS) { _obStep++; renderOBWizard(); } }
function obSkipStep()  { if (_obStep < _OB_STEPS) { _obStep++; renderOBWizard(); } }
function obPrevStep()  { obReadStep(); if (_obStep > 1) { _obStep--; renderOBWizard(); } }

function obSkipWizard() {
  if (!confirm('هل تريد تخطّي الأرصدة الافتتاحية الآن؟ يمكنك إضافتها لاحقاً من الإعدادات.')) return;
  const db = getDB();
  if (!db.settings) db.settings = {};
  db.settings.opening_balances_done = true;
  saveDB(db);
  closeModal();
  renderPage();
}

function obAddProduct() {
  const name = (el('ob-p-name')?.value||'').trim();
  const qty  = parseFloat(el('ob-p-qty')?.value||0)||0;
  const buy  = parseFloat(el('ob-p-buy')?.value||0)||0;

  if (!name || qty<=0) { showToast('أدخل اسم الصنف والكمية','error'); return; }
  _obData.products.push({ name, qty, buy_price:buy, sell_price:sell });
  el('ob-p-name').value=''; el('ob-p-qty').value='1'; el('ob-p-buy').value=''; el('ob-p-sell').value='';
  el('ob-step-content').innerHTML = renderOBStepContent(); el('ob-p-name')?.focus(); refreshIcons();
}

function obSaveAll() {
  obReadStep();
  const db = getDB();
  const totalCash    = (_obData.cash_box||0)+(_obData.cash_bank||0);
  const inventoryVal = _obData.products.reduce((s,p)=>s+(p.qty*p.buy_price),0);
  const receivables  = _obData.customers.reduce((s,c)=>s+c.balance,0);
  const fixedAssets  = _obData.fixed_assets.reduce((s,a)=>s+a.value,0);
  const payables     = _obData.suppliers.reduce((s,x)=>s+x.balance,0);
  const obligV       = _obData.obligations.reduce((s,o)=>s+o.amount,0);
  const capital      = _obData.capital || Math.max(0,(totalCash+inventoryVal+receivables+fixedAssets)-(payables+obligV));

  // الخزينة
  if (!db.treasury) db.treasury = { balance:0, moves:[] };
  if (!Array.isArray(db.treasury.moves)) db.treasury.moves = [];
  if (totalCash > 0) {
    db.treasury.balance = Math.round((db.treasury.balance + totalCash) * 100) / 100;
    db.treasury.moves.unshift({ id:nextId(db,'treasury'), type:'in', amount:totalCash,
      description:'رصيد افتتاحي — نقدية وبنك', reference:'OPENING', date:new Date().toISOString() });
  }

  // المنتجات
  if (!db.products) db.products = [];
  if (!db.nextId.product) db.nextId.product = 1;
  _obData.products.forEach(p => {
    const pid = nextId(db,'product');
    db.products.push({ id:pid, code:'OB-'+pid, name:p.name, category:'بضاعة',
      buy_price:p.buy_price, sell_price:p.sell_price, qty:p.qty, min_qty:0, created_at:new Date().toISOString() });
  });

  // العملاء
  if (!db.customers) db.customers = [];
  if (!db.nextId.customer) db.nextId.customer = 1;
  _obData.customers.forEach(c => {
    const ex = db.customers.find(x=>x.name===c.name);
    if (ex) { ex.balance = Math.round(((ex.balance||0)+c.balance)*100)/100; }
    else { db.customers.push({ id:nextId(db,'customer'), name:c.name, phone:'', email:'', address:'', balance:c.balance, created_at:new Date().toISOString() }); }
  });

  // الموردون
  if (!db.suppliers) db.suppliers = [];
  if (!db.nextId.supplier) db.nextId.supplier = 1;
  _obData.suppliers.forEach(s => {
    const ex = db.suppliers.find(x=>x.name===s.name);
    if (ex) { ex.balance = Math.round(((ex.balance||0)+s.balance)*100)/100; }
    else { db.suppliers.push({ id:nextId(db,'supplier'), name:s.name, phone:'', email:'', address:'', balance:s.balance, created_at:new Date().toISOString() }); }
  });

  // الموظفون
  if (!db.employees) db.employees = [];
  if (!db.nextId.employee) db.nextId.employee = 1;
  _obData.employees.forEach(e => {
    db.employees.push({ id:nextId(db,'employee'), name:e.name, job_title:e.job_title, salary:e.salary,
      hire_date:new Date().toISOString().slice(0,10), active:true, created_at:new Date().toISOString() });
  });

  // الالتزامات
  if (!db.obligations) db.obligations = [];
  if (!db.nextId.obligation) db.nextId.obligation = 1;
  _obData.obligations.forEach(o => {
    db.obligations.push({ id:nextId(db,'obligation'), name:o.name, amount:o.amount, frequency:o.frequency,
      next_due:new Date().toISOString().slice(0,10), created_at:new Date().toISOString() });
  });

  // القيود المحاسبية الافتتاحية
  if (!db.journal) db.journal = [];
  if (!db.nextId.journal) db.nextId.journal = 1;
  const jEntries = [];
  if (totalCash>0)    jEntries.push({ account:'النقدية والبنك',      account_code:'1100', side:'debit',  amount:totalCash    });
  if (receivables>0)  jEntries.push({ account:'الذمم المدينة',       account_code:'1200', side:'debit',  amount:receivables  });
  if (inventoryVal>0) jEntries.push({ account:'المخزون',             account_code:'1300', side:'debit',  amount:inventoryVal });
  if (fixedAssets>0)  jEntries.push({ account:'الأصول الثابتة',      account_code:'1500', side:'debit',  amount:fixedAssets  });
  if (payables>0)     jEntries.push({ account:'الذمم الدائنة',       account_code:'2100', side:'credit', amount:payables     });
  if (obligV>0)       jEntries.push({ account:'الالتزامات الدورية',  account_code:'2300', side:'credit', amount:obligV       });
  if (capital>0)      jEntries.push({ account:'رأس المال الافتتاحي', account_code:'3000', side:'credit', amount:capital      });
  if (jEntries.length > 0) {
    db.journal.push({ id:nextId(db,'journal'), date:new Date().toISOString(),
      description:'قيود افتتاحية — أرصدة بداية النشاط', entries:jEntries, ref:'OPENING' });
  }

  // تأشير الانتهاء
  if (!db.settings) db.settings = {};
  db.settings.opening_balances_done = true;
  db.settings.opening_balances_data = JSON.parse(JSON.stringify(_obData));
  db.settings.opening_balances_date = new Date().toISOString();
  saveDB(db);
  closeModal();
  showToast('✅ تم حفظ الأرصدة الافتتاحية — النظام جاهز!');
  renderPage();
}

function init() {
  initDark();
  migrateDB();
  setupAutoBackup();
  // restore user session — في وضع السحابة نتحقق من token صالح وغير منتهي
  const isCloud = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';
  let hasValidToken = false;
  if (isCloud) {
    try {
      const tok = localStorage.getItem('yaqiz_access_token');
      if (tok) {
        const payload = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
        hasValidToken = payload.exp * 1000 > Date.now();
      }
    } catch(e) {}
  }
  if (!isCloud || hasValidToken) {
    try { const u=JSON.parse(localStorage.getItem('yaqiz_user')); if(u){ const db=getDB(); const fresh=db.users.find(x=>x.id===u.id&&x.active!==false); if(fresh)currentUser=fresh; } } catch(e){}
  } else {
    localStorage.removeItem('yaqiz_user');
    localStorage.removeItem('yaqiz_access_token');
    localStorage.removeItem('yaqiz_refresh_token');
  }
  renderApp();
}
init();

// ============ AI FEATURES ============

async function _aiApiFetch(endpoint, body) {
  const token = localStorage.getItem('yaqiz_access_token');
  if (!token) throw new Error(lang==='ar'?'يجب تسجيل الدخول أولاً عبر الخادم لاستخدام الذكاء الاصطناعي':'Login via server to use AI features');
  const base = (window._YAQIZ_API || '').replace(/\/$/, '');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 40000); // 40 seconds timeout
  try {
    const res = await fetch(`${base}/api/ai/${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    clearTimeout(timer);
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.message || 'خطأ في الذكاء الاصطناعي');
    return data;
  } catch (err) {
    clearTimeout(timer);

    throw err;
  }
}

// Resize image on canvas before encoding (keeps payload small)
function _resizeImage(file, maxPx = 1200) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result.split(',')[1]); // base64 only
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      }, 'image/jpeg', 0.85);
    };
    img.onerror = reject;
    img.src = url;
  });
}

      const b64 = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];

      const b64 = await _resizeImage(file);

function openPurchaseFormWithAIData(data, usage) {
  if (!data || typeof data !== 'object') {
    showToast(lang==='ar'?'⚠️ لم يتمكن من قراءة الفاتورة':'Could not read the invoice');
    return;
  }

  // بناء الأصناف قبل فتح النموذج حتى لا يمسحها showAddGoodsPurchase
  _goodsItems = [];
  const rawItems = Array.isArray(data.items) ? data.items : [];
  if (rawItems.length > 0) {
    rawItems.forEach(it => {
      const qty   = parseFloat(it.qty)        || 1;
      const price = parseFloat(it.unit_price) || parseFloat(it.total) / (parseFloat(it.qty) || 1) || 0;
      const total = parseFloat(it.total)      || qty * price;
      _goodsItems.push({ name: it.description || 'بند', qty, price, line_total: total, product_id: null });
    });
  } else {
    const grand = parseFloat(data.grand_total) || 0;
    const vat   = parseFloat(data.vat_amount)  || grand * 15 / 115;
    const sub   = grand - vat;
    _goodsItems.push({ name: data.vendor || 'بضاعة', qty: 1, price: sub, line_total: sub, product_id: null });
  }

  // افتح النموذج مع الحفاظ على الأصناف (keepItems=true يمنع المسح)
  showAddGoodsPurchase(true);

  // ملء حقول الرأس بعد فتح النموذج
  if (el('gp-vendor')) el('gp-vendor').value = data.vendor || '';
  if (el('gp-date'))   el('gp-date').value   = (data.date && /^\d{4}-\d{2}-\d{2}$/.test(data.date)) ? data.date : new Date().toISOString().slice(0,10);
  if (el('gp-ref'))    el('gp-ref').value     = data.invoice_no || '';

  renderGPItems();
  updateGPTotals();
}
