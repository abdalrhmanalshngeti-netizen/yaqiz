<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يقظ - نظام محاسبي ذكي</title>
<link rel="icon" type="image/svg+xml" id="favicon-link">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/public/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/public/pdf.min.js"></script>
<style>
:root {
  --primary: #1e40af;
  --primary-light: #3b82f6;
  --primary-soft: #dbeafe;
  --primary-dark: #1e3a8a;
  --accent: #0ea5e9;
  --bg: #f8fafc;
  --card-bg: #ffffff;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --success: #16a34a;
  --warning: #f59e0b;
  --danger: #dc2626;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
  --shadow: 0 4px 14px -2px rgb(15 23 42 / 0.08);
  --shadow-lg: 0 12px 32px -4px rgb(30 64 175 / 0.15);
  --radius: 12px;
  --radius-sm: 8px;
}
html.dark {
  --primary: #3b82f6;
  --primary-light: #60a5fa;
  --primary-soft: #1e3a5f;
  --primary-dark: #93c5fd;
  --accent: #38bdf8;
  --bg: #0f172a;
  --card-bg: #1e293b;
  --border: #334155;
  --border-strong: #475569;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --success: #22c55e;
  --warning: #fbbf24;
  --danger: #f87171;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
  --shadow: 0 4px 14px -2px rgb(0 0 0 / 0.4);
  --shadow-lg: 0 12px 32px -4px rgb(0 0 0 / 0.5);
}
html.dark body { background: var(--bg); color: var(--text-main); }
html.dark .sidebar { background: linear-gradient(180deg,#1e293b 0%,#0f172a 100%); }
html.dark .topbar { background: #1e293b; }
html.dark .input, html.dark .select, html.dark textarea.input { background: #0f172a; color: var(--text-main); border-color: var(--border); }
html.dark .modal { background: #1e293b; }
html.dark .card { background: var(--card-bg); }
html.dark .tbl th { background: #0f172a; }
html.dark .product-card { background: #1e293b; border-color: var(--border); }
html.dark .invoice-panel-pos { background: #1e293b; }
html.dark .login-card { background: #1e293b; }
html.dark .user-pill { background: #0f172a; }
html.dark .tabs { background: #0f172a; }
html.dark .tab-btn.active { background: #1e293b; }
html.dark .qty-btn { background: #0f172a; border-color: var(--border); color: var(--text-main); }
html.dark .search-dropdown { background: #1e293b; }
html.dark .search-item:hover { background: var(--primary-soft); }
html.dark .stat-icon.green { background: #14532d; color: #4ade80; }
html.dark .stat-icon.amber { background: #451a03; color: #fbbf24; }
html.dark .stat-icon.red   { background: #450a0a; color: #f87171; }
html.dark .tbl td { color: var(--text-main); }
html.dark .tbl tr:nth-child(even) { background: #0f172a; }
html.dark .tbl tr:hover { background: #1e3a5f; }
html.dark .badge { background: var(--primary-soft); color: var(--primary-dark); }
html.dark .topbar { border-bottom: 1px solid var(--border); }
html.dark .modal-head { border-bottom: 1px solid var(--border); }
html.dark .form-label { color: var(--text-muted); }
html.dark code { background: #0f172a; color: var(--accent); border-color: var(--border); }
html.dark .page-header { border-bottom-color: var(--border); }
/* إصلاح الألوان الثابتة في الوضع الداكن */
html.dark [style*="background:#f8fafc"],
html.dark [style*="background: #f8fafc"]  { background: #1e293b !important; }
html.dark [style*="background:#ffffff"],
html.dark [style*="background: #ffffff"],
html.dark [style*="background:white"],
html.dark [style*="background: white"]    { background: var(--card-bg) !important; color: var(--text-main) !important; }
html.dark [style*="background:#eff6ff"],
html.dark [style*="background: #eff6ff"]  { background: #1e3a5f !important; }
html.dark [style*="background:#dbeafe"],
html.dark [style*="background: #dbeafe"]  { background: #1e3a5f !important; }
html.dark [style*="background:#f0fdf4"],
html.dark [style*="background: #f0fdf4"]  { background: #14532d !important; }
html.dark [style*="background:#dcfce7"],
html.dark [style*="background: #dcfce7"]  { background: #14532d !important; }
html.dark [style*="background:#fef3c7"],
html.dark [style*="background: #fef3c7"]  { background: #451a03 !important; }
html.dark [style*="background:#fff7ed"],
html.dark [style*="background: #fff7ed"]  { background: #431407 !important; }
html.dark [style*="background:#fef2f2"],
html.dark [style*="background: #fef2f2"],
html.dark [style*="background:#fee2e2"],
html.dark [style*="background: #fee2e2"]  { background: #450a0a !important; }
html.dark [style*="background:#f1f5f9"],
html.dark [style*="background: #f1f5f9"]  { background: #0f172a !important; }
html.dark [style*="color:#1e293b"],
html.dark [style*="color: #1e293b"],
html.dark [style*="color:#0f172a"],
html.dark [style*="color: #0f172a"]        { color: var(--text-main) !important; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html[dir="rtl"] body { font-family: 'Tajawal', sans-serif; font-weight: 700; }
html[dir="ltr"] body { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }
body { background: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; font-weight: 700; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

/* Layout */
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; background: linear-gradient(180deg,#fff 0%,#f8fafc 100%);
  border-left: 1px solid var(--border); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: width 0.2s ease; flex-shrink: 0;
}
html[dir="ltr"] .sidebar { border-left: none; border-right: 1px solid var(--border); }
.sidebar.collapsed { width: 72px; }
.sidebar-brand { padding: 20px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 38px; height: 38px; min-width: 38px;
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 6px 16px -4px rgba(13,25,41,0.6);
  flex-shrink: 0;
}
.brand-text { font-weight: 900; font-size: 18px; color: #0d0f14; }
html.dark .brand-text { color: #f1f5f9; }
.brand-sub { font-size: 11px; color: var(--text-muted); margin-top: -2px; }
.nav-menu { padding: 12px 8px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; margin-bottom: 2px; border-radius: var(--radius-sm);
  cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 13.5px;
  transition: all 0.15s; border: 1px solid transparent; user-select: none;
}
.nav-item:hover { background: var(--primary-soft); color: var(--primary); }
.nav-item.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; box-shadow: 0 6px 16px -4px rgba(30,64,175,0.35);
}
.nav-child {
  padding-inline-start: 36px !important;
  font-size: 13px !important;
  margin-bottom: 1px !important;
  opacity: 0.9;
}
.nav-child.active {
  background: var(--primary-soft) !important;
  color: var(--primary) !important;
  box-shadow: none !important;
  font-weight: 800 !important;
}
.nav-item svg { flex-shrink: 0; }
.sidebar.collapsed .nav-label, .sidebar.collapsed .brand-text, .sidebar.collapsed .brand-sub { display: none; }
.sidebar.collapsed .nav-item { justify-content: center; }
.sidebar.collapsed .nav-child { display: none; }

.topbar {
  height: 64px; background: white; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 16px;
  position: sticky; top: 0; z-index: 50;
}
.topbar-title { font-size: 18px; font-weight: 800; color: var(--text-main); flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-muted); transition: all 0.15s; flex-shrink: 0;
}
.icon-btn:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary-light); }
.user-pill {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 999px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
  color: white; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; flex-shrink: 0;
}
.user-name-sm { font-weight: 700; font-size: 13px; }
.user-role-sm { font-size: 11px; color: var(--text-muted); }
.content { padding: 28px; flex: 1; overflow-y: auto; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; height: 100vh; }

/* Cards */
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.card-pad { padding: 20px; }
.card-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-head h3 { font-size: 14px; font-weight: 800; color: var(--text-main); }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  position: relative; overflow: hidden; transition: all 0.2s;
}
.stat-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); border-color: var(--primary-light); }
.stat-card::before {
  content: ''; position: absolute; top: 0; right: 0; left: 0; height: 3px;
  background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
}
.stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); margin-bottom: 12px; }
.stat-icon.green { background: #dcfce7; color: var(--success); }
.stat-icon.amber { background: #fef3c7; color: #d97706; }
.stat-icon.red { background: #fee2e2; color: var(--danger); }
.stat-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 900; color: var(--text-main); }

/* Forms */
.input, .select, textarea.input {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-family: inherit; font-size: 13.5px;
  background: var(--card-bg); color: var(--text-main); outline: none; transition: all 0.15s;
}
.input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
.form-label { font-size: 12px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 18px; border-radius: var(--radius-sm);
  font-family: inherit; font-weight: 700; font-size: 13.5px;
  border: 1px solid transparent; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; box-shadow: 0 6px 16px -4px rgba(30,64,175,0.35); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -4px rgba(30,64,175,0.5); }
.btn-outline { background: var(--card-bg); border-color: var(--border); color: var(--text-main); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.btn-danger { background: var(--danger); color: white; border: none; }
.btn-sm { padding: 7px 13px; font-size: 12px; }
.btn-full { width: 100%; justify-content: center; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Table */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { background: var(--bg); color: var(--text-muted); text-align: start; padding: 12px 14px; font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13.5px; }
.tbl tr:hover td { background: var(--bg); }
.tbl tbody tr:last-child td { border-bottom: 0; }

/* Badges */
.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge-blue { background: var(--primary-soft); color: var(--primary-dark); }
.badge-green { background: #dcfce7; color: #15803d; }
.badge-amber { background: #fef3c7; color: #b45309; }
.badge-red { background: #fee2e2; color: #b91c1c; }
.badge-gray { background: #f1f5f9; color: var(--text-muted); }

/* Login */
.login-bg {
  min-height: 100vh; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #0ea5e9 100%);
  display: flex; align-items: center; justify-content: center; padding: 20px;
  position: relative; overflow: hidden;
}
.login-bg::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.15) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
}
.login-card {
  background: white; border-radius: 20px; padding: 40px;
  box-shadow: 0 30px 80px -12px rgba(0,0,0,0.3);
  width: 100%; max-width: 440px; position: relative; z-index: 1;
}
.login-logo {
  width: 72px; height: 72px;
  border-radius: 18px; overflow: hidden;
  margin: 0 auto 16px;
  box-shadow: 0 12px 32px -6px rgba(13,25,41,0.7);
}
.login-title { font-size: 26px; font-weight: 900; text-align: center; color: var(--text-main); }
.login-sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 28px; margin-top: 4px; }


/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.modal { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
.modal-lg { max-width: 800px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-head h3 { font-size: 18px; font-weight: 800; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); width: fit-content; }
.tab-btn { padding: 9px 18px; border: none; background: transparent; cursor: pointer; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--text-muted); transition: all 0.15s; }
.tab-btn.active { background: white; color: var(--primary); box-shadow: var(--shadow-sm); }

/* Toast */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: white; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow-lg); z-index: 200; animation: slideUp 0.3s; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
@keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* Empty */
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

/* Spinner */
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--primary-soft); border-top-color: var(--primary); animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.page-title-lg { font-size: 24px; font-weight: 900; color: var(--text-main); }
.page-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

/* POS */
.pos-grid { display: grid; grid-template-columns: 1fr 380px; gap: 16px; height: calc(100vh - 160px); }
.pos-products-wrap { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; overflow-y: auto; padding: 4px; }
.product-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.15s; text-align: center; }
.product-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
.product-card.low { border-color: #fbbf24; }
.product-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.product-price { color: var(--primary); font-weight: 800; font-size: 14px; }
.product-qty { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.invoice-panel-pos { background: white; border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.invoice-items { flex: 1; overflow-y: auto; padding: 12px; }
.inv-item-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--border); align-items: center; }
.qty-ctrl { display: flex; align-items: center; gap: 4px; }
.qty-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: white; cursor: pointer; font-weight: 700; font-size: 16px; line-height: 1; }
.qty-val { width: 32px; text-align: center; font-weight: 700; }

/* Perms */
.perm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.perm-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; transition: all 0.15s; }
.perm-item.checked { background: var(--primary-soft); border-color: var(--primary-light); color: var(--primary-dark); }
.perm-item input { accent-color: var(--primary); }

/* Chart bars */
.chart-wrap { display: flex; align-items: flex-end; gap: 12px; height: 180px; padding: 0 8px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chart-bars { width: 100%; display: flex; gap: 3px; align-items: flex-end; height: 150px; }
.chart-bar-s { flex: 1; background: linear-gradient(180deg, var(--primary-light), var(--primary)); border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.5s ease; }
.chart-bar-p { flex: 1; background: linear-gradient(180deg, #fbbf24, #f59e0b); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart-label { font-size: 10px; color: var(--text-muted); }

/* Search */
.search-wrap { position: relative; flex: 1; max-width: 480px; }
.search-input { width: 100%; padding: 9px 14px 9px 36px; border: 1px solid var(--border); border-radius: 999px; font-family: inherit; font-size: 13px; background: var(--bg); outline: none; transition: all 0.15s; }
html[dir="rtl"] .search-input { padding: 9px 36px 9px 14px; }
.search-input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }

.search-icon { position: absolute; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
html[dir="rtl"] .search-icon { right: 12px; }
html[dir="ltr"] .search-icon { left: 12px; }

.search-dropdown { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 200; max-height: 500px; overflow-y: auto; padding: 8px; }
.search-section-title { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 10px 4px; }
.search-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background 0.1s; }
.search-item:hover { background: var(--primary-soft); }
.search-item-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.search-item-name { font-weight: 700; font-size: 13px; }
.search-item-sub { font-size: 11px; color: var(--text-muted); }
.search-empty { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }

.stat-card { cursor: pointer; }

@media (max-width: 1024px) { .pos-grid { grid-template-columns: 1fr; height: auto; } }

/* ═══════════════════════════════════════
   Sidebar mobile overlay
   ═══════════════════════════════════════ */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 199;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}

/* ═══════════════════════════════════════
   Tablet — 768px
   ═══════════════════════════════════════ */
@media (max-width: 768px) {
  /* Sidebar: fixed slide-in overlay */
  .sidebar {
    position: fixed !important;
    top: 0; bottom: 0;
    right: 0;           /* RTL: slides from right */
    width: 270px !important;
    z-index: 200;
    transform: translateX(105%);
    transition: transform 0.26s cubic-bezier(.4,0,.2,1);
    box-shadow: -8px 0 40px rgba(0,0,0,0.18);
    height: 100dvh;
    overflow-y: auto;
  }
  html[dir="ltr"] .sidebar {
    right: auto;
    left: 0;
    transform: translateX(-105%);
  }
  .sidebar.mobile-open {
    transform: translateX(0) !important;
  }
  .sidebar-overlay.active { display: block; }

  /* Main takes full width */
  .main { width: 100%; min-width: 0; }
  .app-shell { display: block; }

  /* Content */
  .content { padding: 12px; }

  /* Stats: 2 columns → 1 column on phones */
  .stats-grid { grid-template-columns: 1fr 1fr; }

  /* Forms */
  .form-row { grid-template-columns: 1fr; }

  /* Tables: horizontal scroll */
  table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
  table tbody tr td { white-space: normal; min-width: 80px; }

  /* Topbar: hide non-essential */
  .topbar { padding: 0 12px; gap: 8px; }
  .topbar-hide-mobile { display: none !important; }
  .user-name-sm, .user-role-sm { display: none; }
  .user-pill { padding: 4px 6px; gap: 4px; }
  .search-wrap { max-width: 120px; }
  .search-input { font-size: 12px; }

  /* Cards */
  .card-pad { padding: 14px; }

  /* User corner badge */
  .user-corner { display: none; }
}

/* ═══════════════════════════════════════
   Phone — 480px
   ═══════════════════════════════════════ */
@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr !important; }
  .search-wrap { display: none; }
  .content { padding: 10px; }
  .topbar { height: 56px; }
}

    const tok = localStorage.getItem('yaqiz_access_token');
    if (tok) {
      const p = JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (p.company_id) return DB_KEY + '_' + p.company_id;
    }
  } catch(e) {}
  return DB_KEY; // وضع محلي بدون JWT
}
function getDB() {
  try {

function saveDB(db) {

function fmtMoney(n) {

function fmtDate(s) {
  try { return new Date(s).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); } catch { return s; }
}
function fmtHijri(s) {
  try { return new Date(s).toLocaleDateString('ar-SA-u-ca-islamic',{year:'numeric',month:'long',day:'numeric'}); } catch { return ''; }
}
function fmtDateBoth(s) {
  try {
    const d = new Date(s);
    const greg = d.toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'});
    const hijri = d.toLocaleDateString('ar-SA-u-ca-islamic',{year:'numeric',month:'long',day:'numeric'});
    return `${greg} | ${hijri}`;
  } catch { return s; }
}
function has(perm) {
  if (!currentUser) return false;
  if (perm === 'pos.access') {
    if (currentUser.role === 'owner') return false; // المالك يستخدم صفحة المبيعات العادية
    return currentUser.pos_access === true;
  }
  if (currentUser.role === 'owner') return true;
  return (currentUser.permissions||[]).includes(perm);
}

async function sendSupportModal() {
  const phone   = (el('sup-phone')?.value||'').trim();
  const username= (el('sup-user')?.value||'').trim();
  const company = (el('sup-company')?.value||'').trim();
  const message = (el('sup-msg')?.value||'').trim();
  const errEl   = el('sup-err');
  const okEl    = el('sup-ok');
  const btn     = el('sup-btn');

  const showErr = msg => { if(errEl){errEl.style.display='block';errEl.textContent=msg;} };
  errEl.style.display='none'; okEl.style.display='none';

  if (!phone)   { showErr(lang==='ar'?'⚠️ رقم الجوال مطلوب':'Phone required'); el('sup-phone')?.focus(); return; }
  if (!username){ showErr(lang==='ar'?'⚠️ اسم المستخدم مطلوب':'Username required'); el('sup-user')?.focus(); return; }
  if (!company) { showErr(lang==='ar'?'⚠️ اسم المؤسسة مطلوب':'Company name required'); el('sup-company')?.focus(); return; }
  if (!message) { showErr(lang==='ar'?'⚠️ وصف المشكلة مطلوب':'Problem description required'); el('sup-msg')?.focus(); return; }

  if(btn){btn.disabled=true; btn.innerHTML=`⏳ ${lang==='ar'?'جاري الإرسال...':'Sending...'}`;}
  try {
    const base=(window._YAQIZ_API||window.location.origin);
    const res=await fetch(`${base}/api/support/public`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone, username, company_name:company, message})
    });
    const data=await res.json();
    if(data.success){
      if(okEl){okEl.style.display='block'; okEl.innerHTML=`✅ ${lang==='ar'?'تم إرسال طلبك بنجاح! سنتواصل معك على رقم '+phone+' في أقرب وقت':'Request sent! We will contact you soon.'}<br><span style="font-size:11px;opacity:0.8">${lang==='ar'?'رقم التذكرة: #':'Ticket #'}${data.id}</span>`;}
      if(el('sup-phone'))el('sup-phone').value='';
      if(el('sup-msg'))el('sup-msg').value='';
      if(btn){btn.style.display='none';}
    } else {
      showErr(data.message||'حدث خطأ');
    }
  } catch(e) {
    showErr(lang==='ar'?'تعذر الاتصال بالخادم. تحقق من اتصالك بالإنترنت.':'Could not reach server. Check your connection.');
  } finally {
    if(btn&&btn.style.display!=='none'){btn.disabled=false; btn.innerHTML=`${icon('send',16)} ${lang==='ar'?'إرسال طلب الدعم':'Send Support Request'}`;}
    refreshIcons();
  }
}

function doLogin() {
  // Rate limit check
  const lockMsg = checkLoginRateLimit();
  if(lockMsg) { const err=el('l-err'); err.style.display='block'; err.textContent=lockMsg; return; }

  const db = getDB();
  const username = el('l-user').value.trim();
  const password = el('l-pass').value;
  const u = db.users.find(x => x.username===username && x.password===password && x.active!==false);
  if (!u) {
    recordLoginAttempt(false);
    const err=el('l-err'); err.style.display='block';
    if (!window._apiReachable) {
      err.innerHTML = (lang==='ar'?'⚠️ السيرفر لا يستجيب حالياً. انتظر قليلاً ثم اضغط ':'⚠️ Server not responding. Wait a moment then click ')
        + `<a href="#" onclick="event.preventDefault();window._retryConnection?.()" style="color:#3b82f6;font-weight:800;">${lang==='ar'?'إعادة الاتصال':'Reconnect'}</a>`;
    } else {
      err.textContent=lang==='ar'?'اسم المستخدم أو كلمة المرور غير صحيحة':'Invalid credentials';
    }
    return;
  }
  recordLoginAttempt(true);
  currentUser = u;
  localStorage.setItem('yaqiz_user', JSON.stringify(u));
  resetSessionTimer();
  if (u.shift_enabled) startShift(u);
  logActivity('نظام', `تسجيل دخول: ${u.full_name}`);
  renderApp();
}

function doLogout() {
  if (currentUser?.shift_enabled) {
    showShiftSummary(() => {
      endShift(currentUser);
      currentUser = null;
      localStorage.removeItem('yaqiz_user');
      renderApp();
    });
  } else {
    currentUser = null;
    localStorage.removeItem('yaqiz_user');
    renderApp();
  }
}

function getCurrentPlan() {
  const db = getDB();
  let plan = db.settings?.plan || 'basic';
  // normalize legacy plan names
  if (plan === 'trial' || plan === 'free' || plan === 'starter') plan = 'basic';
  // if subscription expired on a paid plan → drop to basic
  const exp = db.settings?.plan_expires_at;
  if (plan !== 'basic' && exp && new Date(exp) < new Date()) plan = 'basic';
  return plan;
}

function getTrialDaysLeft() {
  const exp = getDB().settings?.plan_expires_at;
  if (!exp) return null;
  const d = Math.ceil((new Date(exp) - new Date()) / (1000 * 60 * 60 * 24));
  return d;
}

function hasPlanPage(pageId) {
  return (PLAN_PAGES[getCurrentPlan()] || PLAN_PAGES.basic).includes(pageId);
}

function hasPlanFeature(feat) {
  return (PLAN_FEATURES[getCurrentPlan()] || PLAN_FEATURES.basic).includes(feat);
}

function renderCSBody(db, myTickets) {
  myTickets = myTickets || (db.escalations||[]).filter(e=>e.user===(currentUser.full_name||currentUser.username));

  // تبويب تذاكري
  if(!_cs.dept && _cs.tab==='tickets') {
    if(!myTickets.length) return `<div style="text-align:center;padding:30px 16px;">
      <div style="font-size:36px;margin-bottom:10px;">🎫</div>
      <div style="font-weight:800;color:var(--text-muted);font-size:13px;">لا توجد تذاكر سابقة</div>
    </div>`;
    return myTickets.slice().reverse().map(e=>{
      const statusColor = e.status==='open'?'#f97316':'#22c55e';
      const statusLabel = e.status==='open'?'⏳ قيد المعالجة':'✅ تم الحل';
      return `<div style="border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div style="font-weight:800;font-size:13px;">📌 ${e.path}</div>
          <span style="font-size:11px;font-weight:700;color:${statusColor};">${statusLabel}</span>
        </div>
        ${e.note?`<div style="font-size:12px;color:var(--text-muted);background:var(--bg);padding:8px;border-radius:8px;margin-bottom:6px;">"${e.note}"</div>`:''}
        <div style="font-size:11px;color:var(--text-muted);">${fmtDate(e.created_at)}</div>
        ${e.reply?`<div style="margin-top:8px;padding:8px;background:var(--primary-soft);border-radius:8px;font-size:12px;border-right:3px solid var(--primary);">
          <b>رد الإدارة:</b> ${e.reply}
        </div>`:''}
      </div>`;
    }).join('');
  }

  // تبويب الوارد (للمالك)
  if(!_cs.dept && _cs.tab==='inbox') {
    const open = (db.escalations||[]).filter(e=>e.status==='open');
    if(!open.length) return `<div style="text-align:center;padding:30px;"><div style="font-size:36px;">✅</div><div style="font-weight:800;color:var(--text-muted);margin-top:10px;">لا يوجد تصعيدات معلقة</div></div>`;
    return open.map(e=>`
    <div style="border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <div style="font-weight:800;font-size:13px;">👤 ${e.user}</div>
        <div style="font-size:11px;color:var(--text-muted);">${fmtDate(e.created_at)}</div>
      </div>
      <div style="font-size:12px;color:var(--primary);font-weight:700;margin-bottom:6px;">📌 ${e.path}</div>
      ${e.note?`<div style="font-size:12px;color:var(--text-muted);background:var(--bg);padding:8px;border-radius:8px;margin-bottom:8px;">"${e.note}"</div>`:''}
      <input id="cs-reply-${e.id}" class="input" placeholder="رد على المستخدم (اختياري)..." style="font-size:12px;margin-bottom:8px;" />

        ✓ تم المعالجة
      </button>
    </div>`).join('');
  }

  // الشاشة الرئيسية — اختيار القسم
  if(!_cs.dept) {
    return `
    <div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:12px;">اختر القسم الذي تواجه فيه مشكلة:</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
    ${CS_DEPTS.map(d=>`
      <button onclick="csSelectDept('${d.id}')" style="

        display:flex;flex-direction:column;align-items:center;gap:5px;

      </button>`).join('')}
    </div>`;
  }

  // مشكلة أخرى
  if(_cs.dept.id==='other') {
    return `
    <div style="font-weight:800;font-size:13px;margin-bottom:12px;">✍️ اكتب مشكلتك</div>

  // اختيار المشكلة الفرعية
  if(!_cs.sub) {
    return `
    <div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:10px;">${_cs.dept.icon} اختر نوع المشكلة:</div>
    ${(_cs.dept.subs||[]).map(s=>`

      width:100%;text-align:${lang==='ar'?'right':'left'};padding:11px 14px;margin-bottom:7px;

      onmouseover="this.style.borderColor='var(--primary)';this.style.background='var(--primary-soft)'"
      onmouseout="this.style.borderColor='var(--border)';this.style.background='var(--bg)'">
      ${s.label}
      <div style="font-size:11px;font-weight:400;color:var(--text-muted);margin-top:2px;">${s.desc}</div>
    </button>`).join('')}`;
  }

  // الحلول السريعة + التصعيد
  const tips = _cs.sub.tips || [];
  return `
  <div style="padding:12px;background:var(--primary-soft);border-radius:12px;margin-bottom:14px;border-${lang==='ar'?'right':'left'}:3px solid var(--primary);">
    <div style="font-weight:900;font-size:13px;margin-bottom:2px;">📌 ${_cs.dept.label} › ${_cs.sub.label}</div>
    <div style="font-size:11px;color:var(--text-muted);">${_cs.sub.desc}</div>
  </div>

  ${tips.length?`
  <div style="font-weight:800;font-size:12px;color:var(--text-muted);margin-bottom:8px;">💡 حلول سريعة:</div>
  ${tips.map(t=>`
  <div style="display:flex;gap:8px;align-items:flex-start;padding:9px 12px;background:var(--bg);border-radius:10px;margin-bottom:6px;border:1px solid var(--border);">
    <span style="color:var(--success);font-size:13px;margin-top:1px;">✓</span>
    <span style="font-size:12px;color:var(--text-main);">${t}</span>
  </div>`).join('')}
  <div style="margin:14px 0 10px;border-top:1px solid var(--border);"></div>`:''}

  <div style="font-weight:800;font-size:12px;margin-bottom:8px;">لم تحل المشكلة؟ أرسل تذكرة:</div>

  <div style="margin-bottom:8px;">
    <div style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:4px;">الأولوية</div>
    <div style="display:flex;gap:6px;" id="cs-priority-btns">
      ${[['normal','عادية','#64748b'],['medium','متوسطة','#f59e0b'],['high','عاجلة','#ef4444']].map(([v,l,c])=>`
      <button onclick="csSetPriority('${v}')" id="cs-pri-${v}" style="

    </div>
  </div>

  <textarea id="cs-escalate-note" rows="3" placeholder="اشرح مشكلتك باختصار..." style="

let _csPriority = 'normal';
function csSetPriority(v) {
  _csPriority = v;
  const colors = {normal:'#64748b', medium:'#f59e0b', high:'#ef4444'};
  ['normal','medium','high'].forEach(p=>{
    const b = document.getElementById('cs-pri-'+p);
    if(!b) return;
    const c = colors[p];
    b.style.border = `1.5px solid ${p===v?c:'var(--border)'}`;
    b.style.background = p===v?c+'20':'var(--bg)';
    b.style.color = p===v?c:'var(--text-muted)';
  });
}

function csSetTab(tab) {
  _cs.tab = tab;
  renderCSButton();
}

function toggleCS() { _cs.open=!_cs.open; renderCSButton(); }

function csBack() {
  if(_cs.sub) { _cs.sub=null; }
  else { _cs.dept=null; }
  const body=document.getElementById('cs-body');
  if(body) body.innerHTML=renderCSBody(getDB());
  renderCSButton();
}

function csSelectDept(id) {
  _cs.dept=CS_DEPTS.find(d=>d.id===id); _cs.sub=null;
  const body=document.getElementById('cs-body');
  if(body) body.innerHTML=renderCSBody(getDB());
  renderCSButton();
}

function csSelectSub(id) {
  _cs.sub=(_cs.dept?.subs||[]).find(s=>s.id===id);
  _cs.sub && (_csPriority='normal');
  const body=document.getElementById('cs-body');
  if(body) body.innerHTML=renderCSBody(getDB());
  renderCSButton();
}

function _postTicketToAPI(payload) {
  if(window.location.protocol==='file:') return;
  // استخدم apiFetch من الـ bridge لأنه يجدد التوكن تلقائياً عند انتهائه
  if(window._cloudApiFetch) {
    window._cloudApiFetch('POST', '/api/support/ticket', payload)
      .catch(err=>{ console.warn('Ticket send failed:', err?.message||err); });
    return;
  }
  const token=localStorage.getItem('yaqiz_access_token'); if(!token) return;
  const base=(window._YAQIZ_API||'').replace(/\/$/,'');
  fetch(base+'/api/support/ticket',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify(payload)
  })
  .then(r=>{ if(!r.ok) showToast(lang==='ar'?'⚠️ تعذّر حفظ التذكرة على السيرفر':'⚠️ Failed to save ticket','error'); })
  .catch(()=>showToast(lang==='ar'?'تعذّر إرسال التذكرة، تحقق من الاتصال':'Failed to send ticket','error'));
}

function csEscalate() {
  const note=(document.getElementById('cs-escalate-note')?.value||'').trim();
  const db=getDB();
  if(!db.escalations) db.escalations=[];
  if(!db.nextId.escalation) db.nextId.escalation=1;
  const path=`${_cs.dept?.label}${_cs.sub?' › '+_cs.sub.label:''}`;
  db.escalations.push({
    id:db.nextId.escalation++,
    user:currentUser.full_name||currentUser.username,
    role:currentUser.role, path, note,
    priority:_csPriority||'normal',
    status:'open', created_at:new Date().toISOString()
  });
  saveDB(db);
  _postTicketToAPI({department:_cs.dept?.label||'',sub_dept:_cs.sub?.label||'',description:path,note,priority:_csPriority});
  const body=document.getElementById('cs-body');
  if(body) body.innerHTML=`
    <div style="text-align:center;padding:28px 16px;">
      <div style="font-size:44px;margin-bottom:12px;">🎫</div>
      <div style="font-weight:900;font-size:15px;margin-bottom:6px;">تم إرسال تذكرتك</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:20px;line-height:1.6;">وصلت مشكلتك لفريق الدعم<br>يمكنك متابعة حالتها من تبويب "تذاكري"</div>
      <button onclick="csSetTab('tickets');_cs.dept=null;renderCSButton();" style="padding:10px 24px;background:var(--primary);color:white;border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;">عرض تذاكري</button>
    </div>`;
  renderCSButton();
}

function csSubmitOther() {

  if(!text){document.getElementById('cs-other-text').style.borderColor='var(--danger)';return;}
  const db=getDB();
  if(!db.escalations) db.escalations=[];

  db.escalations.push({id:db.nextId.escalation++,user:currentUser.full_name||currentUser.username,role:currentUser.role,path:'مشكلة أخرى',note:text,priority:'normal',status:'open',created_at:new Date().toISOString()});

function resetCS() {

function csCloseEscalation(id) {
  const db = getDB();
  const e = (db.escalations||[]).find(e=>e.id===id);
  if(e) {
    e.status = 'closed';
    const replyInput = document.getElementById('cs-reply-'+id);
    if(replyInput?.value?.trim()) e.reply = replyInput.value.trim();
    e.closed_at = new Date().toISOString();
  }
  saveDB(db);
  renderCSButton();
}

  try { const t=localStorage.getItem('yaqiz_access_token'); if(!t)return null; const p=JSON.parse(atob(t.split('.')[1])); return `ai_hist_${p.company_id}`; } catch{return null;}
}
function _aiLoadHistory() {
  if(getCurrentPlan()!=='pro') return;
  try { const k=_aiGetHistoryKey(); if(k){const s=localStorage.getItem(k); if(s) _aiChatHistory=JSON.parse(s).slice(-30);} } catch{}
}
function _aiSaveHistory() {
  if(getCurrentPlan()!=='pro') return;
  try { const k=_aiGetHistoryKey(); if(k) localStorage.setItem(k,JSON.stringify(_aiChatHistory.slice(-30))); } catch{}
}
function _aiClearHistory() {

function toggleAIChat() {
  _aiChat.open = !_aiChat.open;
  if (_aiChat.open) _aiChat.minimized = false;
  renderAIChatButton();
}

function closeAIChat() { _aiChat.open = false; renderAIChatButton(); }
function toggleAIChatMin() { _aiChat.minimized = !_aiChat.minimized; renderAIChatButton(); }

async function sendAIMsg() {
  const inp = document.getElementById('ai-chat-inp');
  if (!inp || _aiChat.loading) return;
  const q = inp.value.trim();
  if (!q) return;

  const plan = getCurrentPlan();
  if (plan === 'growth' && _aiDailyUsed >= 3) {
    inp.value = '';
    _aiChatHistory.push({ q, a: `⚠️ ${lang==='ar'?'وصلت لحد الـ 3 أسئلة اليومية. يتجدد الحد منتصف الليل. رقّ للباقة الاحترافية للوصول غير المحدود.':'Daily limit of 3 questions reached. Resets at midnight. Upgrade to Pro for unlimited access.'}` });
    renderAIChatButton();
    return;
  }

  inp.value = '';
  _aiChatHistory.push({ q, a: null });
  _aiChat.loading = true;
  renderAIChatButton();

  try {
    const db  = getDB();
    const now = new Date();

    // ── دوال مساعدة للتواريخ ──────────────────────────────
    const todayStr     = now.toISOString().slice(0, 10);
    const yesterdayStr = new Date(now - 864e5).toISOString().slice(0, 10);
    const thisMonth    = now.toISOString().slice(0, 7);
    const lastMonth    = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().slice(0, 7);

    const invList  = db.invoices    || [];
    const purList  = db.purchases   || [];
    const custList = db.customers   || [];
    const suppList = db.suppliers   || [];
    const prodList = db.products    || [];
    const empList  = db.employees   || [];
    const oblList  = db.obligations || [];
    const quoList  = db.quotes      || [];

    // ── دالة حساب المعادل الشهري للالتزام ──────────────
    function oblMonthly(o) {
      if (o.frequency === 'شهري')       return o.amount;
      if (o.frequency === 'أسبوعي')     return o.amount * 4.33;
      if (o.frequency === 'ربع سنوي')  return o.amount / 3;
      if (o.frequency === 'نصف سنوي')  return o.amount / 6;
      if (o.frequency === 'سنوي')       return o.amount / 12;
      return o.amount;
    }

    // ── دالة تصفية الفواتير حسب التاريخ ─────────────────
    function invByDate(datePrefix) {
      return invList.filter(i => (i.created_at || '').startsWith(datePrefix));
    }
    function purByDate(datePrefix) {
      return purList.filter(p => (p.created_at || '').startsWith(datePrefix));
    }

    // ── إحصائيات سريعة بالتواريخ ────────────────────────
    const todayInv   = invByDate(todayStr);
    const yestInv    = invByDate(yesterdayStr);
    const monthInv   = invByDate(thisMonth);
    const lastMInv   = invByDate(lastMonth);
    const todayPur   = purByDate(todayStr);
    const yestPur    = purByDate(yesterdayStr);
    const monthPur   = purByDate(thisMonth);

    // ── قائمة الفواتير الكاملة (مع limit للحفاظ على التوكن) ─
    const MAX_INV = 300;
    const allInvMapped = invList.slice(-MAX_INV).map(i => ({
      no:        i.invoice_no,
      customer:  i.customer_name,
      total:     i.grand_total,
      paid:      i.paid_amount,
      remaining: i.remaining_amount,
      status:    i.status,
      date:      (i.created_at || '').slice(0, 10),
    }));

    const ctx = {
      // ── التاريخ الحالي (مهم جداً للأسئلة الزمنية) ──────
      today:      todayStr,
      yesterday:  yesterdayStr,
      this_month: thisMonth,
      last_month: lastMonth,

      // ── الشركة ──────────────────────────────────────────
      company:        db.settings?.company_name || '',
      vat_number:     db.settings?.vat_number   || '',
      address:        db.settings?.address      || '',

      // ── الخزينة ─────────────────────────────────────────
      treasury_balance: db.treasury?.balance || 0,

      // ── إحصائيات اليوم ──────────────────────────────────
      today_invoices_count:   todayInv.length,
      today_revenue:          todayInv.reduce((s,i)=>s+(i.grand_total||0),0),
      today_invoices:         todayInv.map(i=>({no:i.invoice_no,customer:i.customer_name,total:i.grand_total,status:i.status})),
      today_expenses:         todayPur.reduce((s,p)=>s+(p.total||0),0),

      // ── إحصائيات أمس ────────────────────────────────────
      yesterday_invoices_count: yestInv.length,
      yesterday_revenue:        yestInv.reduce((s,i)=>s+(i.grand_total||0),0),
      yesterday_invoices:       yestInv.map(i=>({no:i.invoice_no,customer:i.customer_name,total:i.grand_total,status:i.status})),
      yesterday_expenses:       yestPur.reduce((s,p)=>s+(p.total||0),0),

      // ── إحصائيات هذا الشهر ──────────────────────────────
      this_month_invoices_count: monthInv.length,
      this_month_revenue:        monthInv.reduce((s,i)=>s+(i.grand_total||0),0),
      this_month_expenses:       monthPur.reduce((s,p)=>s+(p.total||0),0),
      this_month_net:            monthInv.reduce((s,i)=>s+(i.grand_total||0),0) - monthPur.reduce((s,p)=>s+(p.total||0),0),

      // ── إحصائيات الشهر الماضي ───────────────────────────
      last_month_revenue:  lastMInv.reduce((s,i)=>s+(i.grand_total||0),0),
      last_month_invoices: lastMInv.length,

      // ── إجماليات الفواتير الكلية ─────────────────────────
      invoices_total_count:    invList.length,
      invoices_paid_count:     invList.filter(i=>i.status==='مسددة').length,
      invoices_pending_count:  invList.filter(i=>i.status==='آجل').length,
      invoices_partial_count:  invList.filter(i=>i.status==='جزئي').length,
      invoices_total_revenue:  invList.reduce((s,i)=>s+(i.grand_total||0),0),
      invoices_total_collected: invList.reduce((s,i)=>s+(i.paid_amount||0),0),
      invoices_total_remaining: invList.reduce((s,i)=>s+Math.max(0,(i.grand_total||0)-(i.paid_amount||0)),0),

      // ── قائمة الفواتير الكاملة ──────────────────────────
      all_invoices: allInvMapped,

      // ── العملاء الكاملة ──────────────────────────────────
      customers_count:          custList.length,
      customers_with_balance:   custList.filter(c=>c.balance>0).length,
      customers_total_balances: custList.reduce((s,c)=>s+(c.balance||0),0),
      customers: custList.map(c=>({
        name: c.name, phone: c.phone,
        balance: c.balance, loyalty: c.loyalty_points
      })),

      // ── الموردون الكاملة ─────────────────────────────────
      suppliers_count:         suppList.length,
      suppliers_total_balance: suppList.reduce((s,s2)=>s+(s2.balance||0),0),
      suppliers: suppList.map(s=>({ name: s.name, balance: s.balance })),

      // ── المنتجات الكاملة ─────────────────────────────────
      products_count:   prodList.length,
      low_stock_count:  prodList.filter(p=>(p.qty||0)<=(p.min_qty||0)&&p.min_qty>0).length,
      low_stock:        prodList.filter(p=>(p.qty||0)<=(p.min_qty||0)&&p.min_qty>0).map(p=>({name:p.name,qty:p.qty,min:p.min_qty})),
      products: prodList.map(p=>({
        name: p.name, code: p.code,
        qty: p.qty, min_qty: p.min_qty,
        sell_price: p.sell_price, buy_price: p.buy_price
      })),

      // ── المشتريات الكاملة (آخر 200) ─────────────────────
      purchases_total_count: purList.length,
      purchases_grand_total: purList.reduce((s,p)=>s+(p.total||0),0),
      recent_purchases: purList.slice(-200).map(p=>({
        vendor: p.vendor, description: p.description,
        total: p.total, status: p.status,
        date: (p.created_at||'').slice(0,10), category: p.category
      })),

      // ── الموظفون الكاملة ─────────────────────────────────
      employees_count:    empList.length,
      monthly_payroll:    empList.filter(e=>e.status==='active').reduce((s,e)=>s+(e.salary||0)+(e.allowances||0),0),
      employees: empList.map(e=>({
        name: e.name, position: e.position, department: e.department,
        salary: e.salary, allowances: e.allowances, status: e.status
      })),

      // ── الالتزامات الكاملة ───────────────────────────────
      obligations_count:          oblList.length,
      obligations_active_count:   oblList.filter(o=>o.status==='active').length,
      obligations_total_amount:   oblList.filter(o=>o.status==='active').reduce((s,o)=>s+(o.amount||0),0),
      obligations_monthly_equiv:  oblList.filter(o=>o.status==='active').reduce((s,o)=>s+oblMonthly(o),0),
      obligations_due_soon:       oblList.filter(o=>{
        if(o.status!=='active') return false;
        const d=new Date(o.next_due);
        const days=(d-now)/(864e5);
        return days>=0 && days<=30;
      }).length,
      obligations: oblList.map(o=>({
        name: o.name, vendor: o.vendor, category: o.category,
        amount: o.amount, frequency: o.frequency,
        monthly_equiv: oblMonthly(o),
        next_due: (o.next_due||'').slice(0,10),
        status: o.status,
        payments_count: (o.payments||[]).length,
        last_payment: (o.payments||[]).slice(-1)[0] || null
      })),

      // ── العروض (Quotes) ──────────────────────────────────
      quotes_count:   quoList.length,
      quotes_pending: quoList.filter(q=>q.status==='معلق').length,
      quotes_total:   quoList.reduce((s,q)=>s+(q.grand_total||0),0),
    };

    const history = _aiChatHistory.slice(0, -1).slice(-6)
      .filter(h => h.a)
      .map(h => ({ question: h.q, answer: h.a }));

    const res = await window._cloudApiFetch('POST', '/api/ai/assistant', { question: q, context: ctx, history });
    _aiChatHistory[_aiChatHistory.length - 1].a = res?.answer || (lang==='ar'?'لم أتمكن من الإجابة.':'Could not answer.');
  } catch (e) {
    _aiChatHistory[_aiChatHistory.length - 1].a = `⚠️ ${e?.message || (lang==='ar'?'خطأ في الاتصال':'Connection error')}`;
  }

  _aiChat.loading = false;
  if (plan === 'growth') _aiDailyUsed = Math.min(3, _aiDailyUsed + 1);
  if (plan === 'pro') _aiSaveHistory();
  renderAIChatButton();
}

function toggleSidebar() {
  const s = el('sidebar');
  if (!s) return;
  if (window.innerWidth <= 768) {
    // Mobile: slide overlay
    const isOpen = s.classList.contains('mobile-open');
    s.classList.toggle('mobile-open', !isOpen);
    const ov = el('sidebar-overlay');
    if (ov) ov.classList.toggle('active', !isOpen);
  } else {
    // Desktop: collapse to icons
    sidebarCollapsed = !sidebarCollapsed;
    s.className = `sidebar ${sidebarCollapsed ? 'collapsed' : ''}`;
  }
}

function closeMobileSidebar() {
  const s = el('sidebar');
  if (s) s.classList.remove('mobile-open');
  const ov = el('sidebar-overlay');
  if (ov) ov.classList.remove('active');
}

function goTo(page) {
  currentPage = page;
  $qa('.nav-item').forEach(n => { n.classList.toggle('active', n.getAttribute('onclick')===`goTo('${page}')`); });
  if (window.innerWidth <= 768) closeMobileSidebar();
  renderPage();
}

function renderPage() {
  const c = el('page-content');
  if(!c) return;
  // منع الوصول لصفحات خارج الباقة
  if(!hasPlanPage(currentPage)) { currentPage='dashboard'; }
  switch(currentPage) {
    case 'pos': renderPOSPage(c); break;
    case 'dashboard': renderDashboard(c); break;
    case 'sales': renderSales(c); break;
    case 'purchases': renderPurchases(c); break;
    case 'inventory': renderInventory(c); break;
    case 'customers': renderCustomers(c); break;
    case 'suppliers': renderSuppliers(c); break;
    case 'treasury': renderTreasury(c); break;
    case 'accounts': renderAccounts(c); break;
    case 'reports': renderReports(c); break;
    case 'balance_sheet': renderReports(c); break;
    case 'journal': renderReports(c); break;
    case 'accounts': renderReports(c); break;
    case 'users': renderUsers(c); break;
    case 'employees': renderEmployees(c); break;
    case 'obligations': renderObligations(c); break;
    case 'receipts': renderReceipts(c); break;
    case 'returns': renderReturns(c); break;
    case 'quotes': renderQuotes(c); break;
    case 'stock_moves': renderStockMoves(c); break;
    case 'activity': renderActivity(c); break;
    case 'settings': renderSettings(c); break;
  }
  refreshIcons();
}

// ============ DASHBOARD ============
function renderDashboard(c) {
  const db = getDB();
  const today = new Date().toDateString();
  const now = new Date();
  const month = now.getMonth();
  const year  = now.getFullYear();
  const lastMonth = month === 0 ? 11 : month - 1;
  const lastMonthYear = month === 0 ? year - 1 : year;

  const todaySales  = db.invoices.filter(i=>new Date(i.created_at).toDateString()===today).reduce((s,i)=>s+i.grand_total,0);
  const monthSales  = db.invoices.filter(i=>new Date(i.created_at).getMonth()===month&&new Date(i.created_at).getFullYear()===year).reduce((s,i)=>s+i.grand_total,0);
  const lastMSales  = db.invoices.filter(i=>new Date(i.created_at).getMonth()===lastMonth&&new Date(i.created_at).getFullYear()===lastMonthYear).reduce((s,i)=>s+i.grand_total,0);
  const monthPurch  = db.purchases.filter(p=>new Date(p.created_at).getMonth()===month&&new Date(p.created_at).getFullYear()===year).reduce((s,p)=>s+p.total,0);
  const lastMPurch  = db.purchases.filter(p=>new Date(p.created_at).getMonth()===lastMonth&&new Date(p.created_at).getFullYear()===lastMonthYear).reduce((s,p)=>s+p.total,0);
  const receivables = db.customers.reduce((s,c)=>s+Math.max(0,c.balance||0),0);
  const payables    = db.suppliers.reduce((s,sup)=>s+Math.max(0,sup.balance||0),0);
  const lowStock    = db.products.filter(p=>p.qty<=p.min_qty);

  const pctChange = (cur,prev) => {
    if(!prev) return null;
    const p = Math.round((cur-prev)/prev*100);
    return `<span style="font-size:11px;font-weight:700;color:${p>=0?'var(--success)':'var(--danger)'};">${p>=0?'▲':'▼'}${Math.abs(p)}% ${lang==='ar'?'عن الشهر السابق':'vs last month'}</span>`;
  };

  // chart data - last 7 days
  const days = [];
  for(let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toDateString();
    const s = db.invoices.filter(x=>new Date(x.created_at).toDateString()===ds).reduce((a,x)=>a+x.grand_total,0);
    const p = db.purchases.filter(x=>new Date(x.created_at).toDateString()===ds).reduce((a,x)=>a+x.total,0);
    days.push({date:d.toLocaleDateString(lang==='ar'?'ar-SA':'en-US',{weekday:'short'}),s,p});
  }
  const maxVal = Math.max(...days.map(d=>Math.max(d.s,d.p)),1);
  const chartBars = days.map(d=>`
    <div class="chart-col">
      <div class="chart-bars">
        <div class="chart-bar-s" style="height:${(d.s/maxVal)*100}%" title="${fmtMoney(d.s)}"></div>
        <div class="chart-bar-p" style="height:${(d.p/maxVal)*100}%" title="${fmtMoney(d.p)}"></div>
      </div>
      <div class="chart-label">${d.date}</div>
    </div>`).join('');

  c.innerHTML = `
  <div>
    <div class="page-header">
      <div>
        <div class="page-title-lg">${t('dashboard')}</div>
        <div class="page-sub">${new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card" onclick="goTo('sales')"><div class="stat-icon green">${icon('trending-up',22)}</div><div class="stat-label">${t('todaySales')}</div><div class="stat-value">${fmtMoney(todaySales)}</div></div>
      <div class="stat-card" onclick="goTo('sales')"><div class="stat-icon">${icon('shopping-cart',22)}</div><div class="stat-label">${t('monthSales')}</div><div class="stat-value">${fmtMoney(monthSales)}</div><div style="margin-top:6px;">${pctChange(monthSales,lastMSales)||''}</div></div>
      <div class="stat-card" onclick="goTo('purchases')"><div class="stat-icon amber">${icon('package',22)}</div><div class="stat-label">${t('monthPurchases')}</div><div class="stat-value">${fmtMoney(monthPurch)}</div><div style="margin-top:6px;">${pctChange(monthPurch,lastMPurch)||''}</div></div>
      <div class="stat-card" onclick="goTo('treasury')"><div class="stat-icon green">${icon('wallet',22)}</div><div class="stat-label">${t('treasuryBalance')}</div><div class="stat-value">${fmtMoney(db.treasury.balance)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;">
      <div class="card">
        <div class="card-head"><h3>${t('salesTrend')}</h3>
          <div style="display:flex;gap:12px;font-size:11px;"><span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:var(--primary);border-radius:2px;display:inline-block;"></span>${lang==='ar'?'مبيعات':'Sales'}</span><span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:#f59e0b;border-radius:2px;display:inline-block;"></span>${lang==='ar'?'مشتريات':'Purchases'}</span></div>
        </div>
        <div class="card-pad"><div class="chart-wrap">${chartBars}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>⚠️ ${t('lowStock')}</h3></div>
        <div style="padding:12px;">
          ${lowStock.length===0?`<div class="empty" style="padding:20px;"><div class="empty-icon">✅</div>${lang==='ar'?'لا توجد تنبيهات':'No alerts'}</div>`:
          lowStock.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="goTo('inventory')">
            <div style="font-weight:700;font-size:13px;">${p.name}</div>

// Barcode / name search handler
function posSearchInput(val) {
  const db=getDB();
  const q=val.trim().toLowerCase();
  const res=el('pos-search-results');
  if(!q){if(res)res.style.display='none';filterProductGrid('');return;}

  // exact barcode match → add directly
  const exact=db.products.find(p=>p.code?.toLowerCase()===q);
  if(exact){
    if(exact.qty<=0){
      showToast(lang==='ar'?`⚠️ ${exact.name}: نفد المخزون`:`⚠️ ${exact.name}: Out of stock`,'error');
    } else {
      addToCart(exact.id);
    }
    const si=el('pos-search'); if(si){si.value='';si.focus();}
    if(res)res.style.display='none';
    filterProductGrid('');
    return;
  }

  // partial match → show dropdown + filter grid
  filterProductGrid(q);
  const matches=db.products.filter(p=>p.name.toLowerCase().includes(q)||p.code?.toLowerCase().includes(q)).slice(0,6);
  if(!res)return;
  if(matches.length===0){res.style.display='none';return;}
  res.style.display='block';
  res.innerHTML=matches.map(p=>`
    <div onclick="addToCart(${p.id});el('pos-search').value='';el('pos-search-results').style.display='none';filterProductGrid('');el('pos-search').focus();"
      style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background 0.1s;"
      onmouseover="this.style.background='var(--primary-soft)'" onmouseout="this.style.background=''">
      <div>
        <div style="font-weight:700;font-size:13px;">${p.name}</div>
        <div style="font-size:11px;color:var(--text-muted);">${p.code} • ${lang==='ar'?'مخزون:':'Stock:'} ${p.qty}</div>
      </div>
      <div style="font-weight:800;color:var(--primary);">${fmtMoney(p.sell_price)}</div>
    </div>`).join('');
}

function posSearchKeydown(e) {
  if(e.key==='Enter') {
    const q=el('pos-search')?.value?.trim().toLowerCase()||'';
    if(!q) return;
    const db=getDB();
    // exact barcode match first (scanner sends barcode + Enter)
    const exact=db.products.find(p=>p.code?.toLowerCase()===q);
    if(exact){
      if(exact.qty<=0){
        showToast(lang==='ar'?`⚠️ ${exact.name}: نفد المخزون`:`⚠️ ${exact.name}: Out of stock`,'error');
      } else {
        addToCart(exact.id);
      }
      el('pos-search').value='';
      if(el('pos-search-results')) el('pos-search-results').style.display='none';
      filterProductGrid('');
      el('pos-search').focus();
      return;
    }
    // no barcode match → show error
    if(q.length>=3 && !db.products.some(p=>p.name.toLowerCase().includes(q)||p.code?.toLowerCase().includes(q))){
      showToast(lang==='ar'?`❌ لم يُعثر على: ${q}`:`❌ Not found: ${q}`,'error');
      el('pos-search').value='';
      el('pos-search').focus();
      return;
    }
    // fallback: single partial match
    const matches=db.products.filter(p=>p.name.toLowerCase().includes(q)||p.code?.toLowerCase().includes(q));
    if(matches.length===1){
      addToCart(matches[0].id);
      el('pos-search').value='';
      el('pos-search-results').style.display='none';
      filterProductGrid('');
      el('pos-search').focus();
    }
  }
  if(e.key==='Escape'){
    el('pos-search-results').style.display='none';
    filterProductGrid('');
  }
}

function addToCart(id) {
  const db=getDB();
  const p=db.products.find(x=>x.id===id); if(!p)return;
  if(p.qty<=0){showToast(lang==='ar'?`${p.name}: نفد المخزون`:`${p.name}: Out of stock`,'error');return;}
  const ex=cart.find(i=>i.id===id);
  if(ex){
    if(ex.qty>=p.qty){showToast(lang==='ar'?'لا يوجد مخزون كافٍ':'Insufficient stock','error');return;}
    ex.qty++;
  } else {
    cart.push({id:p.id,name:p.name,code:p.code,price:p.sell_price,qty:1});
  }
  // update cart only without full re-render for speed
  updateCartDisplay();
  updatePOSTotals();
}

function updateCartDisplay() {
  const cartEl=el('pos-cart'); if(!cartEl)return;
  if(cart.length===0){
    cartEl.innerHTML=`<div class="empty"><div class="empty-icon">🛒</div>${lang==='ar'?'امسح الباركود أو اضغط على منتج':'Scan barcode or tap a product'}</div>`;

function updatePOSTotals() {

function doCheckout() {
  if(cart.length===0){showToast(lang==='ar'?'السلة فارغة':'Cart empty','error');return;}
  const db=getDB();
  const subtotal=cart.reduce((s,i)=>s+i.qty*i.price,0);
  const disc=Number(posDiscount||0);
  const afterDisc=Math.max(0,subtotal-disc);
  const vat=afterDisc*0.15; const total=afterDisc+vat;
  const inv={
    id:nextId(db,'invoice'),
    invoice_no:`SAL-${new Date().getFullYear()}${String(db.nextId.invoice-1).padStart(5,'0')}`,
    customer_name:posCustomer||t('cashCustomer'), customer_vat:'',
    items:cart.map(i=>({id:i.id,name:i.name,code:i.code||'',qty:i.qty,price:i.price,line_total:i.qty*i.price})),
    subtotal:afterDisc, discount:disc, vat_total:vat, grand_total:total,
    payment_method:posPayment, status:posPayment==='آجل'?'آجل':'مسددة',
    invoice_type:'simplified', zatca_status:false, paid_amount:posPayment==='آجل'?0:total,
    created_at:new Date().toISOString()
  };
  // stock moves (FIFO)
  if(!db.stock_moves)db.stock_moves=[];
  if(!db.nextId.stock_move)db.nextId.stock_move=1;
  cart.forEach(ci=>{
    const p=db.products.find(x=>x.id===ci.id);
    if(p){const oldQty=p.qty;
      fifoDeduct(p, ci.qty);
      p.qty=Math.max(0,p.qty-ci.qty);
      db.stock_moves.push({id:db.nextId.stock_move++,product_id:p.id,product_name:p.name,product_code:p.code||'',type:'out',qty:ci.qty,balance_before:oldQty,balance_after:p.qty,reason:'مبيعات POS',reference:inv.invoice_no,date:new Date().toISOString()});}
  });
  // treasury
  if(posPayment!=='آجل'){
    db.treasury.balance+=total;
    db.treasury.moves.unshift({id:nextId(db,'treasury'),type:'in',amount:total,description:`فاتورة ${inv.invoice_no}`,reference:inv.invoice_no,date:new Date().toISOString()});
  }
  // Journal entry: Dr. Cash / Cr. Sales Revenue + Cr. VAT
  if(!db.journal)db.journal=[];
  if(!db.nextId.journal)db.nextId.journal=1;
  const jEntries = [];
  if(posPayment!=='آجل') {
    jEntries.push({account:lang==='ar'?'النقدية':'Cash',account_code:'1100',side:'debit',amount:total});
  } else {
    jEntries.push({account:lang==='ar'?'الذمم المدينة':'Accounts Receivable',account_code:'1200',side:'debit',amount:total});
  }
  jEntries.push({account:lang==='ar'?'إيرادات المبيعات':'Sales Revenue',account_code:'4100',side:'credit',amount:afterDisc});
  jEntries.push({account:lang==='ar'?'ضريبة المخرجات':'Output VAT',account_code:'2200',side:'credit',amount:vat});
  db.journal.push({id:db.nextId.journal++,date:new Date().toISOString(),
    description:`مبيعات POS: ${inv.invoice_no} — ${inv.customer_name}`,
    entries:jEntries, ref:inv.invoice_no});

  db.invoices.push(inv); saveDB(db);
  // update shift stats
  if(currentUser?.shift_enabled) updateShiftOnSale(inv);
  // loyalty points
  if(inv.customer_name && inv.customer_name!==t('cashCustomer')) addLoyaltyPoints(inv.customer_name, inv.subtotal);
  logActivity('مبيعات POS',`${inv.invoice_no} — ${inv.customer_name} — ${fmtMoney(total)}`);
  cart=[];posDiscount=0;posCustomer='';posPayment='نقدي';
  showToast(`✅ ${inv.invoice_no} — ${fmtMoney(total)}`);
  showInvoiceModal(inv);
  renderPOS(el('sales-content'));
}

// ── ZATCA QR Code Generator (TLV format) ──
function generateZATCAQR(s, inv) {
  // TLV encoding for ZATCA simplified invoice
  function tlv(tag, value) {
    const enc = new TextEncoder();
    const bytes = enc.encode(value);
    return String.fromCharCode(tag, bytes.length) + Array.from(bytes).map(b=>String.fromCharCode(b)).join('');
  }
  const dt = new Date(inv.created_at).toISOString();
  const tlvStr =
    tlv(1, s.company_name||'يقظ') +
    tlv(2, s.vat_number||'300000000000000') +
    tlv(3, dt) +
    tlv(4, inv.grand_total.toFixed(2)) +
    tlv(5, inv.vat_total.toFixed(2));
  // base64
  try {
    return btoa(unescape(encodeURIComponent(tlvStr)));
  } catch(e) {
    return btoa(tlvStr);
  }
}

// ── QR Code Canvas (simple matrix QR) ──
function generateQRCanvas(canvasId, data) {
  const canvas = el(canvasId); if(!canvas) return;
  function _renderQR() {
    canvas.style.display='none';
    const div = document.createElement('div');
    div.id = 'qr-render-'+Date.now();
    canvas.parentNode.insertBefore(div, canvas);
    new QRCode(div, {
      text: data, width:120, height:120,
      colorDark:'#1e40af', colorLight:'#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  }
  function _fallback() {
    const ctx = canvas.getContext('2d');
    canvas.width=120; canvas.height=120;
    ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,120,120);
    ctx.fillStyle='#1e40af';ctx.font='bold 10px Arial';
    ctx.textAlign='center';ctx.fillText('QR Code',60,55);
    ctx.font='8px Arial';ctx.fillStyle='#64748b';
    ctx.fillText('ZATCA',60,70);
  }
  if (typeof QRCode !== 'undefined') { _renderQR(); return; }
  if (document.querySelector('script[src*="qrcode.min.js"]')) {
    const t = setInterval(() => { if(typeof QRCode !== 'undefined') { clearInterval(t); _renderQR(); } }, 80);
    return;
  }
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  script.onload = _renderQR;
  script.onerror = _fallback;
  document.head.appendChild(script);
}

function deleteInvoice(id) {
  if(!confirm(lang==='ar'?'حذف الفاتورة نهائياً؟ سيتم عكس جميع القيود المحاسبية والمخزون.':'Delete invoice? All accounting entries will be reversed.'))return;
  const db=getDB();
  const inv=db.invoices.find(i=>i.id===id);
  if(!inv){db.invoices=db.invoices.filter(i=>i.id!==id);saveDB(db);renderPage();return;}

  // 1. عكس القيد اليومي — حذف القيد المرتبط بالفاتورة
  if(db.journal) db.journal=db.journal.filter(j=>j.ref!==inv.invoice_no);

  // 2. عكس المخزون — استرجاع الكميات المُبَاعة
  if(db.stock_moves && inv.items){
    inv.items.forEach(item=>{
      const prod=db.products.find(p=>p.id===item.id||p.name===item.name);
      if(prod){ prod.qty=Math.min(999999, (prod.qty||0)+item.qty); }
    });
    db.stock_moves=db.stock_moves.filter(m=>m.reference!==inv.invoice_no);
  }

  // 3. عكس الخزينة — خصم المبلغ المسدد فعلاً
  const paidAmt=parseFloat(inv.paid_amount||0);
  if(paidAmt>0){
    db.treasury.balance=Math.round((db.treasury.balance-paidAmt)*100)/100;
    db.treasury.moves=db.treasury.moves.filter(m=>m.reference!==inv.invoice_no);
  }

  // 4. عكس رصيد العميل — خصم المبلغ المتبقي
  const remaining=Math.max(0,(parseFloat(inv.grand_total||0))-(paidAmt));
  if(remaining>0 && inv.customer_name){
    const cust=db.customers.find(c=>c.name===inv.customer_name);
    if(cust) cust.balance=Math.round((Math.max(0,(cust.balance||0)-remaining))*100)/100;
  }

  db.invoices=db.invoices.filter(i=>i.id!==id);
  saveDB(db); renderPage();
}

function onGpVendorInput(val) {
  const db = getDB();
  const warn = el('gp-vendor-warn'); if(!warn) return;
  const name = val.trim().toLowerCase();

function niQty(idx,d){if(idx<0||idx>=newInvItems.length)return;newInvItems[idx].qty=Math.max(1,newInvItems[idx].qty+d);renderNewInvItems();calcNewInvTotals();}
function niSetQty(idx,v){if(idx<0||idx>=newInvItems.length)return;if(v<1)return;newInvItems[idx].qty=v;renderNewInvItems();calcNewInvTotals();}
function niSetPrice(idx,v){if(idx<0||idx>=newInvItems.length)return;newInvItems[idx].price=v;renderNewInvItems();calcNewInvTotals();}
function niRemove(idx){if(idx<0||idx>=newInvItems.length)return;newInvItems.splice(idx,1);renderNewInvItems();calcNewInvTotals();}

function calcNewInvTotals(){
  const sub=newInvItems.reduce((s,i)=>s+i.qty*i.price,0);
  const discVal=newInvDiscount.type==='percent'?sub*(newInvDiscount.value/100):newInvDiscount.value;
  const afterDisc=Math.max(0,sub-discVal);
  const vat=newInvVAT?afterDisc*0.15:0;
  const total=afterDisc+vat;
  const setTxt=(id,v)=>{const e=el(id);if(e)e.textContent=fmtMoney(v);};
  setTxt('ni-sum-sub',sub); setTxt('ni-sum-disc',discVal);
  setTxt('ni-sum-vat',vat); setTxt('ni-sum-total',total);
  // حساب وعرض المتبقي عند السداد الجزئي
  const partialEl = el('ni-partial-amount');
  const remainEl  = el('ni-remaining-val');
  if(partialEl && remainEl) {
    const paid      = Math.max(0, Number(partialEl.value||0));
    const remaining = Math.max(0, total - paid);
    remainEl.textContent = fmtMoney(remaining);
    // تحذير لو المبلغ المدخل أكبر من الإجمالي
    partialEl.style.borderColor = paid > total ? 'var(--danger)' : '';
  }
}

function saveNewInvoice(printAfter=false) {
  const db=getDB();
  if(!el('ni-customer')?.value){showToast(lang==='ar'?'العميل مطلوب':'Customer required','error');return;}
  if(newInvItems.length===0){showToast(lang==='ar'?'أضف صنفاً واحداً على الأقل':'Add at least one item','error');return;}
  const sub=newInvItems.reduce((s,i)=>s+i.qty*i.price,0);
  const discVal=newInvDiscount.type==='percent'?sub*(newInvDiscount.value/100):newInvDiscount.value;
  const afterDisc=Math.max(0,sub-discVal);
  const vat=newInvVAT?afterDisc*0.15:0;
  const total=afterDisc+vat;
  const payment=el('ni-payment').value;
  const partialPaid=payment==='جزئي'?Number(el('ni-partial-amount')?.value||0):payment==='آجل'?0:total;
  const status=payment==='آجل'?'آجل':payment==='جزئي'?'جزئي':'مسددة';
  // التحقق من صحة المبلغ الجزئي
  if(payment==='جزئي'){
    if(partialPaid<=0){showToast(lang==='ar'?'❌ أدخل المبلغ المسدد':'❌ Enter paid amount','error');return;}
    if(partialPaid>=total){showToast(lang==='ar'?'❌ المبلغ الجزئي يجب أن يكون أقل من الإجمالي — استخدم "نقدي" للسداد الكامل':'❌ Partial must be less than total','error');return;}
  }

  const inv={
    id:nextId(db,'invoice'),
    invoice_no:el('ni-no').value,
    customer_name:el('ni-customer').value,
    customer_vat:el('ni-customer-vat')?.value||'',
    items:newInvItems.map(i=>({...i,line_total:i.qty*i.price})),
    subtotal:afterDisc, discount:discVal, vat_total:vat, grand_total:total,
    payment_method:payment, status,
    invoice_type:el('ni-type').value,
    notes: el('ni-notes')?.value?.trim()||'',
    zatca_status:false, paid_amount:partialPaid,
    created_at:new Date(el('ni-date').value).toISOString()
  };

  // stock moves (FIFO)
  if(!db.stock_moves)db.stock_moves=[];
  if(!db.nextId.stock_move)db.nextId.stock_move=1;
  newInvItems.forEach(ni=>{
    const p=db.products.find(x=>x.id===ni.id);
    if(p){const oldQty=p.qty;
      fifoDeduct(p, ni.qty);
      p.qty=Math.max(0,p.qty-ni.qty);
      db.stock_moves.push({id:db.nextId.stock_move++,product_id:p.id,product_name:p.name,product_code:p.code||'',type:'out',qty:ni.qty,balance_before:oldQty,balance_after:p.qty,reason:'فاتورة مبيعات',reference:inv.invoice_no,date:new Date().toISOString()});}
  });

  // treasury
  if(partialPaid>0){
    db.treasury.balance+=partialPaid;
    db.treasury.moves.unshift({id:nextId(db,'treasury'),type:'in',amount:partialPaid,description:`فاتورة ${inv.invoice_no}`,reference:inv.invoice_no,date:new Date().toISOString()});
  }

  // Journal entry
  if(!db.journal)db.journal=[];
  if(!db.nextId.journal)db.nextId.journal=1;
  const invJEntries = [];
  if(payment==='آجل') {
    invJEntries.push({account:lang==='ar'?'الذمم المدينة':'Accounts Receivable',account_code:'1200',side:'debit',amount:total});
  } else if(payment==='جزئي') {
    if(partialPaid>0) invJEntries.push({account:lang==='ar'?'النقدية':'Cash',account_code:'1100',side:'debit',amount:partialPaid});
    if(total-partialPaid>0) invJEntries.push({account:lang==='ar'?'الذمم المدينة':'Accounts Receivable',account_code:'1200',side:'debit',amount:total-partialPaid});
  } else {
    invJEntries.push({account:lang==='ar'?'النقدية':'Cash',account_code:'1100',side:'debit',amount:total});
  }
  invJEntries.push({account:lang==='ar'?'إيرادات المبيعات':'Sales Revenue',account_code:'4100',side:'credit',amount:afterDisc});
  if(vat>0) invJEntries.push({account:lang==='ar'?'ضريبة المخرجات':'Output VAT',account_code:'2200',side:'credit',amount:vat});
  db.journal.push({id:db.nextId.journal++,date:new Date(el('ni-date').value).toISOString(),
    description:`فاتورة مبيعات: ${inv.invoice_no} — ${inv.customer_name}`,
    entries:invJEntries, ref:inv.invoice_no});

  // تحديث رصيد العميل بالمبلغ المتبقي (الذمم المدينة)
  const invRemaining = total - partialPaid;
  if(invRemaining > 0) {
    const cust = db.customers.find(c => c.name === inv.customer_name);
    if(cust) cust.balance = Math.round(((cust.balance||0) + invRemaining) * 100) / 100;
  }

  db.invoices.push(inv); saveDB(db);
  logActivity('مبيعات',`فاتورة ${inv.invoice_no} — ${inv.customer_name} — ${fmtMoney(total)}`);
  showToast(`✅ ${inv.invoice_no} — ${fmtMoney(total)}`);
  closeModal();
  if(printAfter) printSalesInvoice(inv.id);
  renderPage();
}

function calcGPLine() {
  const qty   = Number(el('gp-iqty')?.value  || 1);
  const price = Number(el('gp-iunit')?.value || 0);
  const linePre = qty * price;
  const unitVat  = Math.round(price   * 0.15 * 100) / 100;
  const lineVat  = Math.round(linePre * 0.15 * 100) / 100;
  const lineIncl = Math.round((linePre + lineVat) * 100) / 100;
  if (el('gp-iline'))        el('gp-iline').value = linePre.toFixed(2);
  if (el('gp-unit-vat'))     el('gp-unit-vat').textContent = `ضريبة الحبة: ${unitVat.toFixed(2)} ر.س`;
  const sumEl = el('gp-line-summary');
  if (sumEl) sumEl.style.display = price > 0 ? 'block' : 'none';
  if (el('gp-line-vat-show'))   el('gp-line-vat-show').textContent   = lineVat.toFixed(2);
  if (el('gp-line-total-show')) el('gp-line-total-show').textContent = lineIncl.toFixed(2);
}

function saveGoodsPurchase() {
  const db=getDB();
  if(!el('gp-vendor')?.value){showToast(lang==='ar'?'المورد مطلوب':'Supplier required','error');return;}
  if(!_goodsItems.length){showToast(lang==='ar'?'أضف صنفاً واحداً على الأقل':'Add at least one item','error');return;}
  const sub=_goodsItems.reduce((s,i)=>s+i.line_total,0);
  const vat=sub*0.15; const total=sub+vat;
  const payment=el('gp-payment').value;
  const paidNow=payment==='نقدي'?total:payment==='آجل'?0:Number(el('gp-paid')?.value||0);
  const remaining=total-paidNow;
  const status=payment==='نقدي'?'مسدد':payment==='آجل'?'آجل':'جزئي';

  const _vendorName = el('gp-vendor').value.trim();
  const _vendorRec  = db.suppliers.find(s => s.name.trim().toLowerCase() === _vendorName.toLowerCase());
  const p={
    id:nextId(db,'purchase'),
    vendor: _vendorName,
    supplier_id: _vendorRec?.id || null,
    description: _goodsItems.map(i=>i.name).join('، ') || (lang==='ar'?'فاتورة بضاعة':'Goods Invoice'),
    category:'بضاعة', purchase_type:'goods',
    items:[..._goodsItems],
    amount:sub, vat, total,
    payment_method:payment,
    paid_amount:paidNow,
    remaining_amount:remaining,
    status,
    supplier_ref:el('gp-ref')?.value||'',
    notes:el('gp-notes')?.value||'',
    created_at:new Date(el('gp-date').value).toISOString()
  };
  db.purchases.push(p);

  // Treasury: deduct only paid amount
  if(paidNow>0){
    db.treasury.balance-=paidNow;
    db.treasury.moves.unshift({id:nextId(db,'treasury'),type:'out',amount:paidNow,
      description:`مشتريات بضاعة: ${p.vendor}`,reference:p.supplier_ref||'',date:new Date().toISOString()});
  }

  // Journal entry
  if(!db.journal)db.journal=[];
  if(!db.nextId.journal)db.nextId.journal=1;
  db.journal.push({
    id:db.nextId.journal++,date:new Date().toISOString(),
    description:`فاتورة شراء بضاعة - ${p.vendor}`,
    entries:[
      {account:lang==='ar'?'المخزون':'Inventory',account_code:'1300',side:'debit',amount:sub},
      {account:lang==='ar'?'ضريبة المدخلات':'Input VAT',account_code:'2210',side:'debit',amount:vat},
      ...(paidNow>0?[{account:lang==='ar'?'النقدية':'Cash',account_code:'1100',side:'credit',amount:paidNow}]:[]),
      ...(remaining>0?[{account:lang==='ar'?'الذمم الدائنة':'Accounts Payable',account_code:'2100',side:'credit',amount:remaining}]:[]),
    ],
    ref:`PUR-${p.id}`
  });

  // تحديث رصيد المورد بالمبلغ المتبقي (الذمم الدائنة)
  if(remaining > 0) {
    const sup = db.suppliers.find(s => s.name === p.vendor);
    if(sup) sup.balance = Math.round(((sup.balance||0) + remaining) * 100) / 100;
  }

  saveDB(db);
  logActivity('مشتريات',`فاتورة بضاعة من ${p.vendor} — ${fmtMoney(total)} — ${status}`);
  showToast(`✅ ${lang==='ar'?`تم: ${p.vendor} — ${status}`:`Done: ${p.vendor} — ${status}`}`);
  _pendingInventoryItems = [..._goodsItems];
  _pendingPurchaseId = p.id;
  showInventoryAddDialog();
}
