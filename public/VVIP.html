<!-- ═══════════════════════════════════════════════════════
     Yaqiz API BRIDGE v1.0
     يربط VVIP.html بالـ Backend بدون تعديل الكود الأصلي.
     يعترض: doLogin, doLogout, saveDB, init
     ══════════════════════════════════════════════════════ -->
<script>
(function() {
  'use strict';

  const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? `http://${window.location.hostname}:3000`
    : window.location.origin;
  window._YAQIZ_API = API_BASE;
  const TOKEN_KEY   = 'yaqiz_access_token';
  const REFRESH_KEY = 'yaqiz_refresh_token';
  const SYNC_LOG    = false; // true لرؤية تفاصيل الـ sync في console

  // ── رصيد الـ DB السابق للمقارنة ──────────────────────────
  let _snap = null;
  window._apiReachable = false;
  let _apiReachable = false;
  let _syncBusy = false;

  // ── مزامنة الباقة من الباكند ─────────────────────────────
  async function syncPlanFromAPI() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token || !_apiReachable) return;
    try {
      const res = await fetch(`${API_BASE}/api/auth/me`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) return;
      const data = await res.json();
      if (!data.success || !data.data) return;
      const db = window.getDB();
      const oldPlan = db.settings?.plan;
      db.settings = db.settings || {};
      // مزامنة بيانات الشركة دائماً
      const d = data.data;
      if (d.company_name)    db.settings.company_name = d.company_name;
      if (d.company_vat)     db.settings.vat_number   = d.company_vat;
      if (d.company_cr)      db.settings.cr_number     = d.company_cr;
      if (d.company_phone)   db.settings.phone         = d.company_phone;
      if (d.company_address) db.settings.address       = d.company_address;
      if (d.company_city)    db.settings.city          = d.company_city;
      if (d.plan)            { db.settings.plan = d.plan; db.settings.plan_expires_at = d.subscription_expires_at||null; }
      window._origSaveDB ? window._origSaveDB(db) : window.saveDB(db);
      if (d.plan !== oldPlan) {
        window.renderShell?.();
        window.renderPage?.();
      }
    } catch(e) {}
  }
  // تشغيل كل 5 دقائق
  setInterval(syncPlanFromAPI, 5 * 60 * 1000);

  // ═══════════════════════════════════════════════════════
  // 1. HTTP CLIENT
  // ═══════════════════════════════════════════════════════
  async function apiFetch(method, path, body) {
    const token = localStorage.getItem(TOKEN_KEY);
    const opts  = {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: body ? JSON.stringify(body) : undefined
    };
    let res = await fetch(API_BASE + path, opts);
    if (res.status === 401) {
      const errBody = await res.json().catch(() => ({}));
      if (errBody.code === 'IMP_REVOKED') {
        // المستخدم ألغى الجلسة الإدارية
        sessionStorage.removeItem('_yaqiz_imp');
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(REFRESH_KEY);
        document.getElementById('_imp_banner')?.remove();
        alert('تم إلغاء الجلسة الإدارية من قِبل المستخدم.');
        window.close();
        return null;
      }
      const refreshed = await _tryRefresh();
      if (refreshed) {
        opts.headers['Authorization'] = `Bearer ${localStorage.getItem(TOKEN_KEY)}`;
        res = await fetch(API_BASE + path, opts);
      } else {
        window.doLogout?.();
        showToast(lang==='ar'?'انتهت جلستك، يرجى تسجيل الدخول مجدداً':'Session expired, please login again','error');
        return null;
      }
    }
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message||'API error'); }
    return res.json();
  }

  async function _tryRefresh() {
    const rt = localStorage.getItem(REFRESH_KEY);
    if (!rt) return false;
    try {
      const r = await fetch(`${API_BASE}/api/auth/refresh`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ refreshToken: rt })
      });
      if (!r.ok) return false;
      const d = await r.json();
      localStorage.setItem(TOKEN_KEY, d.accessToken);
      return true;
    } catch { return false; }
  }

  async function apiCheck() {
    if(window.location.protocol === 'file:') return false;
    try { await fetch(`${API_BASE}/health`,{signal:AbortSignal.timeout(6000)}); return true; }
    catch { return false; }
  }

  // ═══════════════════════════════════════════════════════
  // 2. TRANSFORMATIONS (API ↔ Frontend)
  // ═══════════════════════════════════════════════════════
  const STATUS_TO_API  = { 'مسددة':'paid','آجل':'issued','مدفوع جزئياً':'partial','ملغاة':'cancelled','paid':'paid','issued':'issued' };
  const STATUS_TO_FE   = { 'paid':'مسددة','issued':'آجل','partial':'مدفوع جزئياً','cancelled':'ملغاة','draft':'مسودة' };

  function invToAPI(inv) {
    const _liveDB = getDB(); // دائماً الحالة الحديثة من localStorage
    return {
      customer_name: inv.customer_name||'',
      customer_vat:  inv.customer_vat||'',
      invoice_type:  inv.invoice_type||'simplified',
      date: (inv.created_at||new Date().toISOString()).slice(0,10),
      payment_method: inv.payment_method||'نقدي',
      discount_type:  inv.discount>0 ? 'value' : null,
      discount_value: parseFloat(inv.discount)||0,
      notes: '',
      items: (inv.items||[]).map(it => {
        // البحث عن المنتج بالـ ID أولاً، ثم بالاسم كبديل (بعد مزامنة المنتجات قد يتغير الـ ID)
        const _prod = _liveDB.products.find(p=>p.id===(it.id||it.product_id)) ||
                      _liveDB.products.find(p=>p.name===(it.name||it.product_name));
        return {
          product_id:   _prod?.id || it.id || null,
          product_name: it.name||it.product_name||'',
          qty:          parseFloat(it.qty)||1,
          unit_price:   parseFloat(it.price||it.unit_price)||0,
          discount:     parseFloat(it.discount)||0,
          tax_rate:     15
        };
      })
    };
  }

  function invToFE(inv) {
    return {
      id: inv.id, invoice_no: inv.invoice_no,
      customer_name: inv.customer_name||'',
      customer_vat:  inv.customer_vat||'',
      items: (inv.items||[]).map(it => ({
        name: it.product_name, qty: parseFloat(it.qty),
        price: parseFloat(it.unit_price), line_total: parseFloat(it.line_total)
      })),
      subtotal:       parseFloat(inv.subtotal)||0,
      discount:       parseFloat(inv.discount_amount)||0,
      vat_total:      parseFloat(inv.vat_amount)||0,
      grand_total:    parseFloat(inv.grand_total)||0,
      paid_amount:    parseFloat(inv.paid_amount)||0,
      remaining_amount: parseFloat(inv.grand_total||0) - parseFloat(inv.paid_amount||0),
      payment_method: inv.payment_method||'',
      status:         STATUS_TO_FE[inv.status]||inv.status,
      invoice_type:   inv.invoice_type||'simplified',
      zatca_status:   inv.zatca_status==='accepted',
      created_at:     inv.created_at
    };
  }

  function productToFE(p) {
    return {
      id: p.id, name: p.name, name_en: p.name_en||'',
      code: p.code||'', barcode: p.barcode||'',
      category: p.category_name||'', unit: p.unit_name||'قطعة',
      buy_price: parseFloat(p.buy_price)||0,
      sell_price: parseFloat(p.sell_price)||0,
      qty: parseFloat(p.qty)||0, min_qty: parseFloat(p.min_qty)||0,
      tax_rate: parseFloat(p.tax_rate)||15,
      is_active: p.is_active!==false, notes: p.notes||'',
      profit_policy_type:  p.profit_policy_type  || 'none',
      profit_policy_value: parseFloat(p.profit_policy_value) || 0,
      auto_price_update:   p.auto_price_update    === true
    };
  }

  function productToAPI(p) {
    return {
      name: p.name, name_en: p.name_en||'', code: p.code||'',
      barcode: p.barcode||'',
      buy_price: parseFloat(p.buy_price)||0,
      sell_price: parseFloat(p.sell_price)||0,
      qty: parseFloat(p.qty)||0, min_qty: parseFloat(p.min_qty)||0,
      tax_rate: parseFloat(p.tax_rate)||15, notes: p.notes||''
    };
  }

  function customerToFE(c) {
    return {
      id: c.id, name: c.name, phone: c.phone||'',
      vat_num: c.vat_number||'',
      email: c.email||'', address: c.address||'',
      credit_limit: parseFloat(c.credit_limit)||0,
      balance: parseFloat(c.balance)||0,
      loyalty_points: parseInt(c.loyalty_points)||0,
      is_active: c.is_active!==false
    };
  }

  function supplierToFE(s) {
    return {
      id: s.id, name: s.name, phone: s.phone||'',
      vat_num: s.vat_number||'',
      email: s.email||'', address: s.address||'',
      balance: parseFloat(s.balance)||0,
      is_active: s.is_active!==false
    };
  }

  function purchaseToFE(p) {
    const cat = p.category||'';
    return {
      id: p.id, vendor: p.supplier_name||p.vendor||'',
      description: p.description||'', category: cat,
      purchase_type: p.purchase_type || (cat==='بضاعة'||cat==='مواد خام'||cat==='بضاعة جاهزة'||cat==='مواد تغليف' ? 'goods' : 'opex'),
      amount: parseFloat(p.amount)||0,
      vat: parseFloat(p.vat_amount)||0,
      total: parseFloat(p.total)||0,
      items: (p.items_json||[]).map(it=>({name:it.name||'',qty:parseFloat(it.qty)||1,price:parseFloat(it.price)||0,line_total:parseFloat(it.line_total)||0})),
      paid_amount: parseFloat(p.paid_amount)||0,
      remaining_amount: parseFloat(p.remaining)||0,
      payment_method: p.payment_method||'نقدي',
      supplier_ref: p.supplier_ref||'',
      notes: p.notes||'',
      deductible: p.deductible!==false,
      status: p.status||'unpaid',
      purchase_no: p.purchase_no||'',
      created_at: p.created_at
    };
  }

  function employeeToFE(e) {
    return {
      id: e.id, name: e.name, position: e.position||'',
      department: e.department||'', phone: e.phone||'',
      email: e.email||'',
      salary: parseFloat(e.salary)||0,
      allowances: parseFloat(e.allowances)||0,
      status: e.status||'active',
      start_date: e.start_date||''
    };
  }

  const QUOTE_STATUS_FE = { draft:'معلق', sent:'مرسل', accepted:'مقبول', rejected:'مرفوض' };
  const QUOTE_STATUS_API = { 'معلق':'draft','مرسل':'sent','مقبول':'accepted','مرفوض':'rejected' };

  function quoteToFE(q) {
    return {
      id: q.id, quote_no: q.quote_no,
      customer_name: q.customer_name || q.customer_name_db || '',
      items: (q.items || []).map(i => ({
        name: i.product_name || '', qty: parseFloat(i.qty) || 1,
        price: parseFloat(i.unit_price) || 0,
        line_total: parseFloat(i.line_total) || 0
      })),
      subtotal:    parseFloat(q.subtotal)    || 0,
      vat_total:   parseFloat(q.vat_amount)  || 0,
      grand_total: parseFloat(q.grand_total) || 0,
      notes:       q.notes || '',
      valid_until: q.valid_until ? q.valid_until.slice(0, 10) : '',
      status:      QUOTE_STATUS_FE[q.status] || q.status || 'معلق',
      converted_to: q.converted_invoice_id ? true : undefined,
      created_at:  q.created_at
    };
  }

  function quoteToAPI(q) {
    return {
      customer_name: q.customer_name || '',
      date: (q.created_at || new Date().toISOString()).slice(0, 10),
      valid_until: q.valid_until || null,
      status: QUOTE_STATUS_API[q.status] || 'draft',
      notes: q.notes || '',
      items: (q.items || []).map(i => ({
        product_name: i.name || '', qty: parseFloat(i.qty) || 1,
        unit_price: parseFloat(i.price) || 0, discount: 0
      }))
    };
  }

  // ═══════════════════════════════════════════════════════
  // 3. LOAD ALL DATA FROM API
  // ═══════════════════════════════════════════════════════
  async function loadAllFromAPI() {
    try {
      const [prods, custs, supps, invRes, purRes, empRes, treas, quotesRes, usersRes, meRes] = await Promise.all([
        apiFetch('GET', '/api/products?active=all'),
        apiFetch('GET', '/api/customers?active=all'),
        apiFetch('GET', '/api/suppliers?active=all'),
        apiFetch('GET', '/api/invoices?limit=500'),
        apiFetch('GET', '/api/purchases?limit=500'),
        apiFetch('GET', '/api/employees'),
        apiFetch('GET', '/api/treasury/accounts'),
        apiFetch('GET', '/api/quotes?limit=500'),
        apiFetch('GET', '/api/users').catch(() => null),
        apiFetch('GET', '/api/auth/me').catch(() => null),
      ]);

      const db = getDB();

      if (prods?.data)    db.products   = prods.data.filter(p=>p.is_active!==false).map(productToFE);
      if (custs?.data)    db.customers  = custs.data.filter(c=>c.is_active!==false).map(customerToFE);
      if (supps?.data)    db.suppliers  = supps.data.filter(s=>s.is_active!==false).map(supplierToFE);
      if (invRes?.data)   db.invoices   = invRes.data.map(invToFE);
      if (purRes?.data)   db.purchases  = purRes.data.map(purchaseToFE);
      if (empRes?.data)   db.employees  = empRes.data.map(employeeToFE);

      if (treas?.data?.length) {
        const defaultAcc = treas.data.find(a => a.is_default) || treas.data[0];
        db.treasury      = db.treasury || {};
        db.treasury.balance = parseFloat(defaultAcc.balance) || 0;
      }
      if (quotesRes?.data) db.quotes = quotesRes.data.map(quoteToFE);

      // مزامنة بيانات الشركة في الإعدادات
      if (meRes?.data) {
        const m = meRes.data;
        db.settings = db.settings || {};
        if (m.company_name)    db.settings.company_name = m.company_name;
        if (m.company_vat)     db.settings.vat_number   = m.company_vat;
        if (m.company_cr)      db.settings.cr_number     = m.company_cr;
        if (m.company_phone)   db.settings.phone         = m.company_phone;
        if (m.company_address) db.settings.address       = m.company_address;
        if (m.company_city)    db.settings.city          = m.company_city;
        if (m.plan)            db.settings.plan          = m.plan;
        if (m.subscription_expires_at) db.settings.plan_expires_at = m.subscription_expires_at;
      }

      // مزامنة قائمة المستخدمين من API
      if (usersRes?.data) {
        const apiUsers = usersRes.data.map(u => ({
          id:           u.id,
          username:     u.username,
          full_name:    u.full_name,
          role:         u.role,
          permissions:  u.permissions || [],
          pos_access:   u.pos_access  || false,
          shift_enabled:u.shift_enabled || false,
          active:       u.active !== false,
          last_login:   u.last_login,
        }));
        // أضف المستخدم الحالي إذا لم يكن في القائمة
        if (currentUser && !apiUsers.find(x => x.id === currentUser.id)) {
          apiUsers.push({ ...currentUser });
        }
        db.users = apiUsers;
      }

      _origSaveDB(db); // لا تستخدم saveDB الـ hooked حتى لا تُطلق _diffAndPush بناءً على بيانات API
      _snap = JSON.parse(JSON.stringify(db));
      if (SYNC_LOG) console.log('✅ API data loaded into localStorage');
    } catch (e) {
      console.warn('⚠️ Could not load from API:', e.message);
    }
  }

  // تعريض apiFetch للكود الخارجي (لإدارة المستخدمين)
  window._cloudApiFetch = apiFetch;

  // ═══════════════════════════════════════════════════════
  // 4. DIFF & SYNC (saveDB hook)
  // ═══════════════════════════════════════════════════════
  const _origSaveDB = window.saveDB;
  window.saveDB = function(newDB) {
    _origSaveDB(newDB); // localStorage أولاً — لا تأخير
    if (_apiReachable && localStorage.getItem(TOKEN_KEY)) {
      _schedulSync(newDB);
    }
  };

  // ── استبدال ID المحلي بـ UUID من قاعدة البيانات بعد الإنشاء ──
  function _replaceLocalId(entity, localId, apiId) {
    try {
      const db = getDB();
      const items = db[entity] || [];
      const idx = items.findIndex(i => i.id === localId);
      if (idx >= 0) { items[idx].id = apiId; _origSaveDB(db); }
      if (_snap?.[entity]) {
        const si = _snap[entity].findIndex(i => i.id === localId);
        if (si >= 0) _snap[entity][si].id = apiId;
      }
    } catch(e) { /* ignore */ }
  }

  function _schedulSync(newDB) {
    if (!_snap) { _snap = JSON.parse(JSON.stringify(newDB)); return; }
    const prev = _snap;
    _snap = JSON.parse(JSON.stringify(newDB));
    setTimeout(() => _diffAndPush(newDB, prev), 100);
  }

  async function _diffAndPush(newDB, prev) {
    if (_syncBusy) return;
    _syncBusy = true;
    try {

      // ── Products: create / update / deactivate ──────────
      for (const p of newDB.products || []) {
        const old = (prev.products || []).find(o => o.id === p.id);
        if (!old) {
          if (SYNC_LOG) console.log('→ API: create product', p.name);
          const res = await apiFetch('POST', '/api/products', productToAPI(p)).catch(e => { console.warn('product create:', e.message); return null; });
          if (res?.data?.id && res.data.id !== p.id) _replaceLocalId('products', p.id, res.data.id);
        } else if (JSON.stringify(p) !== JSON.stringify(old)) {
          if (SYNC_LOG) console.log('→ API: update product', p.name);
          await apiFetch('PUT', `/api/products/${p.id}`, productToAPI(p)).catch(e => console.warn('product update:', e.message));
        }
      }
      for (const old of prev.products || []) {
        if (!(newDB.products || []).find(i => i.id === old.id)) {
          if (SYNC_LOG) console.log('→ API: deactivate product', old.name);
          await apiFetch('DELETE', `/api/products/${old.id}`).catch(() => {});
        }
      }

      // ── Customers: create / update / remove ─────────────
      for (const c of newDB.customers || []) {
        const old = (prev.customers || []).find(o => o.id === c.id);
        const body = { name: c.name, phone: c.phone, email: c.email, address: c.address,
                       vat_number: c.vat_num, credit_limit: c.credit_limit || 0,
                       balance: c.balance || 0 };
        if (!old) {
          if (SYNC_LOG) console.log('→ API: create customer', c.name);
          const res = await apiFetch('POST', '/api/customers', body).catch(e => { console.warn('customer create:', e.message); return null; });
          if (res?.data?.id && res.data.id !== c.id) _replaceLocalId('customers', c.id, res.data.id);
        } else if (JSON.stringify(c) !== JSON.stringify(old)) {
          if (SYNC_LOG) console.log('→ API: update customer', c.name);
          await apiFetch('PUT', `/api/customers/${c.id}`, body).catch(e => console.warn('customer update:', e.message));
        }
      }
      for (const old of prev.customers || []) {
        if (!(newDB.customers || []).find(i => i.id === old.id)) {
          if (SYNC_LOG) console.log('→ API: remove customer', old.name);
          await apiFetch('DELETE', `/api/customers/${old.id}`).catch(() => {});
        }
      }

      // ── Suppliers: create / update / remove ─────────────
      for (const s of newDB.suppliers || []) {
        const old = (prev.suppliers || []).find(o => o.id === s.id);
        const body = { name: s.name, phone: s.phone, email: s.email,
                       address: s.address, vat_number: s.vat_num,
                       balance: s.balance || 0 };
        if (!old) {
          if (SYNC_LOG) console.log('→ API: create supplier', s.name);
          const res = await apiFetch('POST', '/api/suppliers', body).catch(e => { console.warn('supplier create:', e.message); return null; });
          if (res?.data?.id && res.data.id !== s.id) _replaceLocalId('suppliers', s.id, res.data.id);
        } else if (JSON.stringify(s) !== JSON.stringify(old)) {
          if (SYNC_LOG) console.log('→ API: update supplier', s.name);
          await apiFetch('PUT', `/api/suppliers/${s.id}`, body).catch(e => console.warn('supplier update:', e.message));
        }
      }
      for (const old of prev.suppliers || []) {
        if (!(newDB.suppliers || []).find(i => i.id === old.id)) {
          if (SYNC_LOG) console.log('→ API: remove supplier', old.name);
          await apiFetch('DELETE', `/api/suppliers/${old.id}`).catch(() => {});
        }
      }

      // ── Employees: create / update / remove ─────────────
      for (const e of newDB.employees || []) {
        const old = (prev.employees || []).find(o => o.id === e.id);
        const body = { name: e.name, position: e.position, department: e.department,
                       phone: e.phone, email: e.email, salary: e.salary || 0,
                       allowances: e.allowances || 0, status: e.status || 'active' };
        if (!old) {
          if (SYNC_LOG) console.log('→ API: create employee', e.name);
          const res = await apiFetch('POST', '/api/employees', body).catch(e => { console.warn('employee create:', e.message); return null; });
          if (res?.data?.id && res.data.id !== e.id) _replaceLocalId('employees', e.id, res.data.id);
        } else if (JSON.stringify(e) !== JSON.stringify(old)) {
          if (SYNC_LOG) console.log('→ API: update employee', e.name);
          await apiFetch('PUT', `/api/employees/${e.id}`, body).catch(e => console.warn('employee update:', e.message));
        }
      }
      for (const old of prev.employees || []) {
        if (!(newDB.employees || []).find(i => i.id === old.id)) {
          if (SYNC_LOG) console.log('→ API: remove employee', old.name);
          await apiFetch('DELETE', `/api/employees/${old.id}`).catch(() => {});
        }
      }

      // ── Purchases: create / update ───────────────────────
      for (const p of newDB.purchases || []) {
        const old = (prev.purchases || []).find(o => o.id === p.id);
        if (!old) {
          if (SYNC_LOG) console.log('→ API: create purchase', p.vendor);
          const _ldb2 = getDB();
          const _sup2 = p.supplier_id
            ? _ldb2.suppliers.find(s => s.id === p.supplier_id)
            : _ldb2.suppliers.find(s => s.name.trim().toLowerCase() === (p.vendor||'').trim().toLowerCase());
          const res = await apiFetch('POST', '/api/purchases', {
            supplier_id:   _sup2?.id || null,
            supplier_name: p.vendor, description: p.description,
            category: p.category, date: (p.created_at || new Date().toISOString()).slice(0, 10),
            purchase_type: p.purchase_type || ((p.category === 'بضاعة' || p.category === 'goods') ? 'goods' : 'opex'),
            amount: parseFloat(p.amount) || 0, vat_amount: parseFloat(p.vat) || 0,
            payment_method: p.payment_method || 'نقدي', deductible: p.deductible !== false,
            supplier_ref: p.supplier_ref||'', notes: p.notes||'',
            items: (p.items||[]).filter(it=>it.name||it.product_id).map(it=>{
              const _pr=_ldb2.products.find(x=>x.id===it.product_id)||_ldb2.products.find(x=>x.name===it.name);
              return {product_id:_pr?.id||it.product_id||null, name:it.name||_pr?.name||'', qty:parseFloat(it.qty)||1, unit_cost:parseFloat(it.price||it.unit_price||it.unit_cost||0)};
            }).filter(it=>it.name||it.product_id)
          }).catch(e => { console.warn('purchase create:', e.message); return null; });
          if (res?.data?.id) {
            if (res.data.id !== p.id) _replaceLocalId('purchases', p.id, res.data.id);
            if (res.data.purchase_no) {
              try {
                const _db = getDB();
                const _pur = _db.purchases.find(x => x.id === res.data.id);
                if (_pur) { _pur.purchase_no = res.data.purchase_no; _origSaveDB(_db); }
              } catch {}
            }
          }
        } else if (JSON.stringify(p) !== JSON.stringify(old)) {
          const _oldPaid = parseFloat(old.paid_amount||0);
          const _newPaid = parseFloat(p.paid_amount||0);
          if (_newPaid > _oldPaid + 0.01) {
            if (SYNC_LOG) console.log('→ API: purchase payment', p.vendor, _newPaid - _oldPaid);
            const _payAmt = Math.round((_newPaid - _oldPaid)*100)/100;
            await apiFetch('POST', `/api/purchases/${p.id}/addPayment`, { amount: _payAmt })
              .catch(e => console.warn('purchase payment:', e.message));
          } else {
            if (SYNC_LOG) console.log('→ API: update purchase', p.vendor);
            await apiFetch('PUT', `/api/purchases/${p.id}`, {
              supplier_name: p.vendor, description: p.description,
              amount: parseFloat(p.amount)||0, vat_amount: parseFloat(p.vat)||0
            }).catch(e => console.warn('purchase update:', e.message));
          }
        }
      }

      // ── Invoices: create جديدة / cancel ملغاة ────────────
      for (const inv of newDB.invoices || []) {
        const old = (prev.invoices || []).find(o => o.id === inv.id);
        if (!old) {
          if (SYNC_LOG) console.log('→ API: create invoice', inv.invoice_no);
          const res = await apiFetch('POST', '/api/invoices', invToAPI(inv)).catch(e => { console.warn('invoice sync:', e.message); return null; });
          if (res?.data?.id && res.data.id !== inv.id) _replaceLocalId('invoices', inv.id, res.data.id);
        } else if (old.status !== 'ملغاة' && inv.status === 'ملغاة') {
          if (SYNC_LOG) console.log('→ API: cancel invoice', inv.invoice_no);
          await apiFetch('POST', `/api/invoices/${inv.id}/cancel`, { reason: 'إلغاء من الواجهة' }).catch(e => console.warn('invoice cancel:', e.message));
        }
      }

      // ── Quotes: create / update status / delete ───────────
      for (const q of newDB.quotes || []) {
        const old = (prev.quotes || []).find(o => o.id === q.id);
        if (!old) {
          if (SYNC_LOG) console.log('→ API: create quote', q.quote_no);
          const res = await apiFetch('POST', '/api/quotes', quoteToAPI(q)).catch(e => { console.warn('quote create:', e.message); return null; });
          if (res?.data?.id && res.data.id !== q.id) _replaceLocalId('quotes', q.id, res.data.id);
        } else if (old.status !== q.status) {
          if (SYNC_LOG) console.log('→ API: update quote status', q.quote_no, q.status);
          await apiFetch('PUT', `/api/quotes/${q.id}`, { status: q.status, notes: q.notes }).catch(e => console.warn('quote update:', e.message));
        }
      }
      for (const old of prev.quotes || []) {
        if (!(newDB.quotes || []).find(i => i.id === old.id)) {
          if (SYNC_LOG) console.log('→ API: delete quote', old.quote_no);
          await apiFetch('DELETE', `/api/quotes/${old.id}`).catch(() => {});
        }
      }

    } finally {
      _syncBusy = false;
    }
  }

  const _origDoLogin = window.doLogin;
  window.doLogin = async function() {
    if (!_apiReachable) { _origDoLogin(); return; } // fallback to localStorage

    const username = document.getElementById('l-user')?.value?.trim();
    const password = document.getElementById('l-pass')?.value;
    const errEl    = document.getElementById('l-err');

    // Rate limit check (existing)
    const lockMsg = window.checkLoginRateLimit?.();
    if (lockMsg) { if(errEl){errEl.style.display='block';errEl.textContent=lockMsg;} return; }

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!data.success) {
        window.recordLoginAttempt?.(false);
        if (errEl) { errEl.style.display='block'; errEl.textContent = data.message||'بيانات غير صحيحة'; }
        return;
      }

      // حفظ الـ tokens
      localStorage.setItem(TOKEN_KEY,   data.accessToken);
      localStorage.setItem(REFRESH_KEY, data.refreshToken);
      window.recordLoginAttempt?.(true);

      // بناء currentUser من رد الـ API بنفس شكل الـ frontend
      const apiUser = data.user;
      const u = {
        id: apiUser.id, username: apiUser.username,
        full_name: apiUser.full_name, role: apiUser.role,
        permissions: apiUser.permissions||[], active: true,
        pos_access: apiUser.pos_access, shift_enabled: false
      };

      // حفظ بيانات الشركة في الإعدادات فوراً
      const db = getDB();
      db.settings = db.settings || {};
      if (apiUser.company_name)    db.settings.company_name = apiUser.company_name;
      if (apiUser.company_vat)     db.settings.vat_number   = apiUser.company_vat;
      if (apiUser.company_cr)      db.settings.cr_number     = apiUser.company_cr;
      if (apiUser.company_phone)   db.settings.phone         = apiUser.company_phone;
      if (apiUser.company_address) db.settings.address       = apiUser.company_address;
      if (apiUser.company_city)    db.settings.city          = apiUser.company_city;
      if (apiUser.plan)            db.settings.plan          = apiUser.plan;
      if (apiUser.subscription_expires_at) db.settings.plan_expires_at = apiUser.subscription_expires_at;
      // تحديث قاعدة المستخدمين المحلية
      const idx = db.users.findIndex(x => x.id === u.id || x.username === u.username);
      if (idx >= 0) db.users[idx] = { ...db.users[idx], ...u };
      else db.users.push(u);
      _origSaveDB(db);

      currentUser = u;
      localStorage.setItem('yaqiz_user', JSON.stringify(u));
      window.resetSessionTimer?.();

      // تحميل البيانات من API
      _showSyncBar('جاري تحميل البيانات...');
      await loadAllFromAPI();
      _hideSyncBar();

      window.logActivity?.('نظام', `تسجيل دخول (API): ${u.full_name}`);
      window.renderApp?.();

    } catch (err) {
      console.warn('API login failed, falling back to local:', err.message);
      _origDoLogin();
    }
  };

  async function bridgeInit() {
    // ── تحقق من كود الدخول الإداري (?code=...) ──
    const _params = new URLSearchParams(window.location.search);
    const _impCode = _params.get('code');
    if (_impCode) {
      window.history.replaceState({}, '', window.location.pathname); // امسح الكود من URL فوراً
      try {
        const _coNameHint = decodeURIComponent(_params.get('co') || 'الشركة');
        const _redeemRes = await fetch(`${API_BASE}/api/auth/redeem-imp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: _impCode })
        });
        const _redeemData = await _redeemRes.json();
        if (!_redeemData.success) {
          alert('الرابط منتهي الصلاحية أو استُخدم من قبل.\nيرجى إنشاء رابط جديد من لوحة الأدمن.');
          return;
        }
        const _coName = _redeemData.company_name || _coNameHint;
        localStorage.setItem(TOKEN_KEY, _redeemData.token);
        localStorage.removeItem(REFRESH_KEY);
        sessionStorage.setItem('_yaqiz_imp', JSON.stringify({ company: _coName, by: _redeemData.user?.username || 'admin' }));
        _showImpersonationBanner(_coName);
      } catch {
        alert('خطأ في الاتصال بالخادم. تأكد من تشغيل السيرفر.');
        return;
      }
    }

    // ── اعرض بانر الـ impersonation إن كان محفوظاً في الجلسة ──
    const _impData = sessionStorage.getItem('_yaqiz_imp');
    if (_impData && !_impCode) {
      try { _showImpersonationBanner(JSON.parse(_impData).company); } catch {}
    }

    _apiReachable = await apiCheck();
    window._apiReachable = _apiReachable;
    if (!_apiReachable) { _showOfflineBar(); return; }

    // مزامنة الباقة فور الاتصال بالباكند
    syncPlanFromAPI();

    // إضافة زر التسجيل على شاشة الدخول (إذا ظهرت)
    setTimeout(_addRegisterButton, 100);

    // إذا كان عنده token محفوظ → استعد الجلسة
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) {
      try {
        const me = await apiFetch('GET', '/api/auth/me');
        if (me?.data) {
          const u = {
            id: me.data.id, username: me.data.username,
            full_name: me.data.full_name, role: me.data.role,
            permissions: me.data.permissions||[], active: true,
            pos_access: me.data.pos_access, shift_enabled: false
          };
          currentUser = u;
          localStorage.setItem('yaqiz_user', JSON.stringify(u));
          _showSyncBar('مزامنة البيانات...');
          try {
            const _preDB = getDB();
            const _unsyncedPurch = (_preDB.purchases||[]).filter(p => !p.purchase_no);
            const _hasLocalPaid  = (_preDB.purchases||[]).some(p => p.purchase_no && parseFloat(p.paid_amount||0) > 0);

            if (_unsyncedPurch.length > 0 || _hasLocalPaid) {
              // جلب المشتريات من API مرة واحدة للمقارنة
              const _apiPurRes = await apiFetch('GET', '/api/purchases').catch(() => null);
              const _apiPurs = _apiPurRes?.data || [];

              // أ) مزامنة مدفوعات معلقة لمشتريات مربوطة بالـ API
              for (const p of (_preDB.purchases||[]).filter(p => p.purchase_no)) {
                const _ap = _apiPurs.find(a => a.purchase_no === p.purchase_no || a.id === p.id);
                if (_ap && parseFloat(p.paid_amount||0) > parseFloat(_ap.paid_amount||0) + 0.01) {
                  const _delta = Math.round((parseFloat(p.paid_amount) - parseFloat(_ap.paid_amount||0))*100)/100;
                  await apiFetch('POST', `/api/purchases/${p.id}/addPayment`, { amount: _delta }).catch(()=>null);
                }
              }

              // ب) إنشاء أو ربط المشتريات غير المتزامنة (مع تجنب التكرار)
              for (const p of _unsyncedPurch) {
                const _pDate = (p.created_at||new Date().toISOString()).slice(0,10);
                // هل أُنشئت بالفعل في API (طلب سابق في رحلة وصل للسيرفر لكن الرد ما وصل للعميل)؟
                const _existing = _apiPurs.find(a =>
                  (a.supplier_name||'') === (p.vendor||'') &&
                  Math.abs(parseFloat(a.total||0) - parseFloat(p.total||0)) < 0.01 &&
                  (a.date||'').slice(0,10) === _pDate
                );
                if (_existing) {
                  if (_existing.id !== p.id) _replaceLocalId('purchases', p.id, _existing.id);
                  if (_existing.purchase_no) {
                    const _db2 = getDB();
                    const _p2 = _db2.purchases.find(x=>x.id===_existing.id);
                    if (_p2 && !_p2.purchase_no) { _p2.purchase_no = _existing.purchase_no; _origSaveDB(_db2); }
                  }
                  continue;
                }
                // غير موجودة → أنشئها
                const res = await apiFetch('POST', '/api/purchases', {
                  supplier_name: p.vendor||'', description: p.description||'',
                  category: p.category||'', date: _pDate,
                  purchase_type: p.purchase_type||'opex',
                  amount: parseFloat(p.amount)||0, vat_amount: parseFloat(p.vat)||0,
                  payment_method: p.payment_method||'نقدي', deductible: p.deductible!==false,
                  supplier_ref: p.supplier_ref||'', notes: p.notes||'',
                  items: (p.items||[]).filter(it=>it.product_id||it.name).map(it=>{
                    const _ldb=getDB(); const _pr=_ldb.products.find(x=>x.id===it.product_id)||_ldb.products.find(x=>x.name===it.name);
                    return {product_id:_pr?.id||it.product_id, qty:it.qty, unit_cost:it.price||it.unit_price||0};
                  }).filter(it=>it.product_id)
                }).catch(()=>null);
                if (res?.data?.id) {
                  if (res.data.id !== p.id) _replaceLocalId('purchases', p.id, res.data.id);
                  if (res.data.purchase_no) {
                    const _db2 = getDB();
                    const _p2 = _db2.purchases.find(x=>x.id===res.data.id);
                    if (_p2) { _p2.purchase_no = res.data.purchase_no; _origSaveDB(_db2); }
                  }
                }
              }
            }
          } catch {}
          await loadAllFromAPI();
          _hideSyncBar();
          window.renderApp?.();
          return;
        }
      } catch { /* token منتهي، يتجدد تلقائياً */ }
    }

    _hideSyncBar();
  }

  window._doRegister = async function() {
    const errEl = document.getElementById('_reg_err');
    const btn   = document.getElementById('_r_submit');
    errEl.style.display = 'none';

    const body = {
      company_name:  document.getElementById('_r_company').value.trim(),
      vat_number:    document.getElementById('_r_vat').value.trim(),
      cr_number:     document.getElementById('_r_cr')?.value.trim() || '',
      city:          document.getElementById('_r_city').value.trim(),
      contact_email: document.getElementById('_r_email').value.trim(),
      contact_phone: document.getElementById('_r_contact_phone').value.trim(),
      full_name:     document.getElementById('_r_name').value.trim(),
      username:      document.getElementById('_r_user').value.trim(),
      password:      document.getElementById('_r_pass').value,
    };

    if (!body.company_name || !body.username || !body.password || !body.full_name) {
      errEl.textContent = 'يرجى تعبئة الحقول المطلوبة (*)'; errEl.style.display = 'block'; return;
    }
    if (!body.contact_email && !body.contact_phone) {
      errEl.textContent = '⚠️ يجب تعبئة البريد الإلكتروني أو رقم الجوال على الأقل للتواصل'; errEl.style.display = 'block';
      document.getElementById('_r_email')?.focus(); return;
    }
    if (body.password.length < 8) {
      errEl.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل'; errEl.style.display = 'block'; return;
    }

    btn.disabled = true; btn.textContent = 'جاري الإنشاء...';
    try {
      const res  = await fetch(`${API_BASE}/api/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!data.success) {
        errEl.textContent = data.message || 'حدث خطأ'; errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'إنشاء الحساب'; return;
      }
      // حفظ الـ tokens وتسجيل الدخول
      localStorage.setItem(TOKEN_KEY,   data.accessToken);
      localStorage.setItem(REFRESH_KEY, data.refreshToken);

      const u = { ...data.user, active: true, pos_access: true, shift_enabled: false, permissions: [] };
      currentUser = u;
      localStorage.setItem('yaqiz_user', JSON.stringify(u));
      closeModal();
      _showSyncBar('جاري تهيئة حسابك...');
      await loadAllFromAPI();
      _hideSyncBar();
      window.logActivity?.('نظام', `تسجيل منشأة جديدة: ${body.company_name}`);
      window.renderApp?.();
    } catch(e) {
      errEl.textContent = 'تعذر الاتصال بالخادم'; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'إنشاء الحساب';
    }
  };

  // ═══════════════════════════════════════════════════════
  // 9. PWA — Service Worker + Manifest (HTTP فقط)
  // ═══════════════════════════════════════════════════════
  if (location.protocol !== 'file:' && 'serviceWorker' in navigator) {
    // Manifest link
    const mlink = document.createElement('link');
    mlink.rel = 'manifest'; mlink.href = '/public/manifest.json';
    document.head.appendChild(mlink);

    // Theme color
    const tmeta = document.createElement('meta');
    tmeta.name = 'theme-color'; tmeta.content = '#1e40af';
    document.head.appendChild(tmeta);

    // Service Worker — من / لكي يغطي كل التطبيق
    navigator.serviceWorker.register('/sw.js')
      .then(reg => {
        if (SYNC_LOG) console.log('✅ SW registered:', reg.scope);
        // زر التثبيت
        window.addEventListener('beforeinstallprompt', e => {
          e.preventDefault();
          let bar = document.getElementById('_yaqiz_sync_bar');
          if (!bar) return;
          bar.innerHTML = '📲 اضغط للتثبيت كتطبيق';
          bar.style.background = '#1e40af';
          bar.style.cursor = 'pointer';
          bar.style.display = 'flex';
          bar.onclick = () => { e.prompt(); bar.style.display = 'none'; };
          setTimeout(() => { if(bar)bar.style.display='none'; }, 8000);
        });
      })
      .catch(err => console.warn('SW registration failed:', err.message));
  }

  // CSS لـ spin animation + AI progress
  const style = document.createElement('style');
  style.textContent = '@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}@keyframes progressPulse{0%{width:0%;margin-left:0}50%{width:70%;margin-left:0}75%{width:70%;margin-left:30%}100%{width:0%;margin-left:100%}}';
  document.head.appendChild(style);

  if (SYNC_LOG) console.log('🔌 Yaqiz API Bridge loaded v2');
})();
</script>
</body>
